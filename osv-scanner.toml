#
# osv-scanner reads this file for the lockfiles in this directory: the
# workspace's Cargo.lock. It scans the lockfile as text, so it also reports
# packages the lockfile records but no build resolves — which cargo-deny,
# reading the resolved graph, does not. Each entry below is one of those or a
# mirror of a `deny.toml` ignore, with the evidence and a date on which the
# entry stops applying and must be re-examined (`osv.yml`).
#
# No active waivers since 2026-10-23. The last, RUSTSEC-2023-0071 (`rsa`,
# Marvin timing side channel, no fixed release), covered rsa 0.9.10, which
# the lockfile carried only for sqlx-mysql 0.8, a driver no feature enables.
# With sqlx 0.9 (0.15.0) `rsa` is in none of the repository's nine
# Cargo.lock files.
