#
# osv-scanner reads this file for the lockfiles in this directory: the
# workspace's Cargo.lock. It scans the lockfile as text, so it also reports
# packages the lockfile records but no build resolves — which cargo-deny,
# reading the resolved graph, does not. Each entry below is one of those or a
# mirror of a `deny.toml` ignore, with the evidence and a date on which the
# entry stops applying and must be re-examined (`osv.yml`).
#
# Before GHSA-qwgh-2vcv-g2f7 below, no active waivers since 2026-10-23. The last, RUSTSEC-2023-0071 (`rsa`,
# Marvin timing side channel, no fixed release), covered rsa 0.9.10, which
# the lockfile carried only for sqlx-mysql 0.8, a driver no feature enables.
# With sqlx 0.9 (0.15.0) `rsa` is in none of the repository's nine
# Cargo.lock files.

# GHSA-qwgh-2vcv-g2f7 (block-buffer, "panic corrupts inline buffer
# position"; OSV range: every version before 0.12.1). Locked here is 0.10.4,
# through digest 0.10 and sha2 0.10, with no 0.10.x release carrying a fix.
# The advisory's mechanism is absent from 0.10.4: the cursor the advisory
# corrupts is stored inside the block in the 0.11 and 0.12 releases, but in
# 0.10.4 it is a separate `pos: u8` field (src/lib.rs:62), written only after
# the callback returns and never handed to it, and 0.10 has no `ReadBuffer`.
# Checked 2026-10-29 under Miri (nightly 2026-10-28): the advisory's PoC
# ported to 0.10.4 runs clean and the position stays 2; the same PoC on
# 0.11.0 trips the crate's own invariant check in `get_pos`.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-29
reason = "block-buffer 0.10.4 (via digest/sha2 0.10, no fixed 0.10.x) keeps its cursor in a separate field, not in the block the advisory corrupts; the advisory's PoC runs clean under Miri on 0.10.4 (2026-10-29). Remove when the lock moves to digest 0.11 / block-buffer >= 0.12.1."
