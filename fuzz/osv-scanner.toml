# RUSTSEC-2026-0459 (libsqlite3-sys < 0.39.0, bundled SQLite before 3.54.0).
# Locked here: 0.37.0 through sqlx-sqlite 0.9.0, the latest sqlx. This crate
# enables a2a-protocol-server's `sqlite` feature only so the sealed-value
# decoders compile (fuzz/Cargo.toml); no fuzz target opens a database file.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-02-11
reason = "libsqlite3-sys 0.37 via sqlx-sqlite 0.9.0, the latest sqlx (checked 2026-11-11); the fuzz crate compiles the sqlite feature for the sealed-value decoders and opens no database file. Remove when sqlx allows libsqlite3-sys >= 0.39."
