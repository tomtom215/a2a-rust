# Copyright 2026 Tom F. <tomf@tomtomtech.net> (https://github.com/tomtom215)

# This crate is deliberately NOT a member of the root workspace, and it has its
# own Cargo.lock. `agntcy-slim-rpc` brings 359 transitive dependencies —
# including `aws-lc-sys`, a native C crypto build — against 11 for
# `a2a-protocol-types` at its defaults and 206 for `a2a-protocol-server` at all
# features — normal edges only, as `cargo tree --edges normal` counts them,
# deduplicated by name and version, 2026-09-25; add build-dependencies and the
# server reading is 240. None
# of that belongs in the lockfile, the `deny.toml` allow-list, or the audit
# surface of the four published crates, which do not depend on this one.
#
# The dependency arrow points one way: this crate depends on them, through the
# public extension points (`Transport`, `RequestHandler`, `protocol_binding`).
# Nothing here required a change to any of them.

[workspace]

[package]
name         = "a2a-protocol-slimrpc"
version      = "0.7.0"
edition      = "2024"
rust-version = "1.94"
license      = "Apache-2.0"
authors      = ["Tom F."]
repository   = "https://github.com/tomtom215/a2a-rust"
homepage     = "https://a2a-rust.com"
description  = "SLIMRPC custom protocol binding for the a2a-protocol SDK — A2A over the AGNTCY SLIM fabric"
keywords     = ["a2a", "agent2agent", "slim", "slimrpc", "agntcy"]
categories   = ["network-programming", "api-bindings"]
# Versioned independently of the four SDK crates, and deliberately so.
#
# This crate's public API is new. Numbering it 0.8.0 to match the SDK would
# claim eight minor versions of accumulated stability it has not earned, and
# would then bump on every SDK release even when nothing here changed, making
# its changelog useless. Independence also decouples the cadence: a fix here
# ships without waiting for an SDK release, which matters precisely because
# this binding exists to be adopted by third parties.
#
# What independence does NOT buy, and the reason the SDK requirement below is a
# tight `0.15` rather than a range: `a2a-protocol-server` and
# `a2a-protocol-types` are *public* dependencies. `SlimRpcServer::builder`
# takes `Arc<RequestHandler>` and `agent_interface()` returns an
# `AgentInterface`, so a caller must be using the same SDK version this crate
# compiled against. Allow two and cargo will happily link both, and the caller
# gets "expected RequestHandler, found RequestHandler". So every SDK minor bump
# requires a release here; only the version *numbers* are independent, not the
# release schedule.
publish = true

[dependencies]
# The A2A SDK. `proto` gives the canonical `lf.a2a.v1` prost types plus lossless
# conversions to and from the serde domain types — SLIMRPC uses the same
# protobuf service definitions as gRPC, so the message layer is already done.
#
# `version` alongside `path` is what makes this publishable: cargo uses the path
# for local development and rewrites it to the version requirement in the
# packaged manifest.
a2a-protocol-types  = { version = "0.15", path = "../../crates/a2a-protocol-types", features = ["proto"] }
a2a-protocol-client = { version = "0.15", path = "../../crates/a2a-protocol-client", default-features = false }
# At its defaults, `tracing` and `otel`, as every other crate here takes it:
# each call's `SERVER` span and `rpc.server.call.duration` (ADR 0013) reach
# whatever subscriber and OpenTelemetry provider the process installs. Until
# 2026-10-23 this was `default-features = false`, left from before `tracing`
# and `otel` were the server's defaults (2026-10-14), so a SLIMRPC call
# recorded no span outside this crate's own tests.
a2a-protocol-server = { version = "0.15", path = "../../crates/a2a-protocol-server" }

# SLIM. `slim_rpc` is the RPC layer; the others supply the App/Service/Name
# types its constructors take.
slim-rpc      = { package = "agntcy-slim-rpc",      version = "3.4" }
slim-auth     = { package = "agntcy-slim-auth",     version = "0.17" }
slim-datapath = { package = "agntcy-slim-datapath", version = "0.19" }
slim-service  = { package = "agntcy-slim-service",  version = "0.13" }
slim-config   = { package = "agntcy-slim-config",   version = "0.17" }
slim-session  = { package = "agntcy-slim-session",  version = "0.7" }

prost       = "0.14"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
futures    = "0.3"
tokio      = { version = ">=1.54.1, <2", features = ["rt", "rt-multi-thread", "sync", "macros", "signal", "time"] }
thiserror  = "2"
# SLIM's TLS provider, `aws-lc-rs`, installed as the process default by
# `install_crypto_provider` (`src/lib.rs`). Already in the graph through SLIM.
rustls     = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

[features]
default = ["otlp"]
## OTLP export: the SDK's `Telemetry`, configured from the standard `OTEL_*`
## environment, in the `slim-node` binary and the `in_process` example, as
## every other binary in the repository builds it, and the server's OTLP
## exporters for an application that builds its own.
##
## On by default since 2026-10-23. Two conflicts with SLIM's own
## dependencies kept it off until then, both measured:
##
## - the server's `otlp` turned on tonic's TLS through `opentelemetry-otlp`,
##   and tonic then refused the `https://` endpoint SLIM dials through its
##   own connector ("Connecting to HTTPS without TLS enabled", retried
##   forever; `remote_node_tls.rs` and `remote_node_mtls.rs` hung). The
##   server's OTLP/gRPC now dials TLS through its own connector, so no tonic
##   TLS is linked for it.
## - the server links rustls with `ring` beside SLIM's `aws-lc-rs`, so rustls
##   has no process-wide provider and SLIM's first TLS handshake panics
##   ("Could not automatically determine the process-level CryptoProvider").
##   `SlimRpcServer::builder().build()` and `SlimRpcTransport::builder()
##   .connect()` install `aws-lc-rs` first when none is installed; code that
##   connects a SLIM `Service` of its own before either calls
##   `install_crypto_provider()` first.
##
## `default-features = false` drops the exporters and `Telemetry`.
otlp = ["a2a-protocol-server/otlp"]

[[bin]]
name = "slim-node"
path = "src/bin/slim_node.rs"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
# `tests/telemetry.rs` and the span tests read the server's spans through a
# test subscriber: `tracing` for that subscriber. The server's `tracing`
# feature is on through its defaults in `[dependencies]` above.
tracing            = "0.1"
rcgen              = "0.14"

tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
