# This crate is deliberately NOT a member of the root workspace, and it has its
# own Cargo.lock. `agntcy-slim-rpc` brings 379 transitive dependencies —
# including `aws-lc-sys`, a native C crypto build — against 12 for
# `a2a-protocol-types` and 191 for `a2a-protocol-server` at all features. None
# of that belongs in the lockfile, the `deny.toml` allow-list, or the audit
# surface of the four published crates, which do not depend on this one.
#
# The dependency arrow points one way: this crate depends on them, through the
# public extension points (`Transport`, `RequestHandler`, `protocol_binding`).
# Nothing here required a change to any of them.

[workspace]

[package]
name        = "a2a-protocol-slimrpc"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
authors     = ["Tom F."]
repository  = "https://github.com/tomtom215/a2a-rust"
homepage    = "https://a2a-rust.com"
description = "SLIMRPC custom protocol binding for the a2a-protocol SDK — A2A over the AGNTCY SLIM fabric"
keywords    = ["a2a", "agent2agent", "slim", "slimrpc", "agntcy"]
categories  = ["network-programming", "api-bindings"]
# Versioned independently of the four SDK crates, and deliberately so.
#
# This crate's public API is new. Numbering it 0.8.0 to match the SDK would
# claim eight minor versions of accumulated stability it has not earned, and
# would then bump on every SDK release even when nothing here changed, making
# its changelog useless. Independence also decouples the cadence: a fix here
# ships without waiting for an SDK release, which matters precisely because
# this binding exists to be adopted by third parties.
#
# What independence does NOT buy, and the reason the SDK requirement below is a
# tight `0.8` rather than a range: `a2a-protocol-server` and
# `a2a-protocol-types` are *public* dependencies. `SlimRpcServer::builder`
# takes `Arc<RequestHandler>` and `agent_interface()` returns an
# `AgentInterface`, so a caller must be using the same SDK version this crate
# compiled against. Allow two and cargo will happily link both, and the caller
# gets "expected RequestHandler, found RequestHandler". So every SDK minor bump
# requires a release here; only the version *numbers* are independent, not the
# release schedule.
publish = true

[dependencies]
# The A2A SDK. `proto` gives the canonical `lf.a2a.v1` prost types plus lossless
# conversions to and from the serde domain types — SLIMRPC uses the same
# protobuf service definitions as gRPC, so the message layer is already done.
#
# `version` alongside `path` is what makes this publishable: cargo uses the path
# for local development and rewrites it to the version requirement in the
# packaged manifest.
a2a-protocol-types  = { version = "0.8", path = "../../crates/a2a-protocol-types", features = ["proto"] }
a2a-protocol-client = { version = "0.8", path = "../../crates/a2a-protocol-client", default-features = false }
a2a-protocol-server = { version = "0.8", path = "../../crates/a2a-protocol-server", default-features = false }

# SLIM. `slim_rpc` is the RPC layer; the others supply the App/Service/Name
# types its constructors take.
slim-rpc      = { package = "agntcy-slim-rpc",      version = "2.3" }
slim-auth     = { package = "agntcy-slim-auth",     version = "0.15" }
slim-datapath = { package = "agntcy-slim-datapath", version = "0.18" }
slim-service  = { package = "agntcy-slim-service",  version = "0.12" }
slim-config   = { package = "agntcy-slim-config",   version = "0.16" }
slim-session  = { package = "agntcy-slim-session",  version = "0.7" }

prost       = "0.14"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
futures    = "0.3"
tokio      = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "signal"] }
thiserror  = "2"

[[bin]]
name = "slim-node"
path = "src/bin/slim_node.rs"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rcgen              = "0.14"

tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
