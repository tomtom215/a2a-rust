#
# cargo-deny configuration for the SLIMRPC binding.
# Run from this directory: cargo deny check
#
# ---------------------------------------------------------------------------
# Why this file exists at all
# ---------------------------------------------------------------------------
#
# `bindings/a2a-protocol-slimrpc` is deliberately outside the workspace, and
# the root `deny.toml` is resolved against the workspace manifest — so until
# this file existed, the binding's 379 transitive dependencies were audited by
# nothing. That is the wrong place for a gap: the binding is `publish = true`,
# so those dependencies reach users, and they include `aws-lc-sys`, a native C
# crypto build. The four workspace crates were gated and the one shipping a C
# compiler was not.
#
# The isolation itself is right — none of that tree belongs in the lockfile or
# audit surface of the published four. Isolation from the *lockfile* was never
# meant to be isolation from the *audit*.
#
# ---------------------------------------------------------------------------
# How this differs from the root policy, and why
# ---------------------------------------------------------------------------
#
# Everything that bears on security is set as strict here as at the root:
# advisories deny, yanked crates deny, unknown registries and git sources
# deny, and the license allowlist is the root's. There are no advisory
# exceptions: the five there were are recorded, with how each was removed,
# under `[advisories]` below. They existed because the SLIM tree foreclosed
# the fix, not because the policy is looser here.
#
# The one deliberate relaxation is `multiple-versions`, and the reason is that
# the root's justification for "deny" does not transfer. There, a reviewed skip
# list is honest because the duplicates arise in trees this project chooses and
# could in principle act on. Here the entire graph below `agntcy-slim-rpc` is
# someone else's: this repo cannot upgrade `der`, cannot align `syn`, and gains
# nothing by going red when AGNTCY bumps a transitive pin. A skip list of 14
# entries maintained against a tree we do not own is not a reviewed exemption,
# it is a changelog we would be obliged to keep. Duplicate versions are a
# binary-size concern; the security concerns are the ones set to deny above.
#
# Measured 2026-08-17 with cargo-deny 0.19.0 against the committed Cargo.lock:
# advisories **ok** — no known vulnerability in any of the 379. (That reading
# is history: RUSTSEC-2026-0285 was published since, and is the ignore below.
# Re-measured 2026-09-16 with cargo-deny 0.20.2: all four checks ok with that
# one entry in place.) Licenses: one
# addition to the root allowlist, `MIT-0`, noted below. Sources: ok. Bans:
# 14 crates duplicated (base64, block-buffer, const-oid, cpufeatures,
# crypto-common, der, digest, foldhash, num-bigint, reqwest, shlex, spin, syn,
# untrusted), all inside the SLIM tree.
#
# Note for reproducing this locally: cargo-deny **0.19.0 or newer** is
# required. 0.18.x aborts loading the advisory database on any CVSS 4.0 entry
# ("unsupported CVSS version: 4.0"), which is a hard error, not a skipped
# advisory — an older binary reports nothing and looks like it passed.

[graph]
all-features        = false
no-default-features = false

# ---------------------------------------------------------------------------
# License policy — the root allowlist, plus one
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.8
# As in the root policy: an allowance nothing in this tree uses fails the
# check. `CDLA-Permissive-2.0` matched nothing here until 2026-10-15 and was
# left out (audit N17); the SLIM 3.x tree needs it, below.
unused-allowed-license = "deny"

allow = [
    "Apache-2.0",
    "MIT",
    # MIT No Attribution: MIT with the attribution requirement removed, so it
    # is strictly more permissive than a license already on this list. Reaches
    # the graph through `borrow-or-share`, a `fluent-uri` dependency. This is
    # the only license in the SLIM tree the root policy did not already allow.
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # The root allows it for the same crate. `webpki-root-certs` 1.0.9 (the
    # Mozilla root certificates, as data) arrives through
    # rustls-platform-verifier 0.7.1 under reqwest 0.13.5, which
    # agntcy-slim-auth 0.17.5 depends on; added 2026-10-15 with the SLIM 3.x
    # upgrade, when cargo-deny rejected it.
    "CDLA-Permissive-2.0",
]

# ---------------------------------------------------------------------------
# Security advisories — the reason this file was written
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked  = "deny"
# No active ignore since 2026-10-23. Six entries were removed, each when its
# own removal condition was met. Five on 2026-10-15, when the binding moved
# from agntcy-slim-rpc 2.3.0 to 3.4.1 (audit register R13):
#
# RUSTSEC-2026-0285 (rustls < 0.23.45), added 2026-09-16, and
# RUSTSEC-2026-0346, -0348 and -0349 (rustls < 0.23.46), added 2026-10-14.
#   rustls could not move past 0.23.43 because mls-rs-crypto-awslc, under
#   agntcy-slim-auth, pinned aws-lc-rs below the ^1.18 rustls 0.23.45 needs
#   (0.23.0 `=1.16.2`, 0.25.0 `=1.16.3`). The condition to remove them was
#   that `cargo update -p rustls --precise 0.23.46` succeed here. Under
#   agntcy-slim-auth 0.17.5 the lock takes mls-rs-crypto-awslc 0.25.1, which
#   pins aws-lc-rs `=1.18.1` (its Cargo.toml, read 2026-10-15), and that
#   command succeeded on 2026-10-15: rustls 0.23.43 -> 0.23.46, rustls-webpki
#   0.103.13 -> 0.103.15. The lockfile carries it.
#
# RUSTSEC-2024-0449 (unsafe-libyaml unmaintained), added 2026-10-12.
#   It arrived as serde_yaml 0.9.34+deprecated under agntcy-slim-config
#   0.16.1 and regorus 0.11.0. The condition was a slim-config release
#   without serde_yaml and the binding's move to it: agntcy-slim-config
#   0.17.5 takes yaml_serde (on libyaml-rs) and agntcy-slim-auth 0.17.5 takes
#   regorus 0.12.0. On 2026-10-15 `cargo tree -i unsafe-libyaml` and
#   `cargo tree -i serde_yaml` both match no package in this lock.
#
# Measured 2026-10-15 with cargo-deny 0.20.2 against the new lock, before
# removing them: all five reported as `advisory-not-detected` and advisories
# ok. osv-scanner 2.6.0 with no waivers reports no issues in the new lock's
# 534 packages, and the same five in the old one. osv-scanner.toml beside
# this file drops its matching entries.
#
# mls-rs-crypto-awslc 0.25.1 (yanked), added 2026-10-19.
#   crates.io shows it yanked on 2026-10-19 (the version's updated_at,
#   18:15 UTC), with no yank message and no RustSec advisory naming the
#   crate. It cannot be updated away: every agntcy-slim-mls release this
#   graph can take (0.4.11, 0.4.12, 0.5.0) requires `^0.25.1`, and 0.26.0 is
#   outside that range. Nor should it be downgraded: 0.25.0 pins aws-lc-rs
#   `=1.16.3`, which holds rustls below 0.23.45 and so brings back
#   RUSTSEC-2026-0285, -0346, -0348 and -0349 (see above). A yank with no
#   stated defect is the lesser risk than four known ones.
#   The condition to remove it was an agntcy-slim-mls release accepting
#   mls-rs-crypto-awslc 0.26 and the binding moving to it. agntcy-slim-mls
#   0.5.1 does: on 2026-10-23 a plain `cargo update` here took
#   agntcy-slim-rpc 3.4.3 -> 3.4.6, agntcy-slim-mls 0.4.11 -> 0.5.1 and
#   mls-rs-crypto-awslc 0.25.1 -> 0.26.0, leaving rustls at 0.23.46 and
#   aws-lc-rs at 1.18.1, and cargo-deny 0.20 then reported this entry as
#   "yanked crate not detected" with advisories ok. Removed that day.
ignore  = []

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
# See the header: "warn" here is a considered difference from the root's
# "deny", not the unreviewed default the root comment warns about.
multiple-versions = "warn"
wildcards         = "warn"

# The root bans `reqwest` to keep its 30-plus transitive dependencies out of
# the published crates, allowing it only under the two example agents that
# genuinely need an HTTP client. That ban is not repeated here, and repeating
# it would be theatre: `reqwest` arrives twice in this graph, 0.12 under the
# SLIM stack and 0.13 under `opentelemetry-otlp`, neither of which this repo
# selects. The reason the root gives — avoiding a large transitive tree — is
# already moot in a crate that took some 360 dependencies to exist.
deny = []

# ---------------------------------------------------------------------------
# Source policy — crates.io only, same as the root
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git      = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
