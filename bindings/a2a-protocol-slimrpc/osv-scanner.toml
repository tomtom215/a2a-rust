#
# osv-scanner's view of this binding's Cargo.lock. Mirrors the ignores in
# this directory's deny.toml, whose notes give the full dependency chains.
#
# One active waiver, RUSTSEC-2026-0459 below, since 2026-11-11 (the mirror of
# deny.toml's entry for it). Six entries were removed on 2026-10-15, with the
# binding's move to agntcy-slim-rpc 3.4.1 (audit register R13); deny.toml's
# `[advisories]` note records why each could go:
#
#   RUSTSEC-2026-0285 and its alias GHSA-2mjx-qc3c-rqvc, GHSA-w44r-93j7-qv28,
#   GHSA-c8m5-c952-6cm4 and GHSA-h2v8-394m-p7vv (rustls < 0.23.45 / 0.23.46):
#   the lock now has rustls 0.23.46.
#   RUSTSEC-2024-0449 (unsafe-libyaml unmaintained): no longer in the lock.
#
# Measured the same day with osv-scanner 2.6.0 and an empty config: the new
# lock's 534 packages, "No issues found"; the previous lock, the same five
# advisories these entries waived.
#
# History: GHSA-qwgh-2vcv-g2f7 (block-buffer 0.10.4) was waived on 2026-10-29
# and removed on 2026-11-11. OSV narrowed that advisory on 2026-10-30 to
# block_buffer 0.11.0 up to, not including, 0.12.1, so 0.10.4 is outside it;
# the lockfiles here hold 0.10.4 and 0.12.1, and osv-scanner 2.7.0 reported
# the waiver as unused in all four files that carried it. The Miri check that
# found the mechanism absent from 0.10.4 stands in the git history of this file.

# RUSTSEC-2026-0459 (libsqlite3-sys < 0.39.0, bundled SQLite before 3.54.0).
# Locked here: 0.35.0, through rusqlite 0.37 <- mls-rs-provider-sqlite 0.23.0
# <- agntcy-slim-persistence 0.2.1 <- agntcy-slim-mls 0.5.1, each the latest
# published (checked 2026-11-11). The fix needs rusqlite 0.41 or newer. The
# binding's own code opens no SQLite file; SLIM's MLS persistence opens the
# path SLIM is configured with, which is the operator's.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-02-11
reason = "libsqlite3-sys 0.35 via rusqlite 0.37 via mls-rs-provider-sqlite 0.23.0 (latest, checked 2026-11-11); local attack through a crafted database and -wal pair on a path the operator configures; mirrors the deny.toml ignore. Remove when the SLIM chain moves to rusqlite >= 0.41."
