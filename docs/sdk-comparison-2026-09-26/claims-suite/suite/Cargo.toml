[package]
name = "claims-suite"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
a2a-protocol-sdk = { version = "=0.14.0", features = ["websocket", "grpc", "grpc-tls", "signing", "sqlite", "axum", "otel", "auth-jwt"] }
a2a-protocol-server = { version = "=0.14.0", features = ["websocket", "grpc", "grpc-tls", "signing", "sqlite", "axum", "otel", "auth-jwt"] }
a2a-protocol-client = { version = "=0.14.0", features = ["websocket", "grpc", "grpc-tls", "signing"] }
a2a-protocol-types = { version = "=0.14.0", features = ["signing"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tempfile = "3"
ring = "0.17"
base64 = "0.22"

# Standalone: not a member of the repository workspace.
[workspace]
