[package]
name = "agent-rs"
version = "0.0.0"
edition = "2024"
publish = false

# Published crates.io releases only — no path or git dependencies.
[dependencies]
a2a = { package = "a2a-lf", version = "=0.3.1" }
a2a-server = { package = "a2a-server-lf", version = "=0.4.4" }
a2a-grpc = { version = "=0.3.7" }
a2a-pb = { version = "=0.2.1" }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde_json = "1"
futures = "0.3"
chrono = "0.4"

[profile.release]
debug = false

# Standalone: not a member of the repository workspace.
[workspace]
