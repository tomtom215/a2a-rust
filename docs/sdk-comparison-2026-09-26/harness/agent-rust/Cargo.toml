[package]
name = "agent-rust"
version = "0.0.0"
edition = "2024"
publish = false

# Published crates.io release only — no path or git dependencies.
[dependencies]
a2a-protocol-sdk = { version = "=0.14.0", features = ["grpc"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde_json = "1"
futures = "0.3"
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
debug = false

# Standalone: not a member of the repository workspace.
[workspace]
