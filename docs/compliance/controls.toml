[[control]]
id = "AIA-14-5"
source = "ai-act"
provision = "Art. 14(5)"
requirement = "For high-risk AI systems referred to in point 1(a) of Annex III, the oversight measures ensure that no action or decision is taken by the deployer on the basis of the identification resulting from the system unless that identification has been separately verified and confirmed by at least two natural persons with the necessary competence, training and authority; this does not apply to systems used for law enforcement, migration, border control or asylum where Union or national law considers it disproportionate. Text read 2026-10-20 in the Official Journal edition of Regulation (EU) 2024/1689 (OJ L, 2024/1689, 12.7.2024, from the Publications Office); whether Regulation (EU) 2026/1744 amends this paragraph was not checked that day."
sdk = "The approval extension holds a task at `input-required` until an authenticated approver the `ApprovalGate` allows confirms the digest of the exact action (AIA-14-4d). `ApprovalGate::with_quorum(2)` holds it until two distinct allowed approvers, told apart by authenticated identity, have each sent their own approval of the same request and digest: the requester is refused, an approver approving twice counts once, a decision on another digest is refused and not counted, and a deny from any approver ends it. Until then the executor does not run and each approver is answered with the task still `input-required`; the executor then sees the decision with every approver named. Each decision is its own audit record (who, request id, digest, the count so far, whether it reached the executor). The count is kept on the task's status message, so replicas sharing a task store count together."
status = "supported"
code = [
  "crates/a2a-protocol-server/src/approval.rs::ApprovalGate::with_quorum",
  "crates/a2a-protocol-server/src/approval/quorum.rs::ApprovalGate::tally",
