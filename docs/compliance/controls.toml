#
# Source of docs/compliance/control-map.md. Edit this file, then run
#   scripts/check_compliance_map.py --write
# CI runs `--check`, which fails when a cited test, file or CI step no longer
# exists, or when the Markdown is stale. Statuses:
#
#   supported   the SDK does what the row says; at least one cited test or CI
#               step proves it
#   documented  satisfied by a document or a process, cited as evidence
#   partial     some of it; `gap` says what is missing
#   gap         none of it yet; `gap` says what would close it
#   integrator  not something a protocol library can do; `gap` says why, and
#               what the SDK offers the integrator who must
#
# Whatever its status, every row cites a test (`tests`) or a CI step (`ci`)
# that proves what its `sdk` text says the SDK offers (maintainer's decision,
# 2026-10-23). A row whose `sdk` text is that a document says something cites
# the map's own CI step, and DOC_CLAIMS in the script quotes what the document
# must keep saying. A row whose `sdk` text says the SDK offers nothing cites
# nothing and is listed, with the reason, in UNCITED in the script.

[meta]
as_of = "2026-10-23"
preamble = """
This is a map from regulatory and standards provisions to what a2a-rust, a
protocol library, provides toward them. It is not a claim that the SDK is
compliant with anything: the EU AI Act places no obligation on this SDK,
which is neither an AI system nor a provider (Regulation (EU) 2024/1689,
Articles 3(1) and 3(3)). Article 25(4) requires a written agreement between
a high-risk system's provider and a third party supplying it components, and
exempts from that agreement a third party making components other than
general-purpose AI models accessible to the public under a free and
open-source licence, as this SDK is; Regulation (EU) 2026/1744 rewrote the
paragraph's first subparagraph and kept the exemption. The exemption is from
that paragraph only, not from the rest of Article 25. The obligations below
belong to whoever builds an AI system
or a product with this SDK. Each row says how much of one this SDK carries
for them, with the test that proves it, and what is left. Not legal advice.
"""

[[sources]]
id = "ai-act"
title = "EU AI Act — Regulation (EU) 2024/1689, as amended by Regulation (EU) 2026/1744"
url = "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
verification = "primary"
note = """
Article text of Regulation (EU) 2024/1689 read on EUR-Lex on 2026-10-08;
the amending Regulation (EU) 2026/1744 read in its Official Journal edition
(OJ L, 2026/1744, 24.7.2026; in force 27 July 2026) on 2026-10-15, every page
rendered. Application dates, Article 113 as amended: Chapters I and II from
2 February 2025, except the Article 5 prohibitions 2026/1744 added, from
2 December 2026; Article 50 from 2 August 2026, with until 2 December 2026 for
Article 50(2) where a generative system was on the market before 2 August
2026 (Article 111(4)); Annex III high-risk obligations from 2 December 2027;
Annex I high-risk obligations from 2 August 2028. Annex XIV, added by
2026/1744, lists the types of AI system a notified body is designated to
assess, and its code AIH 0401 names "Agentic AI": a high-risk system built
from A2A agents has a category for its third-party conformity assessment.
Articles 5, 6, 16, 43 and 47-49 of Regulation (EU) 2024/1689 read in its
Official Journal edition (OJ L, 2024/1689, 12.7.2024), fetched from the
Publications Office on 2026-10-15, those pages rendered.
"""

