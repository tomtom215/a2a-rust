  "crates/a2a-protocol-server/src/store/sqlite_store/event_log_tests.rs::deleting_a_task_removes_its_log",
  "crates/a2a-protocol-server/src/store/sqlite_store/artifact_delta_tests.rs::deleting_a_task_discards_its_journalled_parts",
  "crates/a2a-protocol-server/src/store/tenant_sqlite_store.rs::deleting_a_task_removes_its_log_and_leaves_other_tenants_alone",
  "crates/a2a-protocol-server/tests/erase_caller.rs::erase_caller_removes_a_callers_data_from_the_in_memory_stores",
