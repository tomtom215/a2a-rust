# ── EU AI Act ────────────────────────────────────────────────────────────────

[[control]]
id = "AIA-2-12"
source = "ai-act"
provision = "Art. 2(12)"
requirement = "This Regulation does not apply to AI systems released under free and open-source licences, unless they are placed on the market or put into service as high-risk AI systems or as an AI system that falls under Article 5 or 50. Text read 2026-10-20 in the Official Journal edition of Regulation (EU) 2024/1689 (OJ L, 2024/1689, 12.7.2024, from the Publications Office); whether Regulation (EU) 2026/1744 amends this paragraph was not checked that day."
sdk = "Nothing is needed: the SDK is neither an AI system nor a provider of one (Art. 3(1), 3(3)), so it is outside the Regulation for that reason, not under this paragraph. It is published under Apache-2.0, which an integrator releasing an agent built on it can keep."
status = "integrator"
gap = "The exemption is the integrator's to claim for an AI system it releases, and it does not hold for a system placed on the market or put into service as high-risk, or one that falls under Article 5 or Article 50, so an open-source agent that must mark its output (AIA-50-2) or disclose itself (AIA-50-1) owes that whatever its licence."
ci = ["python3 scripts/check_compliance_map.py --check"]

[[control]]
id = "AIA-4"
source = "ai-act"
provision = "Art. 4 (as replaced by Regulation (EU) 2026/1744)"
requirement = "Providers and deployers take measures to support the AI literacy of their staff and others operating and using AI systems on their behalf; no specific level of literacy is required of any individual."
sdk = "The book documents what the SDK does and does not do, including the deployment chapters on audit, oversight and provenance."
status = "integrator"
ci = [
  "python3 scripts/check_compliance_map.py --check",
]
gap = "Literacy measures are an organisation's duty toward its own people; a library has no staff to train."

[[control]]
id = "AIA-4a"
source = "ai-act"
provision = "Art. 4a (inserted by Regulation (EU) 2026/1744)"
requirement = "Providers of high-risk AI systems may exceptionally process special categories of personal data to the extent strictly necessary for bias detection and correction, under all of paragraph 1's conditions: other data will not do, technical limits on re-use with state-of-the-art security and pseudonymisation, controlled and documented access, no transmission to other parties, deletion once the bias is corrected or the retention period ends, and records of processing that say why. Providers and deployers of other AI systems and models, and deployers of high-risk systems, may do the same under the same conditions; this creates no obligation to detect bias. Article 10(5), which held the provider's basis before, is deleted."
sdk = "The SDK processes no data set and detects no bias. What passes through it is the integrator's data: audit records hold content only as digests, and with the `encryption` feature both the audit trail and the task store protect what they hold (GDPR-25-1)."
status = "integrator"
tests = [
  "crates/a2a-protocol-server/tests/audit_trail.rs::every_call_and_event_is_recorded_and_attributable",
  "crates/a2a-protocol-server/tests/encrypted_store.rs::a_handler_over_the_wrapper_stores_no_plaintext_and_serves_it_whole",
  "crates/a2a-protocol-server/src/audit/privacy/tests.rs::a_protected_record_names_no_one_and_still_verifies",
]
gap = "Whether to process special categories for bias detection, and every safeguard paragraph 1 requires, belong to the provider or deployer that holds the data. `EncryptedTaskStore` encrypts task content but leaves ids, `metadata` and the like readable (GDPR-25-1), so special-category data belongs in parts, if it is routed through tasks at all."

[[control]]
id = "AIA-5-1"
source = "ai-act"
provision = "Art. 5(1)(a)–(h), 5(2)–(8) (from 2 February 2025)"
requirement = "Prohibited: AI systems that deploy subliminal, purposefully manipulative or deceptive techniques materially distorting behaviour and causing or likely to cause significant harm (a); that exploit vulnerabilities due to age, disability or a specific social or economic situation to the same effect (b); social scoring leading to detrimental treatment in unrelated contexts or out of proportion (c); risk assessment of a person committing a criminal offence based solely on profiling or personality traits (d); facial recognition databases built by untargeted scraping of facial images from the internet or CCTV footage (e); inferring emotions in the workplace and education institutions, except for medical or safety reasons (f); biometric categorisation inferring race, political opinions, trade union membership, religious or philosophical beliefs, sex life or sexual orientation (g); and real-time remote biometric identification in publicly accessible spaces for law enforcement, except as strictly necessary for the objectives of point (h), under the authorisation, assessment and registration conditions of paragraphs 2–7."
sdk = "The SDK carries messages between agents and performs none of these practices; it has no biometric, scoring or emotion-inference capability. Server interceptors are the hook through which a provider can refuse a call before it runs, from what the call context carries (the method, the authenticated caller, the tenant, the task id and the headers); they are not given the message, which reaches only the executor. The SDK ships no policy that classifies purposes (AIA-15-5)."
status = "integrator"
code = [
  "crates/a2a-protocol-server/src/interceptor/mod.rs::ServerInterceptor",
]
tests = [
  "crates/a2a-protocol-server/tests/handler_tests/advanced.rs::interceptor_rejection_stops_processing",
]
gap = "Each prohibition turns on the practice an AI system performs and the purpose it is placed on the market, put into service or used for, which are the provider's and deployer's; a transport cannot tell one purpose from another. The prohibitions 2026/1744 added are row AIA-5-1-ba-bb."

[[control]]
id = "AIA-5-1-ba-bb"
source = "ai-act"
provision = "Art. 5(1)(ba), (bb), 5(1a), (1b) (inserted by Regulation (EU) 2026/1744; from 2 December 2026)"
requirement = "Prohibited: placing on the market, putting into service or using an AI system that generates or manipulates realistic images, video, audio or similar material of an identifiable person's intimate parts, or of an identifiable person in sexually explicit activity, without that person's freely given, specific, informed, unambiguous and explicit consent (ba); or child sexual abuse material within Article 2(c) and (e) of Directive 2011/93/EU, except where a 'without right' defence applies under national law (bb). Placing on the market or putting into service is prohibited only where that generation is the system's intended purpose, or a reasonably foreseeable and reproducible outcome that the system lacks reasonable and adequate safeguards to prevent and correct (1a(a)); use is prohibited only where the deployer uses the system for that purpose (1a(b))."
sdk = "The SDK generates and manipulates no content: it carries messages and artifacts between agents. Server interceptors can refuse a call from its method, caller, tenant and headers, but are not given its content, which reaches only the executor: a content check is the executor's. The SDK ships no content filter (AIA-15-5)."
status = "integrator"
code = [
  "crates/a2a-protocol-server/src/interceptor/mod.rs::ServerInterceptor",
]
tests = [
  "crates/a2a-protocol-server/tests/handler_tests/advanced.rs::interceptor_rejection_stops_processing",
]
gap = "Whether a system can generate such material, and the safeguards recital 12 lists (data cleaning, refusal training, output controls, prompt guardrails, content classification and filtering, abuse detection, notice and action), belong to the provider of the generating system and to the deployer who uses it. Recital 12 counts a system's release and distribution strategy, open-source releases included, when judging whether its safeguards are reasonable. The original Article 5 prohibitions are row AIA-5-1."

[[control]]
id = "AIA-6"
source = "ai-act"
provision = "Art. 6(1)–(4); Art. 3(14) as replaced and Art. 6(1a)–(1c) inserted by Regulation (EU) 2026/1744"
requirement = "An AI system is high-risk where it is intended to be used as a safety component of a product, or is itself a product, covered by the Union harmonisation legislation of Annex I, and that product must undergo a third-party conformity assessment under it (6(1)); and where it is listed in Annex III (6(2)), unless it poses no significant risk of harm to health, safety or fundamental rights because it performs a narrow procedural task, improves the result of a completed human activity, detects decision-making patterns without replacing human assessment, or performs a preparatory task — but never where it profiles natural persons (6(3)). A provider that considers an Annex III system not high-risk documents that assessment before placing it on the market, registers under Art. 49(2), and gives the documentation to national competent authorities on request (6(4)). A safety component fulfils a safety function, its intended purpose being to prevent or mitigate risks to the health and safety of persons or property (Art. 3(14)). AI systems used solely for non-safety aspects of user assistance, performance optimisation, service efficiency, automation, convenience or quality control are not safety components (6(1a)), unless their failure or malfunction would endanger health and safety (6(1b)); a product needing third-party assessment only for risks other than health and safety does not meet Art. 6(1)(b) (6(1c))."
sdk = "The book's chapter \"Is Your Agent High-Risk?\" walks a provider through Article 6: the Annex I and Annex III routes, the 6(3) exception and that profiling always stays high-risk, and the 6(4) duty to document an assessment and register; it maps the SDK's features to the obligations of a high-risk system and lists what stays the provider's. The SDK itself is not an AI system (Art. 3(1)) and has no intended purpose in a product of its own."
status = "integrator"
gap = "Whether a system built with the SDK is high-risk, under Art. 6(1) or Annex III, and any Art. 6(3) assessment that it is not, turn on the intended purpose its provider determines and are the provider's to document."
ci = ["python3 scripts/check_compliance_map.py --check"]

[[control]]
id = "AIA-9-10-17"
source = "ai-act"
provision = "Art. 9, 10, 17 (10(1), 10(6) and 17(2) as replaced by Regulation (EU) 2026/1744)"
requirement = "Providers of high-risk AI systems establish and maintain a risk management system (Art. 9), develop systems that train on data with data sets meeting the quality criteria of Art. 10(2)–(4) and Art. 4a(1) (Art. 10; its paragraph 5 is deleted, its content now in Art. 4a), and put a documented quality management system in place (Art. 17), implemented in proportion to the size of the provider's organisation, SMEs and small mid-caps included (17(2)), with a simplified manner for SMEs without partner or linked enterprises (Art. 63(1))."
sdk = "Nothing beyond its own engineering process, which is not the provider's QMS: the SDK trains nothing and holds no data set."
status = "integrator"
gap = "All three are the provider's, about the AI system as a whole."
ci = ["cargo +nightly fuzz run", "Run incremental mutation testing", "Run mutation tests", "github/codeql-action/analyze", "Test (all features)"]

[[control]]
id = "AIA-11"
source = "ai-act"
provision = "Art. 11(1) (second subparagraph as replaced by Regulation (EU) 2026/1744), Annex IV"
requirement = "The technical documentation of a high-risk AI system is drawn up before it is placed on the market and kept up to date, contains at least the elements of Annex IV, and is written so that national competent authorities and notified bodies can assess compliance. SMEs, start-ups included, and small mid-caps may provide the Annex IV elements in a simplified manner, on the form the Commission establishes, which notified bodies accept."
sdk = "Material a provider can cite for the component it takes from this repository: a CycloneDX SBOM per crate attached to each release, the provenance manifest, the ADRs, and the spec ledger, which records the protocol behaviour requirement by requirement."
status = "integrator"
ci = [
  "Generate CycloneDX SBOMs",
  "Create or update GitHub release",
  "Spec ledger covers every requirement and cites only tests that exist",
]
evidence = ["docs/adr/0015-audit-trail.md", "docs/compliance/spec-ledger.md", "PROVENANCE.md"]
gap = "The documentation describes the AI system, which is the provider's to write; the SDK's material describes one component of it."

[[control]]
id = "AIA-25-2-4"
source = "ai-act"
provision = "Art. 25(2), 25(4) (as replaced by Regulation (EU) 2026/1744), 99(4)(da)"
requirement = "Where another operator becomes the provider of a high-risk system (Art. 25(1)), the initial provider is no longer its provider, and cooperates with the new one: technical documentation sufficient to assess compliance with Art. 16, known limitations and failure modes, and targeted technical access including for testing and validation — unless it clearly specified that its system is not to be changed into a high-risk one (25(2)). The provider of a high-risk system and a third party supplying an AI system, model, tools, services, components or processes used or integrated in it specify, by written agreement, the information, capabilities, technical access and other assistance the provider needs; this does not apply to third parties making tools, services, processes or components, other than general-purpose AI models, accessible to the public under a free and open-source licence (25(4)). Breaches of 25(2) and (4) are subject to the fines of Art. 99(4) (point (da))."
sdk = "The SDK is published under Apache-2.0, a free and open-source licence, and is not a general-purpose AI model, so 25(4)'s written agreement does not apply to it, and it is not an AI system whose provider 25(2) binds. It publishes, without an agreement, much of what one would ask for: the technical material of AIA-11 (SBOMs, provenance manifest, ADRs, spec ledger) and, in each row here, its known limitations."
status = "integrator"
ci = [
  "python3 scripts/check_compliance_map.py --check",
  "Generate CycloneDX SBOMs",
  "Spec ledger covers every requirement and cites only tests that exist",
]
evidence = ["LICENSE", "PROVENANCE.md", "docs/compliance/spec-ledger.md"]
gap = "A provider that integrates the SDK and needs assistance beyond what is published has no written agreement to rely on; one taking components from a supplier that is not exempt must conclude one. The exemption is from 25(4) only."

[[control]]
id = "AIA-16"
source = "ai-act"
provision = "Art. 16"
requirement = "Providers of high-risk AI systems ensure compliance with Chapter III, Section 2 (a); indicate their name, registered trade name or mark and contact address on the system, its packaging or documentation (b); have a quality management system under Art. 17 (c); keep the documentation of Art. 18 (d); keep the logs of Art. 19 when under their control (e); have the system undergo the Art. 43 conformity assessment before placing it on the market (f); draw up the EU declaration of conformity of Art. 47 (g); affix the CE marking of Art. 48 (h); register under Art. 49(1) (i); take corrective action and inform under Art. 20 (j); demonstrate conformity to a national competent authority on reasoned request (k); and meet the accessibility requirements of Directives (EU) 2016/2102 and 2019/882 (l)."
sdk = "Toward (e): the audit trail of AIA-12-1 and its retention under AIA-19-26-6 are logs a provider can keep. Toward (d), (k) and Art. 25(2): the technical material of AIA-11. Nothing toward the rest, which are the provider's acts about the system as a whole."
status = "integrator"
tests = [
  "crates/a2a-protocol-server/tests/audit_trail.rs::every_call_and_event_is_recorded_and_attributable",
  "crates/a2a-protocol-server/src/audit/tests.rs::purge_deletes_only_what_is_past_the_floor_and_the_rest_still_verifies",
]
ci = [
  "Generate CycloneDX SBOMs",
  "Spec ledger covers every requirement and cites only tests that exist",
]
gap = "Every point is the obligation of the provider of the high-risk system; the SDK is a component of it, not its provider."

[[control]]
id = "AIA-43-47-49"
source = "ai-act"
provision = "Art. 43 (43(3) as replaced by Regulation (EU) 2026/1744), 47, 48, 49; Annex XIV"
requirement = "Before placing a high-risk system on the market, its provider follows the conformity assessment procedure of Art. 43: for Annex III point 1, internal control (Annex VI) or a notified body (Annex VII), the latter where harmonised standards or common specifications are not applied in full; for Annex III points 2–8, internal control; for Annex I Section A systems, the procedure of that legislation, with Section 2's requirements and the Art. 17 quality management system assessed as part of it (43(3)); and a new assessment after a substantial modification (43(4)). The provider draws up a machine-readable, physical or electronically signed EU declaration of conformity with the content of Annex V, kept for 10 years (Art. 47); affixes the CE marking, digitally for systems provided digitally (Art. 48); and, for Annex III systems other than point 2, registers itself and the system in the EU database before placing it on the market, as must a provider that concluded under Art. 6(3) that an Annex III system is not high-risk (Art. 49(1)–(2)); public-authority deployers register their use (49(3)). Notified bodies are designated by the codes of Annex XIV, whose AIH 0401 names Agentic AI."
sdk = "Material a provider can put to the assessment: the technical documentation of AIA-11, the spec ledger recording the protocol's behaviour requirement by requirement, and the CycloneDX SBOMs and build-provenance attestations of CRA-13-5."
status = "integrator"
ci = [
  "Spec ledger covers every requirement and cites only tests that exist",
  "Generate CycloneDX SBOMs",
  "Attest build provenance (SLSA)",
]
evidence = ["docs/compliance/spec-ledger.md", "PROVENANCE.md"]
gap = "The assessment, the declaration, the CE marking and the registration are the provider's acts about the high-risk system; none can be done for a component."

