  "crates/a2a-protocol-server/src/auth/jwt.rs::debug_impls_render_type_and_redact_secrets",
  "crates/a2a-protocol-server/tests/encrypted_store.rs::a_handler_over_the_wrapper_stores_no_plaintext_and_serves_it_whole",
  "crates/a2a-protocol-server/src/push/cipher_tests.rs::with_a_cipher_no_secret_is_stored_and_the_config_reads_back",
  "crates/a2a-protocol-server/tests/audit_privacy.rs::a_served_call_is_recorded_naming_no_one_and_erasable",
  "crates/a2a-protocol-server/src/audit/privacy/tests/erasure.rs::one_content_in_two_records_carries_two_tags",
]
[[control]]
id = "GDPR-32-1a"
source = "gdpr"
provision = "Art. 32(1)(a)"
requirement = "Security of processing, including pseudonymisation and encryption of personal data."
sdk = "In transit: the client speaks TLS through rustls with certificate validation, and the HTTP listener (`Server::with_tls`) and the gRPC listener terminate TLS, mutual TLS included. At rest, with the `encryption` feature: `EncryptedTaskStore` seals every part of a task and its event log with AES-256-GCM (or a cipher of the operator's), each bound to its tenant partition, task, record or log position, container and index, so an altered, moved or unsealed part fails the read; the SQL push-config stores seal each config, token and credentials included; `AuditLog::with_privacy` seals who each audit record names and keys its digests, the chain still verifying without a key. What the stores query (ids, states, timestamps, `metadata`, the order of messages and artifacts) stays unencrypted, and encryption at rest is the operator's to switch on."
status = "supported"
tests = [
  "crates/a2a-protocol-client/tests/tls_integration_tests.rs::tls_client_rejects_unknown_ca",
  "crates/a2a-protocol-client/tests/grpc_tls_apply_tests.rs::https_endpoint_completes_a_tls_handshake_with_the_pinned_ca",
  "crates/a2a-protocol-server/tests/serve_tls.rs::the_agent_card_is_served_over_https_on_http1_and_http2",
  "crates/a2a-protocol-server/tests/serve_tls.rs::a_listener_requiring_client_certificates_serves_only_clients_with_one",
  "crates/a2a-protocol-server/tests/encrypted_store.rs::the_postgres_stores_hold_only_sealed_parts",
  "crates/a2a-protocol-server/src/store/encrypted/tests.rs::a_value_moved_within_its_task_is_refused",
  "crates/a2a-protocol-server/tests/encrypted_store.rs::the_same_ring_seals_push_configs",
  "crates/a2a-protocol-server/src/audit/privacy/tests.rs::a_protected_record_names_no_one_and_still_verifies",
  "crates/a2a-protocol-server/src/audit/privacy/tests.rs::a_sealed_value_altered_or_moved_does_not_open",
]

[[control]]
id = "GDPR-5-1e"
source = "gdpr"
provision = "Art. 5(1)(e), 17"
requirement = "Storage limitation, and erasure on request."
sdk = "`purge_expired` removes terminal tasks past an age, with their events and artifact journal, and expires idempotency keys; audit purge removes records past the configured floor. `TaskStore::delete` erases one task by id, with its event log and artifact journal, and in a tenant store touches no other tenant's. Under caller isolation, `erase_caller` on the tenant-aware task and push-config stores removes everything one authenticated caller's partitions hold, in every tenant: tasks, their events, idempotency keys and webhooks. With `AuditLog::with_privacy`, `erase_subject` erases one person from a tenant's audit chain by destroying their key, refused under a legal hold (Art. 17(3)(e)), and the chain still verifies; retention drops the keys no remaining record names."
status = "partial"
tests = [
  "crates/a2a-protocol-server/src/store/sqlite_store/retention_tests.rs::purges_terminal_tasks_past_the_age_and_nothing_else",
  "crates/a2a-protocol-server/src/audit/tests.rs::purge_deletes_only_what_is_past_the_floor_and_the_rest_still_verifies",
  "crates/a2a-protocol-server/src/store/sqlite_store/event_log_tests.rs::deleting_a_task_removes_its_log",
  "crates/a2a-protocol-server/src/store/sqlite_store/artifact_delta_tests.rs::deleting_a_task_discards_its_journalled_parts",
  "crates/a2a-protocol-server/src/store/tenant_sqlite_store.rs::deleting_a_task_removes_its_log_and_leaves_other_tenants_alone",
  "crates/a2a-protocol-server/tests/erase_caller.rs::erase_caller_removes_a_callers_data_from_the_in_memory_stores",
  "crates/a2a-protocol-server/tests/erase_caller.rs::erase_caller_removes_a_callers_data_from_the_sqlite_stores",
  "crates/a2a-protocol-server/src/audit/privacy/tests.rs::erasure_destroys_one_persons_key_and_leaves_the_chain_whole",
  "crates/a2a-protocol-server/src/audit/privacy/tests/erasure.rs::retention_drops_the_keys_no_record_names_any_longer",
]
gap = "The task store knows a task by the caller who made it, not by the people it concerns: `erase_caller` erases one caller's data, but a task about someone else is found only by id, and tasks in a tenant's shared partition (`share_tasks_across_callers`, or written before caller isolation) are attributed to no one. An erased person's audit records stay linkable to each other by their common handle, and records written before protection was on cannot be erased (`erase_subject` reports them); copies of a key in backups or logs survive until they expire."
# ── OWASP agentic Top 10 ─────────────────────────────────────────────────────

[[control]]
id = "ASI03"
source = "owasp-asi"
provision = "ASI03 Identity and Privilege Abuse"
requirement = "Agents act under identities and delegated privileges that are scoped, attributable and not escalated."
sdk = "Authenticated callers are named, and the name reaches the executor through the request context. A delegated call carries the originating principal as an RFC 8693 token whose `act` chain names the agents acting for it (`TokenExchange` on the client; `CallContext::actors` and the audit record on the server, ADR 0021); the identity provider scopes what may be delegated."
status = "partial"
tests = [
  "crates/a2a-protocol-server/src/auth/identity_tests.rs::a_labelled_api_key_names_its_caller",
  "crates/a2a-protocol-server/tests/request_context_tests.rs::an_executor_sees_the_caller_identity_the_interceptor_established",
  "crates/a2a-protocol-server/tests/audit_trail.rs::every_call_and_event_is_recorded_and_attributable",
  "crates/a2a-protocol-server/src/auth/jwt.rs::a_delegated_token_names_its_principal_and_its_actors",
  "crates/a2a-protocol-server/src/audit/actors_tests.rs::a_record_names_the_agents_that_acted_for_its_caller",
  "crates/a2a-protocol-client/src/token_provider/exchange/tests.rs::an_exchange_sends_rfc_8693_parameters_and_reads_the_issued_token",
]
gap = "The originating principal travels only where the identity provider supports RFC 8693 token exchange and the delegating agent uses it; otherwise a delegated call carries the delegating agent's credential, and the chain is joined afterwards through the trace id. Scope attenuation is the identity provider's policy."

[[control]]
id = "ASI04"
source = "owasp-asi"
provision = "ASI04 Agentic Supply Chain Vulnerabilities"
requirement = "Agents, tools and schemas an agent imports are verified before they are trusted."
sdk = "Agent cards can be signed (JWS over RFC 8785 canonical form, ES256 or EdDSA) and verified against a raw or SPKI key, or against a JWK Set by `kid`, trying every signature the card carries (key rotation). The client fetches a JWK Set from a URL the caller trusts, over HTTPS, bounded in size and time; removing a key from the set revokes it, and a key whose `exp` has passed, or whose `x5c` leaf certificate is outside its validity period or holds another key, is never used (spec §8.4.3, RFC 7517 §4.7)."
status = "partial"
tests = [
  "crates/a2a-protocol-types/src/signing.rs::sign_and_verify_agent_card",
  "crates/a2a-protocol-types/src/signing.rs::verify_rejects_tampered_card",
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::a_jwks_verifies_by_kid_and_alg",
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::removing_a_key_from_the_set_revokes_it",
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::an_expired_key_is_not_used",
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::the_rfc_8037_ed25519_example_verifies",
  "crates/a2a-protocol-client/tests/jwks_fetch_tests.rs::a_card_verifies_under_a_fetched_set",
  "crates/a2a-protocol-types/src/signing/keys/x5c/tests.rs::x5c_expired_leaf_is_not_used",
  "crates/a2a-protocol-types/src/signing/keys/x5c/tests.rs::x5c_leaf_holding_another_key_is_not_used",
  "crates/a2a-protocol-client/tests/jwks_fetch_tests.rs::a_fetched_key_whose_certificate_has_expired_is_not_used",
]
gap = "Not built: validating an `x5c` chain to a trust anchor, its certificates' signatures, and CRL/OCSP revocation. Which key set to trust is the caller's decision: the SDK never follows a `jku` taken from the card itself. A key's expiry is honoured from `exp` (which RFC 7517 does not define) and from its `x5c` leaf's validity period. Tools and schemas an agent imports outside A2A are out of scope."

[[control]]
id = "ASI07"
source = "owasp-asi"
provision = "ASI07 Insecure Inter-Agent Communication"
requirement = "Messages between agents are authenticated and protected against interception and forgery."
sdk = "TLS on every client transport and on the server's HTTP, WebSocket and gRPC listeners, mutual TLS on each with the client certificate naming the caller (MutualTlsAuthInterceptor), authenticated calls, signed agent cards, and signed messages and artifacts (the provenance extension) that a receiver can verify end to end, across intermediaries."
status = "partial"
tests = [
  "crates/a2a-protocol-client/tests/tls_integration_tests.rs::tls_client_rejects_unknown_ca",
  "crates/a2a-protocol-types/src/provenance/sign/tests.rs::a_signed_message_verifies_under_either_algorithm",
  "crates/a2a-protocol-server/tests/serve_tls.rs::a_listener_requiring_client_certificates_serves_only_clients_with_one",
  "crates/a2a-protocol-server/tests/mtls_caller_identity.rs::the_client_certificate_names_the_caller_over_https",
  "crates/a2a-protocol-server/tests/mtls_caller_identity.rs::the_client_certificate_names_the_caller_over_wss",
  "crates/a2a-protocol-sdk/tests/grpc_mtls_caller_e2e.rs::the_client_certificate_names_the_caller_over_grpc",
]
gap = "Signing messages and artifacts (the provenance extension) is opt-in, and verifying them is the receiver's call; unsigned content can still be altered by an intermediary that terminates TLS. Behind a TLS-terminating proxy the listener sees no client certificate, so mutual TLS names the caller only on a listener that terminates TLS itself (ADR 0018)."

[[control]]
id = "ASI08"
source = "owasp-asi"
provision = "ASI08 Cascading Failures"
requirement = "A failure in one agent or tool does not propagate unchecked through the agents that depend on it."
sdk = "Per-caller rate limits, per-tenant concurrency limits, an executor timeout, bounded queues and stores. A `Delegation` cancels a task's children on other agents when the task is cancelled, its stream to a child is lost, or its handle is dropped; with a lease (`Delegation::start_leased`, ADR 0020) a child whose parent crashes or goes quiet is stopped by its own server. A budget (ADR 0023) carries the parent's deadline and named meters to the child: every server holds a turn to the caller's deadline, and `BudgetHandle::grant` reserves each meter from the parent, so a deadline cannot be outlived down the chain and a meter cannot be granted twice over."
status = "partial"
tests = [
  "crates/a2a-protocol-server/src/rate_limit/tests.rs::fast_path_rate_limit_exceeded",
  "crates/a2a-protocol-server/src/handler/tenant_limits_tests.rs::a_tenant_at_its_concurrency_limit_is_refused",
  "crates/a2a-protocol-client/tests/delegation_tests.rs::a_lost_stream_cancels_the_child",
  "crates/a2a-protocol-client/tests/delegation_tests.rs::dropping_an_unsettled_handle_cancels_the_child",
  "crates/a2a-protocol-client/tests/delegation_lease_tests.rs::a_child_whose_parent_goes_quiet_stops",
  "crates/a2a-protocol-client/tests/delegation_lease_tests.rs::a_live_parent_keeps_its_child_running",
  "crates/a2a-protocol-client/tests/delegation_budget_tests.rs::a_grandchilds_deadline_is_inside_its_parents",
  "crates/a2a-protocol-client/tests/delegation_budget_tests.rs::the_parent_is_charged_what_the_child_spent",
  "crates/a2a-protocol-server/src/handler/budget/tests.rs::the_callers_deadline_ends_the_turn_before_the_servers_timeout",
  "crates/a2a-protocol-types/src/budget/handle/tests.rs::ten_children_cannot_each_be_given_the_whole",
]
gap = "Leases are opt-in on both sides: a child on an agent that grants none, or sent without one, runs on after its parent crashes. A peer that does not implement the budget extension ignores the budget, a meter's unit means only what the agents agree, and a child that under-reports its spend is refunded more than it should be."

[[control]]
id = "ASI09"
source = "owasp-asi"
provision = "ASI09 Human-Agent Trust Exploitation"
requirement = "Sensitive actions require explicit human confirmation rather than trust in confident output."
sdk = "The approval extension binds a person's confirmation to the digest of the exact action, and the `ApprovalGate` refuses a confirmation of anything else, from anyone not allowed, or from the caller who asked; each admitted confirmation is an audit record."
status = "supported"
code = [
  "crates/a2a-protocol-server/src/approval.rs::ApprovalGate",
  "crates/a2a-protocol-server/src/executor_helpers.rs::EventEmitter::request_approval",
]
tests = [
  "crates/a2a-protocol-server/src/approval/tests.rs::an_approval_flows_through_the_gate_to_the_executor",
  "crates/a2a-protocol-server/src/approval/tests.rs::a_decision_for_another_request_or_action_is_refused",
  "crates/a2a-protocol-server/src/approval/tests.rs::who_may_approve",
  "crates/a2a-protocol-server/src/approval/tests.rs::without_a_gate_a_decision_is_never_reported_as_checked",
  "crates/a2a-protocol-server/src/approval/tests.rs::an_admitted_decision_is_audited_with_the_approver",
]
remainder = "Which actions are sensitive enough to ask about is the executor's decision; the SDK cannot make it ask (re-examined 2026-10-20: the confirmation path is built and tested end to end)."

[[control]]
id = "ASI10"
source = "owasp-asi"
provision = "ASI10 Rogue Agents"
requirement = "Agents acting outside their intended behaviour are detected and stopped."
sdk = "Spans and metrics for every call; cancellation of a task; `RequestHandler::halt`, which stops every task of a tenant or of the server and refuses new ones until resumed, on every replica sharing a halt store and across restarts (ADR 0019)."
status = "partial"
tests = [
  "crates/a2a-protocol-server/tests/edge_case_tests/handler_basics.rs::cancel_task_signals_cancellation_token",
  "crates/a2a-protocol-server/src/handler/halt/tests.rs::halting_all_cancels_every_tenant",
  "crates/a2a-protocol-server/src/handler/halt/store_tests.rs::a_halt_on_one_replica_stops_and_refuses_on_the_other",
]
gap = "Nothing detects a rogue agent: deciding to halt is a person's or an integrator's monitor's. A halt reaches other replicas only through a halt store, within its poll interval. A cancel on one replica makes the task's state final in a shared store, but an executor on another replica is not signalled: it stops only when its next write is refused, and one that does not write runs on."

[[control]]
id = "ASI-MODEL"
source = "owasp-asi"
provision = "ASI01, ASI02, ASI05, ASI06"
requirement = "Goal hijack, tool misuse, unexpected code execution, memory and context poisoning."
sdk = "Server and client interceptors are where an integrator's filter or policy runs, before and after every call."
status = "integrator"
gap = "These attack the model, its tools and its memory, which live in the integrator's executor, not in the transport."

