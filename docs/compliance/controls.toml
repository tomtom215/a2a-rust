gap = "Without a halt store a halt holds in one process; with one, another replica follows within its poll interval rather than at once. A cancel on one replica makes the task's state final in a shared store, but an executor on another replica is not signalled: it stops only when its next write is refused. An executor that ignores its token keeps running: nothing forces it to stop (a bounded cancel deadline that drops its future, as the executor timeout does, is not built). A crashed parent's delegated children stop only if it started them with a lease (ADR 0020, `Delegation::start_leased`); leases are opt-in."

