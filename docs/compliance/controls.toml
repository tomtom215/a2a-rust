[[control]]
id = "GDPR-28"
source = "gdpr"
provision = "Art. 28"
requirement = "A controller uses only processors giving sufficient guarantees; processing by a processor is governed by a binding contract that, among other things, requires it to act only on documented instructions, take the measures of Art. 32, assist with data subjects' requests, delete or return all personal data at the end of the service (28(3)(g)), and make available the information needed to demonstrate compliance and allow audits (28(3)(h))."
sdk = "Mechanisms an integrator can point to: push delivery can be limited to listed hosts (`HttpPushSender::with_allowed_hosts`), refused before any connection and when a config is created; `erase_caller` removes one caller's tasks, events, idempotency keys and webhooks from the tenant-aware stores (28(3)(g), GDPR-5-1e); the audit trail and its offline verification supply records for an audit (28(3)(h), GDPR-5-2)."
status = "integrator"
code = [
  "crates/a2a-protocol-server/src/push/sender.rs::HttpPushSender::with_allowed_hosts",
]
tests = [
  "crates/a2a-protocol-server/tests/push_sender_tests.rs::the_host_allowlist_refuses_other_hosts_before_connecting",
  "crates/a2a-protocol-server/src/handler/push_config.rs::set_push_config_refuses_a_host_outside_the_allowlist",
  "crates/a2a-protocol-server/tests/erase_caller.rs::erase_caller_removes_a_callers_data_from_the_in_memory_stores",
]
gap = "Art. 28 governs the relationship between a controller and a processor: the contract, sub-processor authorisation, and the processor's conduct. The SDK is software either of them runs, not a party (see the preamble). Whether a peer agent, a webhook receiver or a telemetry back end is a processor, and what the contract with it says, is the integrator's to settle."

[[control]]
id = "GDPR-30"
source = "gdpr"
provision = "Art. 30"
requirement = "Each controller and processor keeps a written record of processing activities: purposes, categories of data subjects and data, recipients, third-country transfers, envisaged time limits for erasure and, where possible, a general description of the security measures of Art. 32(1); it is made available to the supervisory authority on request."
sdk = "The audit trail is a log of processing operations (who called, which task ran, what it emitted), not the record of processing activities Art. 30 describes. Toward the general description of security measures (30(1)(g), 30(2)(d)), the SDK's documents state what it protects and what it does not: the security chapter, ADR 0015 and this control map."
status = "integrator"
tests = [
  "crates/a2a-protocol-server/tests/audit_trail.rs::every_call_and_event_is_recorded_and_attributable",
]
