[[control]]
id = "ASI04"
source = "owasp-asi"
provision = "ASI04 Agentic Supply Chain Vulnerabilities"
requirement = "Agents, tools and schemas an agent imports are verified before they are trusted."
sdk = "Agent cards can be signed (JWS over RFC 8785 canonical form, ES256 or EdDSA) and verified against a raw or SPKI key, or against a JWK Set by `kid`, trying every signature the card carries (key rotation). The client fetches a JWK Set from a URL the caller trusts, over HTTPS, bounded in size and time; removing a key from the set revokes it, and a key whose `exp` has passed, or whose `x5c` leaf certificate is outside its validity period or holds another key, is never used (spec §8.4.3, RFC 7517 §4.7)."
status = "partial"
tests = [
  "crates/a2a-protocol-types/src/signing.rs::sign_and_verify_agent_card",
  "crates/a2a-protocol-types/src/signing.rs::verify_rejects_tampered_card",
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::a_jwks_verifies_by_kid_and_alg",
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::removing_a_key_from_the_set_revokes_it",
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::an_expired_key_is_not_used",
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::the_rfc_8037_ed25519_example_verifies",
  "crates/a2a-protocol-client/tests/jwks_fetch_tests.rs::a_card_verifies_under_a_fetched_set",
  "crates/a2a-protocol-types/src/signing/keys/x5c/tests.rs::x5c_expired_leaf_is_not_used",
  "crates/a2a-protocol-types/src/signing/keys/x5c/tests.rs::x5c_leaf_holding_another_key_is_not_used",
  "crates/a2a-protocol-client/tests/jwks_fetch_tests.rs::a_fetched_key_whose_certificate_has_expired_is_not_used",
]
gap = "Not built: validating an `x5c` chain to a trust anchor, its certificates' signatures, and CRL/OCSP revocation. Which key set to trust is the caller's decision: the SDK never follows a `jku` taken from the card itself. A key's expiry is honoured from `exp` (which RFC 7517 does not define) and from its `x5c` leaf's validity period. Tools and schemas an agent imports outside A2A are out of scope."

[[control]]
id = "ASI07"
source = "owasp-asi"
provision = "ASI07 Insecure Inter-Agent Communication"
requirement = "Messages between agents are authenticated and protected against interception and forgery."
sdk = "TLS on every client transport and on the server's HTTP, WebSocket and gRPC listeners, mutual TLS on each with the client certificate naming the caller (MutualTlsAuthInterceptor), authenticated calls, signed agent cards, and signed messages and artifacts (the provenance extension) that a receiver can verify end to end, across intermediaries."
status = "partial"
tests = [
  "crates/a2a-protocol-client/tests/tls_integration_tests.rs::tls_client_rejects_unknown_ca",
  "crates/a2a-protocol-types/src/provenance/sign/tests.rs::a_signed_message_verifies_under_either_algorithm",
  "crates/a2a-protocol-server/tests/serve_tls.rs::a_listener_requiring_client_certificates_serves_only_clients_with_one",
  "crates/a2a-protocol-server/tests/mtls_caller_identity.rs::the_client_certificate_names_the_caller_over_https",
  "crates/a2a-protocol-server/tests/mtls_caller_identity.rs::the_client_certificate_names_the_caller_over_wss",
  "crates/a2a-protocol-sdk/tests/grpc_mtls_caller_e2e.rs::the_client_certificate_names_the_caller_over_grpc",
]
gap = "Signing messages and artifacts (the provenance extension) is opt-in, and verifying them is the receiver's call; unsigned content can still be altered by an intermediary that terminates TLS. Behind a TLS-terminating proxy the listener sees no client certificate, so mutual TLS names the caller only on a listener that terminates TLS itself (ADR 0018)."

[[control]]
id = "ASI08"
source = "owasp-asi"
provision = "ASI08 Cascading Failures"
requirement = "A failure in one agent or tool does not propagate unchecked through the agents that depend on it."
sdk = "Per-caller rate limits, per-tenant concurrency limits, an executor timeout, bounded queues and stores. A `Delegation` cancels a task's children on other agents when the task is cancelled, its stream to a child is lost, or its handle is dropped; with a lease (`Delegation::start_leased`, ADR 0020) a child whose parent crashes or goes quiet is stopped by its own server. A budget (ADR 0023) carries the parent's deadline and named meters to the child: every server holds a turn to the caller's deadline, and `BudgetHandle::grant` reserves each meter from the parent and refunds only on the settling report, so a child's deadline sits inside its parent's (timed from receipt) and a meter cannot be granted twice over."
status = "partial"
tests = [
  "crates/a2a-protocol-server/src/rate_limit/tests.rs::fast_path_rate_limit_exceeded",
  "crates/a2a-protocol-server/src/handler/tenant_limits_tests.rs::a_tenant_at_its_concurrency_limit_is_refused",
  "crates/a2a-protocol-client/tests/delegation_tests.rs::a_lost_stream_cancels_the_child",
  "crates/a2a-protocol-client/tests/delegation_tests.rs::dropping_an_unsettled_handle_cancels_the_child",
  "crates/a2a-protocol-client/tests/delegation_lease_tests.rs::a_child_whose_parent_goes_quiet_stops",
  "crates/a2a-protocol-client/tests/delegation_lease_tests.rs::a_live_parent_keeps_its_child_running",
  "crates/a2a-protocol-client/tests/delegation_budget_tests.rs::a_grandchilds_deadline_is_inside_its_parents",
  "crates/a2a-protocol-client/tests/delegation_budget_tests.rs::the_parent_is_charged_what_the_child_spent",
  "crates/a2a-protocol-server/src/handler/budget/tests.rs::the_callers_deadline_ends_the_turn_before_the_servers_timeout",
  "crates/a2a-protocol-types/src/budget/handle/tests.rs::ten_children_cannot_each_be_given_the_whole",
]
gap = "Leases are opt-in on both sides: a child on an agent that grants none, or sent without one, runs on after its parent crashes. A peer that does not implement the budget extension ignores the budget, a meter's unit means only what the agents agree, and a child that under-reports its spend is refunded more than it should be."

