gap = "Without a halt store a halt holds in one process; with a SQLite store, or a custom one that does not push, another replica follows within its poll interval rather than at once. A cancel pushed to the replica running the task fires its token, but streams open there end without the `Canceled` frame (ADR 0024). An executor that ignores its token keeps running: nothing forces it to stop (a bounded cancel deadline that drops its future, as the executor timeout does, is not built). A crashed parent's delegated children stop only if it started them with a lease (ADR 0020, `Delegation::start_leased`); leases are opt-in."

