# Source of docs/compliance/control-map.md. Edit this file, then run
#   scripts/check_compliance_map.py --write
# CI runs `--check`, which fails when a cited test, file or CI step no longer
# exists, or when the Markdown is stale. Statuses:
#
#   supported   the SDK does what the row says; at least one cited test or CI
#               step proves it
#   documented  satisfied by a document or a process, cited as evidence
#   partial     some of it; `gap` says what is missing
#   gap         none of it yet; `gap` says what would close it
#   integrator  not something a protocol library can do; `gap` says why, and
#               what the SDK offers the integrator who must

[meta]
as_of = "2026-10-08"
preamble = """
This is a map from regulatory and standards provisions to what a2a-rust, a
protocol library, provides toward them. It is not a claim that the SDK is
compliant with anything: the EU AI Act places no obligation on this SDK,
which is neither an AI system nor a provider (Regulation (EU) 2024/1689,
Articles 3(1) and 3(3)), and Article 25(4) exempts free and open-source
components from the value-chain duties, an exemption Regulation (EU)
2026/1744 kept. The obligations below belong to whoever builds an AI system
or a product with this SDK. Each row says how much of one this SDK carries
for them, with the test that proves it, and what is left. Not legal advice.
"""

[[sources]]
id = "ai-act"
title = "EU AI Act — Regulation (EU) 2024/1689, as amended by Regulation (EU) 2026/1744"
url = "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
verification = "primary"
note = """
Article text read on EUR-Lex on 2026-10-08. Application dates per the
Commission's page and the amending regulation: Article 50 from 2 August 2026;
Annex III high-risk obligations from 2 December 2027; Annex I high-risk
obligations from 2 August 2028.
"""

