[[control]]
id = "GDPR-33-34"
source = "gdpr"
provision = "Art. 33, 34"
requirement = "A personal data breach (a breach of security leading to the destruction, loss, alteration, unauthorised disclosure of, or access to personal data, Art. 4(12)) is notified to the supervisory authority without undue delay and where feasible within 72 hours, and documented; a processor notifies the controller; where the breach is likely to result in a high risk, it is communicated to the data subjects, unless, among other conditions, the data were rendered unintelligible to unauthorised persons, such as by encryption (Art. 34(3)(a))."
sdk = "Evidence for detecting and documenting one: the audit chain, verified with `log.verify` or offline with `a2a audit verify`, names the first record edited, deleted or reordered, and a tail cut past a signed checkpoint; refused calls are recorded with their outcome. Toward Art. 34(3)(a), `EncryptedTaskStore` and `AuditLog::with_privacy` leave content and the people records name unintelligible without the keys (GDPR-32-1a)."
status = "integrator"
tests = [
  "crates/a2a-protocol-types/src/audit/tests.rs::a_resealed_edit_breaks_the_next_link",
  "crates/a2a-protocol-types/src/audit/tests.rs::a_deleted_record_is_a_gap",
  "crates/a2a-protocol-types/src/audit/tests.rs::truncating_the_tail_past_a_checkpoint_is_found",
  "tools/a2a-cli/tests/offline.rs::an_exported_chain_verifies_and_an_edited_one_names_where_it_breaks",
  "crates/a2a-protocol-server/tests/audit_trail.rs::every_call_and_event_is_recorded_and_attributable",
]
gap = "Detecting a breach, assessing its risk, and notifying the authority and the people concerned are the controller's acts, and a processor's notice to the controller is the processor's. The SDK verifies a chain only when asked and raises no alert. Encryption leaves ids, states, timestamps and `metadata` readable, so whether a breach of an encrypted store left the personal data unintelligible depends on what the integrator put in those fields."

[[control]]
