]
gap = "The record names the controller's purposes, categories, recipients and time limits, which only the controller knows; it is a document it keeps, not something a library produces."

[[control]]
id = "GDPR-32-1c"
source = "gdpr"
provision = "Art. 32(1)(c)"
requirement = "The ability to restore the availability and access to personal data in a timely manner in the event of a physical or technical incident."
sdk = "Durable state the operator can back up and restore: the SQLite and PostgreSQL task, push-config, audit and halt stores; replicas sharing a PostgreSQL task store each serve a task the other created; a process restarted against a shared halt store comes back halted. An encryption key ring keeps old keys alongside the active one, so values sealed under a rotated key still open."
status = "integrator"
tests = [
  "crates/a2a-protocol-server/tests/multi_replica.rs::a_task_created_on_one_replica_is_readable_on_the_other",
  "crates/a2a-protocol-server/src/handler/halt/store_tests.rs::a_restarted_process_comes_back_halted",
  "crates/a2a-protocol-server/src/store/encrypted/tests.rs::a_rotated_ring_opens_old_values_and_seals_with_the_new_key",
]
gap = "The SDK has no backup or restore of its own; backups, replication and recovery are the database's and the operator's. Two consequences to plan for: data sealed by `EncryptedTaskStore` or `AuditLog::with_privacy` opens only with every key that sealed it, so losing a key loses the data; and restoring a backup taken before an `erase_subject`, `erase_caller` or purge brings back what was erased. The in-memory stores keep nothing across a restart."

[[control]]
id = "GDPR-32-1d"
source = "gdpr"
provision = "Art. 32(1)(d)"
requirement = "A process for regularly testing, assessing and evaluating the effectiveness of technical and organisational measures for ensuring the security of the processing."
