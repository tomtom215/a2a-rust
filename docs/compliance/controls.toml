[[control]]
id = "ASI-MODEL"
source = "owasp-asi"
provision = "ASI01, ASI02, ASI05, ASI06"
requirement = "Goal hijack, tool misuse, unexpected code execution, memory and context poisoning."
sdk = "A client interceptor sees each request's params and each response's result, so an integrator's content filter or policy on what an agent sends and receives runs there; a server interceptor sees only the call context (method, caller, tenant, headers) and can refuse a call from it, and the message reaches only the executor, where a filter on what an agent is sent runs. When the model is hijacked anyway, the SDK contains the effects: a repeated side-effecting tool call runs once, the turn bound and the caller's token budget end a runaway run, content whose signature fails is refused before the model reads it, an approval gate refuses the requester's own approval, delegated budgets bound what children spend, a halt stops the run, and caller isolation hides other callers' tasks. `docs/injection-containment.md` has each scenario, against a model that obeys every instruction it reads."
status = "integrator"
tests = [
  "crates/a2a-protocol-sdk/tests/injection_containment/tool_results.rs::a_repeated_payment_planted_in_a_page_runs_once",
