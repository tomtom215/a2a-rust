  "crates/a2a-protocol-sdk/tests/injection_containment/delegation.rs::another_callers_task_cannot_be_read_on_an_injected_instruction",
  "crates/a2a-protocol-sdk/tests/injection_containment/operator.rs::a_halt_stops_an_injected_run_and_refuses_new_work",
]
