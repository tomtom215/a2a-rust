gap = "Preventing the hijack is the integrator's: these attack the model, its tools and its memory, which live in the executor. What the SDK does not contain, each asserted by a test: differing side-effecting calls run until the turn bound or budget ends the run; unsigned content passes unless signatures are required; a trusted agent that is compromised is still obeyed, since a signature says who wrote content, not that it is safe."

