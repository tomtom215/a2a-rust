  "crates/a2a-protocol-server/src/audit/privacy/tests/erasure.rs::retention_drops_the_keys_no_record_names_any_longer",
]
gap = "Erasure is the operator's to start: the A2A protocol has no method a caller can use to delete a task. The task store knows a task by the caller who made it, not by the people it concerns: `erase_caller` erases one caller's data, but a task about someone else is found only by id, and tasks in a tenant's shared partition (`share_tasks_across_callers`, unlabelled credentials, or written before caller isolation) are attributed to no one. An erased person's audit records stay linkable to each other by their common handle, and records written before protection was on cannot be erased (`erase_subject` reports them). A legal hold covers a tenant's whole chain, so it refuses every erasure there; across replicas an erasure, a hold and an append are not serialised (ADR 0015). Copies in backups and logs survive until they expire or are overwritten, and restoring a backup taken before an erasure brings the data back. A task-store erasure is on record only through the audited store or `AuditLog::record_erasure` (GDPR-5-2), and copies sent to other agents or webhooks are not reached (GDPR-17-2-19)."

