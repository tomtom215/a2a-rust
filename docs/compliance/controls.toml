]
tests = [
  "crates/a2a-protocol-server/src/approval/quorum_tests.rs::a_quorum_of_two_waits_for_a_second_distinct_approver",
  "crates/a2a-protocol-server/src/approval/quorum_tests.rs::a_deny_before_the_quorum_reaches_the_executor_at_once",
  "crates/a2a-protocol-server/src/approval/quorum_tests.rs::a_decision_on_another_digest_is_not_counted",
  "crates/a2a-protocol-server/src/approval/quorum_tests.rs::a_record_for_another_digest_or_a_refused_name_counts_for_nothing",
  "crates/a2a-protocol-server/src/approval/quorum_tests/recorded.rs::each_approval_toward_a_quorum_is_audited",
  "crates/a2a-protocol-server/src/approval/quorum_tests/recorded.rs::a_quorum_is_met_across_two_handlers_sharing_a_sqlite_store",
  "crates/a2a-protocol-server/src/approval/tests.rs::who_may_approve",
]
remainder = "Which systems fall under Annex III point 1(a), and so need the quorum, and that the approvers are natural persons with the necessary competence, training and authority, are the deployer's: the gate counts authenticated identities, so one person holding two identities the gate allows counts twice, and the allowed list is where the deployer names who may confirm. Which actions wait for confirmation is the executor's, as in AIA-14-4d. On replicas sharing a store, two approvals arriving at two replicas at the same moment can overwrite each other's record, because no shipped store writes conditionally on what it read: the count can fall short and an approver has to confirm again, but it never counts an approval nobody sent, and the last two approvals arriving at two replicas at once can both meet the quorum and resume the executor twice, the concurrent-turns gap a single approval on two replicas already has; both close only with a compare-and-set store write (waiting on the maintainer). A quorum above one is refused at build while tasks are isolated by caller, which is the default once an authenticating interceptor is installed (the other approvers could not see the task), so a deployment that needs one shares tasks across callers (`share_tasks_across_callers`) and relies on its interceptors and allowed list for who may act (re-examined 2026-10-20)."

