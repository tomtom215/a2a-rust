sdk = "Inputs to the description of measures (35(7)(d)): this control map; the security chapter, which lists what encryption at rest does and does not protect and the SDK's known gaps; ADR 0015, which states what the audit trail records, the threats it answers and what erasure does not reach. AIA-26-27 notes that a fundamental rights impact assessment under the AI Act may draw on a DPIA."
