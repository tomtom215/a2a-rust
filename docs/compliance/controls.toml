[[control]]
id = "GDPR-5-1e"
source = "gdpr"
provision = "Art. 5(1)(e), 17"
requirement = "Storage limitation, and erasure on request."
sdk = "The in-memory task store evicts terminal tasks an hour after their last write by default (GDPR-25-2). `purge_expired` on the SQL stores removes terminal tasks past an age, with their events and artifact journal, and expires idempotency keys; audit purge removes records past the configured floor. `TaskStore::delete` erases one task by id, with its event log and artifact journal, and in a tenant store touches no other tenant's. Under caller isolation, `erase_caller` on the tenant-aware task and push-config stores removes everything one authenticated caller's partitions hold, in every tenant: tasks, their events, idempotency keys and webhooks. With `AuditLog::with_privacy`, `erase_subject` erases one person from a tenant's audit chain by destroying their key, refused under a legal hold (Art. 17(3)(e)), and the chain still verifies; retention drops the keys no remaining record names."
status = "partial"
