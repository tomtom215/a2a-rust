#
# cargo-deny configuration — license allowlist, banned crates, source policy.
# Run: cargo deny check

[graph]
all-features    = false
no-default-features = false

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------
[licenses]
# Require high confidence for license detection
confidence-threshold = 0.8
# An allowance no dependency uses widens the policy for the next dependency
# without anyone deciding to. `Unicode-DFS-2016` sat here matching nothing
# until 2026-09-23 (audit N17); this makes the next one fail instead of warn.
unused-allowed-license = "deny"

allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

# ---------------------------------------------------------------------------
# Security advisories
# ---------------------------------------------------------------------------
[advisories]
db-path   = "~/.cargo/advisory-db"
db-urls   = ["https://github.com/rustsec/advisory-db"]
# Verified clean before tightening: `cargo deny check advisories` reports no
# yanked crates in the current graph (2026-07-30).
yanked    = "deny"
# Add entries here only when an advisory applies to a transitive
# dependency we can't upgrade yet — with a short justification and an
# upgrade-path note.
#
# Empty since 2026-10-20. Its one entry, RUSTSEC-2024-0436 (`paste`,
# unmaintained, added 2026-09-25), reached the graph only through `genai`
# 0.6 in the two example agents; genai 0.7.0 (released 2026-10-19) depends
# on the `pastey` fork instead, the examples moved to it, and `cargo tree -i
# paste --workspace` matches no package.
ignore    = []

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
# Tightened to "deny" after a per-crate audit (2026-07-31). Read the skip
# list below before adding to it.
#
# History worth keeping: an early pass here treated `winnow` as the only
# duplicate, going off a `tail`-truncated check, and would have shipped
# "deny" with 24 live violations. The full, untruncated output is the only
# valid input to this decision. Re-measured 2026-07-31 on the complete
# 2,129-line log: **26** distinct crates, not the 25 recorded in the previous
# pass — that count was one low.
#
# What the audit found, and why "deny" is now safe:
#
#   * Scoped to the four *published* crates at default features — i.e. what a
#     consumer of this SDK actually resolves — there are only **2** duplicated
#     crates, `getrandom` and `windows-sys`. Both trace to `ring 0.17.14`'s own
#     pinned dependencies (via `rustls`), which this repo cannot influence.
#   * The remaining 24 enter through workspace-only members: the `examples/*`
#     agents (`rig-core`, `genai` and their trees), `benches`, `tck/sut`, and
#     optional `sqlx` backends. They are not in any published dependency graph.
#
# So the duplicates are ecosystem version-skew in other people's trees, not
# something this repo can resolve by upgrading. "warn" was the honest setting
# while that was unverified; it is also a setting nobody reads. "deny" plus a
# reviewed skip list is strictly stronger: every crate below has been looked
# at, and any *new* duplicate — including one introduced by our own change —
# is now an error rather than a line in a log.
#
# Skips are bare crate names, deliberately, not pinned versions. A pinned skip
# turns a routine `cargo update` into a red CI run for a non-issue; a bare name
# says "duplicates of this crate are known and accepted", while still catching
# any crate not on the list. cargo-deny flags unused skip entries, so an entry
# that stops being needed surfaces rather than rotting.
#
# Direct dependencies added to a *published* crate since the 2026-07-31 audit,
# each reviewed here so the review is next to the policy it answers to:
#
#   * `mutants` 0.0.4 in `a2a-protocol-server` (2026-09-10). MIT; declares
#     zero dependencies (crates.io dependency listing, same day); published
#     from the cargo-mutants repository by its author; attribute macros that
#     return their input unchanged. Present so three proved-equivalent mutants
#     can be marked `#[mutants::skip]` in source (ADR 0006). It introduces no
#     duplicate version and no new license.
#   * `ring` 0.17 in `a2a-protocol-client`, optional under the `webhook`
#     feature (2026-10-18), for SHA-256 in the webhook receiver. Not a new
#     crate: the default `tls-rustls` build already links ring 0.17.14
#     through rustls and hyper-rustls (`cargo tree -p a2a-protocol-client
#     -i ring`, same day). License `Apache-2.0 AND ISC`, both on the allow
#     list. No new duplicate version.
#   * `x509-parser` 0.18 in `a2a-protocol-types`, optional under `signing`
#     (2026-10-20), to read the certificate a JWK's `x5c` carries (spec
#     §8.4.3, RFC 7517 §4.7). Rusticata's parser, `MIT OR Apache-2.0`;
#     what it brings (`asn1-rs`, `der-parser`, `oid-registry`, `time`, ...)
#     is MIT or MIT/Apache-2.0, `nom` 7, `data-encoding` and `synstructure`
#     MIT only. rust-version 1.67.1; no default features, so no
#     `ring`/`aws-lc` verify path. Already in
#     Cargo.lock through `rcgen`, though unbuilt there. It brings one new
#     duplicate, `synstructure` 0.13 beside 0.14, a build-time proc-macro
#     helper, skipped below. RustCrypto's `x509-cert` was the alternative:
#     fewer crates, a stricter DER decoder, but absent from the lockfile.
multiple-versions = "deny"
wildcards         = "warn"

skip = [
    # --- Reachable from the published crates (2) ---
    # Both pinned by `ring 0.17.14` (via rustls/hyper-rustls/tokio-rustls)
    # against newer versions elsewhere in the graph. Not fixable here; it
    # resolves when `ring` bumps its own floor.
    { crate = "getrandom", reason = "ring 0.17 pins 0.2.x; rand 0.9 lineage uses 0.3/0.4" },
    { crate = "windows-sys", reason = "ring 0.17 pins 0.52; newer crates use 0.61" },

    # --- Windows per-target crates ---
    # The eight `windows-targets` per-architecture entries were retired
    # 2026-10-23 on cargo-deny's `unnecessary-skip` warning: the split no
    # longer duplicates after the dependency refresh.

    # --- The rand 0.8 -> 0.9 ecosystem migration (3) ---
    # `sqlx-postgres` and `nanoid` (via rig-core) still sit on the 0.8
    # lineage while newer crates are on 0.9. Closes when they migrate.
    { crate = "rand", reason = "sqlx-postgres/nanoid on 0.8; newer deps on 0.9" },
    { crate = "rand_core", reason = "fanout of the rand 0.8 -> 0.9 migration" },
    { crate = "r-efi", reason = "pulled by the split getrandom versions" },

    # --- Ordinary build-tooling version skew in transitive trees (4) ---
    # Six entries were retired 2026-09-10 on cargo-deny's own
    # `unnecessary-skip` warning after the dependency refresh for 0.12: the
    # TOML stack (`toml_edit`, `toml_datetime`, `winnow`, `proc-macro-crate`)
    # and `heck`, `strsim` each resolve to one version now.
    { crate = "convert_case", reason = "derive-macro helper skew in transitive deps" },
    { crate = "core-foundation", reason = "macOS-only; 0.9 vs 0.10 skew in TLS stacks" },
    { crate = "hashbrown", reason = "indexmap generations pull 0.15 and 0.17" },
    { crate = "itertools", reason = "0.13 vs 0.14 skew across transitive crates" },
    # Added 2026-09-10 with the dependency refresh for 0.12. Each is a
    # transition another crate is mid-way through, measured from the full
    # `cargo deny check bans` output on that day:
    # Re-derived from Cargo.lock 2026-09-20; the reason here was backwards and
    # had been since `e168ed12` (2026-09-17, "deps: Bump base64 from 0.22.1 to
    # 0.23.1"). It is the *published* crates that are on the newer line:
    # a2a-protocol-types, -client and -server each declare `base64 = "0.23"`
    # (client directly; types under `signing` and as a dev-dep; server under
    # `auth-jwt`) and resolve 0.23.1. 0.22.1 is held by transitive deps alone.
    #   0.23.1 <- a2a-protocol-{types,client,server}, serde_with, rmcp,
    #             reqwest 0.13, rcgen's pem 4, and the agent-team /
    #             incident-response examples
    #   0.22.1 <- hyper-util, tonic, sqlx-{core,mysql,postgres}, rig-core, genai
    { crate = "base64", reason = "0.23 in the published crates (they declare `base64 = \"0.23\"` directly); 0.22 held only by transitive deps — hyper-util, tonic, sqlx, rig-core, genai — until they move" },
    { crate = "digest", reason = "RustCrypto 0.10 -> 0.11: tungstenite 0.30 moved sha1 to 0.11 while sqlx 0.8's hmac/hkdf/sha2 stay on 0.10" },
    { crate = "block-buffer", reason = "follows digest (RustCrypto 0.10 -> 0.11)" },
    { crate = "crypto-common", reason = "follows digest (RustCrypto 0.10 -> 0.11)" },
    { crate = "cpufeatures", reason = "sha1 0.11 and chacha20 0.10 on 0.3; sha2 0.10 still on 0.2" },
    { crate = "syn", reason = "syn 2 -> 3: async-trait 0.1.92 (via tonic) is on 3 while every derive crate is on 2" },
    # Added 2026-10-20 with `x509-parser` (types, `signing`: the JWK `x5c`
    # check). A proc-macro helper, compiled at build time only.
    { crate = "synstructure", reason = "asn1-rs-derive 0.6 (via x509-parser 0.18) is on 0.13; yoke-derive/zerofrom-derive (via url/icu) are on 0.14" },
    # Added 2026-10-23: sqlx 0.9 is itself mid-migration (cargo deny check
    # bans failed on the dispatched CI run). `rand_chacha` and
    # `redox_syscall` were retired the same day on `unnecessary-skip`.
    { crate = "sha2", reason = "RustCrypto 0.10 -> 0.11 inside sqlx 0.9: sqlx-core (and rig-core 0.42, two examples) is on 0.10.9, sqlx-postgres on 0.11.1 (2026-10-23)" },
    { crate = "foldhash", reason = "hashbrown 0.15 (sqlx 0.8 via hashlink) is on 0.1; serde_json's preserve_order, which genai 0.7 turns on in the two genai examples, is on 0.2 (2026-10-20)" },
]
# `redox_syscall` used to be deliberately absent from the list: it duplicated
# only in the `--all-features` graph, which this check does not resolve, and
# cargo-deny reported the entry as `unmatched-skip`. Since libredox 0.1.23
# (2026-09) it duplicated in the default graph too and went back on the
# list; on 2026-10-23 it resolved to one version and came off again. The rule
# stands: an exemption for something that is not
# happening is how a skip list starts rotting into a blanket waiver, and
# cargo-deny's `unnecessary-skip` warning is what says when to take it off.

deny = [
    # reqwest carries 30+ transitive deps we do not need.
    # Allowed transitively via rig-core and genai.
    { name = "reqwest", wrappers = ["rig-core", "genai"] },
]

# ---------------------------------------------------------------------------
# Source policy — only crates.io, no unknown git sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git      = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
