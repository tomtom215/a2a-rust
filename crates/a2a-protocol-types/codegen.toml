[messages.SecurityScheme]
derives = ["Debug", "Clone"]
attrs = ["#[non_exhaustive]"]
doc_append = """
# Wire format

In A2A v1.0 this is the `SecurityScheme` **`oneof`** from `a2a.proto`, so
its ProtoJSON encoding is a single-key object naming the arm:

```json
{"apiKeySecurityScheme": {"location": "header", "name": "X-Api-Key"}}
{"httpAuthSecurityScheme": {"scheme": "bearer", "bearerFormat": "JWT"}}
```

v0.3 used the OpenAPI-style internally tagged form instead
(`{"type": "apiKey", "in": "header", …}`). **Both are accepted**; only the
v1.0 form is emitted, because §5.5 governs emission and the schema is the
normative definition of the JSON shape. `Serialize` and `Deserialize` are
written by hand, beside this type, for that.

This changed in 0.8: earlier releases emitted the v0.3 form. A reference
`a2a-sdk` client parsed that via its own legacy-compatibility shim, but a
peer feeding the card straight to `ParseDict(…, ignore_unknown_fields=True)`
silently got schemes with **empty contents** — it saw the agent declare
authentication it could not use. See `docs/official-tck-findings.md` §7."""

[messages.SecurityScheme.oneofs.scheme.variants.api_key_security_scheme]
rename = "ApiKey"
why = "the variant names the scheme; the type already says SecurityScheme"

[messages.SecurityScheme.oneofs.scheme.variants.http_auth_security_scheme]
rename = "Http"
why = "the variant names the scheme; the type already says SecurityScheme"

[messages.SecurityScheme.oneofs.scheme.variants.oauth2_security_scheme]
rename = "OAuth2"
type = "Box<crate::security::OAuth2SecurityScheme>"
why = "the variant names the scheme; boxed, as the largest arm, to keep the enum small"
doc_append = "Boxed to reduce the enum's stack size."

[messages.SecurityScheme.oneofs.scheme.variants.open_id_connect_security_scheme]
rename = "OpenIdConnect"
why = "the variant names the scheme; the type already says SecurityScheme"

[messages.SecurityScheme.oneofs.scheme.variants.mtls_security_scheme]
rename = "MutualTls"
why = "the variant names the scheme, spelled as its type MutualTlsSecurityScheme is"

[messages.Part]
derives = ["Debug", "Clone", "PartialEq", "Eq", "Serialize"]
doc_append = """
On the wire the member that is set names the content, beside the other
fields, and `Deserialize` is written by hand, beside this type, to read
them in one pass:

```json
{"text": "hello"}
{"raw": "base64data", "filename": "f.png", "mediaType": "image/png"}
{"url": "https://example.com/f.pdf", "filename": "f.pdf", "mediaType": "application/pdf"}
{"data": {"key": "value"}, "mediaType": "application/json"}
```"""

[messages.Part.oneofs.content]
path = "message::PartContent"
derives = ["Debug", "Clone", "PartialEq", "Eq", "Serialize", "Deserialize"]
attrs = ["#[non_exhaustive]"]
field_doc = "The content of this part (text, raw, url, or data)."
doc = """
The content of a [`Part`], discriminated by JSON member name per v1.0 spec.

In JSON, the member name determines the variant:
- `"text"` → text string content
- `"raw"` → base64-encoded bytes
- `"url"` → URL pointing to content
- `"data"` → structured JSON data"""

[messages.Part.oneofs.content.variants.raw]
type = "String"
why = "proto bytes are base64 text in ProtoJSON, and kept as that text"
