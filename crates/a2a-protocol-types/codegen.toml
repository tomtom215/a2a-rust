[messages.AgentCard]
derives = ["Debug", "Clone", "Serialize", "Deserialize"]
doc_append = """
Served at `/.well-known/agent-card.json`.

# Construction

Prefer [`AgentCard::new`] and the twelve `with_*` methods beside it over a
struct literal: `new` takes the three things the type cannot invent — a
name, a version, an interface — and defaults the rest, so a card built
that way is valid by construction.

```rust
use a2a_protocol_types::agent_card::{AgentCard, AgentInterface, AgentSkill};

let card = AgentCard::new("triage", "1.0.0", AgentInterface::jsonrpc("http://localhost:8080"))
    .with_description("Routes incidents to the right runbook")
    .with_skill(AgentSkill::new("triage", "Triage", "Classifies an incident"));
assert_eq!(card.skills.len(), 1);
```

The builders live in `agent_card/builders.rs`. Three examples written in a
single session on 2026-09-19 each hand-wrote a 38-to-45-line literal
without finding them, which is what this section is here to prevent."""

[messages.AgentCard.fields.supported_interfaces]
aliases = ["supported_interfaces"]
serde = ["default"]
doc_append = """
**Spec requirement:** Must contain at least one element — enforced by
[`validate`](Self::validate), not at parse time: `ProtoJSON` printers
omit empty repeated fields, so parsing treats absence as empty and
validation reports the real problem instead of a JSON type error."""

[messages.AgentCard.fields.documentation_url]
aliases = ["documentation_url"]

[messages.AgentCard.fields.security_schemes]
type = "Option<crate::security::NamedSecuritySchemes>"
aliases = ["security_schemes"]
why = "a map has no default translation; the crate names this one NamedSecuritySchemes"

[messages.AgentCard.fields.security_requirements]
aliases = ["security_requirements"]

[messages.AgentCard.fields.default_input_modes]
aliases = ["default_input_modes"]
serde = ["default"]
doc_append = "`ProtoJSON` printers omit empty repeated fields; absence means empty."

[messages.AgentCard.fields.default_output_modes]
aliases = ["default_output_modes"]
serde = ["default"]
doc_append = "`ProtoJSON` printers omit empty repeated fields; absence means empty."

[messages.AgentCard.fields.skills]
serde = ["default"]
doc_append = """
**Spec requirement:** Must contain at least one element. Parsing treats
absence as empty (`ProtoJSON` omits empty repeated fields)."""

[messages.AgentCard.fields.icon_url]
aliases = ["icon_url"]

[[messages.AgentCard.extra]]
name = "url"
type = "Option<String>"
serde = ["skip_serializing"]
why = "v0.3 cards carry a top-level url; parsing it keeps them readable"
doc = """
Primary URL of the agent — **accepted on input, never emitted.**

This is the v0.3 top-level URL. The v1.0 `lf.a2a.v1` `AgentCard` has no
`url` field at all; `supported_interfaces` replaced it. Emitting it made
this SDK's card fail the specification's own JSON schema —
`'url' does not match any of the regexes: …` — which is what
`CARD-EXT-001` reports (see `docs/official-tck-findings.md` §13).

It is still **parsed**, because a card published by a v0.3 peer carries
it and dropping the field would fail those cards outright. The reference
implementation does the same, popping `url` and folding it into
`supportedInterfaces`.

Read it if you have it; to publish an agent's address, use
`supported_interfaces`."""

[messages.TaskStatus]
derives = ["Debug", "Clone", "PartialEq", "Eq", "Serialize", "Deserialize"]

[messages.Task]
derives = ["Debug", "Clone", "PartialEq", "Eq", "Serialize", "Deserialize"]
doc_append = """
The wire `kind` field (`"task"`) is injected by enclosing discriminated
unions such as [`crate::events::StreamResponse`] and
[`crate::responses::SendMessageResponse`]. Standalone `Task` values received
over the wire may include `kind`; serde silently tolerates unknown fields, so
no action is needed on the receiving side."""

[messages.Task.fields.id]
type = "crate::task::TaskId"
why = "task ids are a newtype, so one cannot be passed where a context id is meant"

[messages.Task.fields.context_id]
type = "crate::task::ContextId"
aliases = ["context_id"]
serde = ["default = \"crate::task::empty_context_id\""]
why = "a newtype like the other ids; absent reads as empty, since ProtoJSON omits an empty string"
doc_append = """
The proto leaves `context_id` optional, and `ProtoJSON` printers omit an
empty string, so a peer's task may arrive without the key; it parses
as an empty id rather than failing the whole response."""

