# ── Enums ────────────────────────────────────────────────────────────────────

[enums.TaskState]
derives = ["Debug", "Clone", "Copy", "PartialEq", "Eq", "Hash", "Serialize", "Deserialize"]
attrs = ["#[non_exhaustive]"]
doc_append = """
On the wire each state is its `ProtoJSON` name (`"TASK_STATE_COMPLETED"`,
spec §5.5); the v0.3 lowercase and kebab-case spellings are accepted on
input.

This enum is closed to the v1.0 states. A future protocol revision that adds
a state would be a wire-breaking change for the gRPC binding: an unknown
`TASK_STATE_*` number from a newer peer is rejected by the protobuf
conversion layer (with a field-scoped error) rather than silently discarded,
so no task is ever reported in a bogus state."""

[enums.TaskState.values]
TASK_STATE_UNSPECIFIED = { aliases = ["unspecified"] }
TASK_STATE_SUBMITTED = { aliases = ["submitted"] }
TASK_STATE_WORKING = { aliases = ["working"] }
TASK_STATE_COMPLETED = { aliases = ["completed"] }
TASK_STATE_FAILED = { aliases = ["failed"] }
TASK_STATE_CANCELED = { aliases = ["canceled"] }
TASK_STATE_INPUT_REQUIRED = { aliases = ["input-required"] }
TASK_STATE_REJECTED = { aliases = ["rejected"] }
TASK_STATE_AUTH_REQUIRED = { aliases = ["auth-required"] }

[enums.Role]
derives = ["Debug", "Clone", "Copy", "PartialEq", "Eq", "Hash", "Serialize", "Deserialize"]
attrs = ["#[non_exhaustive]"]
doc_append = """
On the wire each role is its `ProtoJSON` name (`"ROLE_USER"`, spec §5.5); the
v0.3 lowercase spellings are accepted on input."""

[enums.Role.values]
ROLE_UNSPECIFIED = { aliases = ["unspecified"] }
ROLE_USER = { aliases = ["user"] }
ROLE_AGENT = { aliases = ["agent"] }

# ── Messages ─────────────────────────────────────────────────────────────────

[messages.AgentProvider]
derives = ["Debug", "Clone", "Serialize", "Deserialize"]

[messages.AgentExtension]
derives = ["Debug", "Clone", "Serialize", "Deserialize"]

[messages.AgentExtension.fields.uri]
type = "String"
why = "an extension is identified by its URI: one without is not an extension, so it is never absent"

[messages.AgentInterface]
derives = ["Debug", "Clone", "Serialize", "Deserialize"]
doc_append = """
[`AgentInterface::jsonrpc`], [`AgentInterface::grpc`] and
[`AgentInterface::rest`] take a URL and fill in the binding name and the
protocol version; [`AgentInterface::new`] takes an arbitrary binding."""

[messages.AgentInterface.fields.protocol_binding]
aliases = ["protocol_binding"]
doc_append = """
§12 permits custom bindings, and §5.8 says a custom binding **SHOULD** be
identified by a **URI** rather than a bare name, so that two projects cannot
define incompatible bindings under the same word. This crate's own WebSocket
binding is [`WEBSOCKET_BINDING_URI`](crate::WEBSOCKET_BINDING_URI); it
advertised the bare `"WEBSOCKET"` before 0.11.0, which readers should still
accept."""

[messages.AgentInterface.fields.protocol_version]
aliases = ["protocol_version"]
doc_append = "Spec §3.6: patch version numbers **SHOULD NOT** be used in agent cards."

[messages.AgentCapabilities]
derives = ["Debug", "Clone", "Serialize", "Deserialize"]
attrs = ["#[non_exhaustive]"]
doc_append = """
[`AgentCapabilities::none`] (also its `Default`) leaves every flag unset;
the `with_*` methods set them."""

[messages.AgentCapabilities.fields.push_notifications]
aliases = ["push_notifications"]

[messages.AgentCapabilities.fields.extended_agent_card]
aliases = ["extended_agent_card"]

[messages.AgentSkill]
derives = ["Debug", "Clone", "Serialize", "Deserialize"]
doc_append = """
# Construction

[`AgentSkill::new`] takes the id, name and description; tags, examples and
the two mode lists are set by the `with_*` methods beside it."""

[messages.AgentSkill.fields.tags]
serde = ["default"]
doc_append = """
`ProtoJSON` printers omit empty repeated fields — a skill published by an
official SDK with no tags arrives without the key. Absence means empty;
failing the whole card parse over it is not interoperable."""

[messages.AgentSkill.fields.input_modes]
aliases = ["input_modes"]

[messages.AgentSkill.fields.output_modes]
aliases = ["output_modes"]

[messages.AgentSkill.fields.security_requirements]
aliases = ["security_requirements"]

[messages.AgentCardSignature]
derives = ["Debug", "Clone", "Serialize", "Deserialize"]

[messages.AgentCard]
derives = ["Debug", "Clone", "Serialize", "Deserialize"]
doc_append = """
Served at `/.well-known/agent-card.json`.

# Construction

Prefer [`AgentCard::new`] and the twelve `with_*` methods beside it over a
struct literal: `new` takes the three things the type cannot invent — a
name, a version, an interface — and defaults the rest, so a card built
that way is valid by construction.

```rust
use a2a_protocol_types::agent_card::{AgentCard, AgentInterface, AgentSkill};

let card = AgentCard::new("triage", "1.0.0", AgentInterface::jsonrpc("http://localhost:8080"))
    .with_description("Routes incidents to the right runbook")
    .with_skill(AgentSkill::new("triage", "Triage", "Classifies an incident"));
assert_eq!(card.skills.len(), 1);
```

The builders live in `agent_card/builders.rs`. Three examples written in a
single session on 2026-09-19 each hand-wrote a 38-to-45-line literal
without finding them, which is what this section is here to prevent."""

[messages.AgentCard.fields.supported_interfaces]
aliases = ["supported_interfaces"]
serde = ["default"]
doc_append = """
**Spec requirement:** Must contain at least one element — enforced by
[`validate`](Self::validate), not at parse time: `ProtoJSON` printers
omit empty repeated fields, so parsing treats absence as empty and
validation reports the real problem instead of a JSON type error."""

[messages.AgentCard.fields.documentation_url]
aliases = ["documentation_url"]

[messages.AgentCard.fields.security_schemes]
type = "Option<crate::security::NamedSecuritySchemes>"
aliases = ["security_schemes"]
why = "a map has no default translation; the crate names this one NamedSecuritySchemes"

[messages.AgentCard.fields.security_requirements]
aliases = ["security_requirements"]

[messages.AgentCard.fields.default_input_modes]
aliases = ["default_input_modes"]
serde = ["default"]
doc_append = "`ProtoJSON` printers omit empty repeated fields; absence means empty."

[messages.AgentCard.fields.default_output_modes]
aliases = ["default_output_modes"]
serde = ["default"]
doc_append = "`ProtoJSON` printers omit empty repeated fields; absence means empty."

[messages.AgentCard.fields.skills]
serde = ["default"]
doc_append = """
**Spec requirement:** Must contain at least one element. Parsing treats
absence as empty (`ProtoJSON` omits empty repeated fields)."""

[messages.AgentCard.fields.icon_url]
aliases = ["icon_url"]

[[messages.AgentCard.extra]]
name = "url"
type = "Option<String>"
serde = ["skip_serializing"]
why = "v0.3 cards carry a top-level url; parsing it keeps them readable"
doc = """
Primary URL of the agent — **accepted on input, never emitted.**

This is the v0.3 top-level URL. The v1.0 `lf.a2a.v1` `AgentCard` has no
`url` field at all; `supported_interfaces` replaced it. Emitting it made
this SDK's card fail the specification's own JSON schema —
`'url' does not match any of the regexes: …` — which is what
`CARD-EXT-001` reports (see `docs/official-tck-findings.md` §13).

It is still **parsed**, because a card published by a v0.3 peer carries
it and dropping the field would fail those cards outright. The reference
implementation does the same, popping `url` and folding it into
`supportedInterfaces`.

Read it if you have it; to publish an agent's address, use
`supported_interfaces`."""
