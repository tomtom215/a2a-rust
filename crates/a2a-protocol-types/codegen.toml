[messages.AgentInterface]
derives = ["Debug", "Clone", "Serialize", "Deserialize"]
doc_append = """
[`AgentInterface::jsonrpc`], [`AgentInterface::grpc`] and
[`AgentInterface::rest`] take a URL and fill in the binding name and the
protocol version; [`AgentInterface::new`] takes an arbitrary binding."""

[messages.AgentInterface.fields.protocol_binding]
aliases = ["protocol_binding"]
doc_append = """
§12 permits custom bindings, and §5.8 says a custom binding **SHOULD** be
identified by a **URI** rather than a bare name, so that two projects cannot
define incompatible bindings under the same word. This crate's own WebSocket
binding is [`WEBSOCKET_BINDING_URI`](crate::WEBSOCKET_BINDING_URI); it
advertised the bare `"WEBSOCKET"` before 0.11.0, which readers should still
accept."""

[messages.AgentInterface.fields.protocol_version]
aliases = ["protocol_version"]
doc_append = "Spec §3.6: patch version numbers **SHOULD NOT** be used in agent cards."

