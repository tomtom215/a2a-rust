# ── Enums ────────────────────────────────────────────────────────────────────

[enums.TaskState]
derives = ["Debug", "Clone", "Copy", "PartialEq", "Eq", "Hash", "Serialize", "Deserialize"]
attrs = ["#[non_exhaustive]"]
doc_append = """
On the wire each state is its `ProtoJSON` name (`"TASK_STATE_COMPLETED"`,
spec §5.5); the v0.3 lowercase and kebab-case spellings are accepted on
input.

This enum is closed to the v1.0 states. A future protocol revision that adds
a state would be a wire-breaking change for the gRPC binding: an unknown
`TASK_STATE_*` number from a newer peer is rejected by the protobuf
conversion layer (with a field-scoped error) rather than silently discarded,
so no task is ever reported in a bogus state."""

[enums.TaskState.values]
TASK_STATE_UNSPECIFIED = { aliases = ["unspecified"] }
TASK_STATE_SUBMITTED = { aliases = ["submitted"] }
TASK_STATE_WORKING = { aliases = ["working"] }
TASK_STATE_COMPLETED = { aliases = ["completed"] }
TASK_STATE_FAILED = { aliases = ["failed"] }
TASK_STATE_CANCELED = { aliases = ["canceled"] }
TASK_STATE_INPUT_REQUIRED = { aliases = ["input-required"] }
TASK_STATE_REJECTED = { aliases = ["rejected"] }
TASK_STATE_AUTH_REQUIRED = { aliases = ["auth-required"] }

[enums.Role]
derives = ["Debug", "Clone", "Copy", "PartialEq", "Eq", "Hash", "Serialize", "Deserialize"]
attrs = ["#[non_exhaustive]"]
doc_append = """
On the wire each role is its `ProtoJSON` name (`"ROLE_USER"`, spec §5.5); the
v0.3 lowercase spellings are accepted on input."""

[enums.Role.values]
ROLE_UNSPECIFIED = { aliases = ["unspecified"] }
ROLE_USER = { aliases = ["user"] }
ROLE_AGENT = { aliases = ["agent"] }

