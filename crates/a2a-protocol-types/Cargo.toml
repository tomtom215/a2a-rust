[package]
name        = "a2a-protocol-types"
version     = "0.16.0"
description = "Agent2Agent (A2A) protocol v1.0 — pure data types, serde only, no I/O"
readme      = "README.md"

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/a2a-protocol-types"
keywords               = ["a2a", "agent2agent", "agent", "protocol", "types"]
categories             = ["api-bindings"]

[features]
## Enable agent card signing (JWS, RFC 8785 canonicalization).
# `float_roundtrip` makes serde_json parse every float to the nearest double.
# Without it a peer's card can parse one ULP off, so its canonical bytes — and
# the signature over them — disagree with the signer's (RFC 8785 Appendix B;
# audit T2).
# `x509-parser` reads the certificate a JWK's `x5c` carries, so a key whose
# certificate has expired is not used to verify (spec §8.4.3).
signing = ["dep:base64", "dep:ring", "dep:x509-parser", "serde_json/float_roundtrip"]
## Tamper-evident audit records: the record schema, SHA-256 hash chains,
## ES256/Ed25519-signed checkpoints and chain verification (ADR 0015). Pure
## data and verification; the server crate's `audit` feature writes them.
audit = ["signing"]
## Enable the canonical A2A protobuf message types (`lf.a2a.v1`, prost-generated)
## and lossless conversions to/from the serde domain types. Wire-compatible with
## the official Go/Python/Java A2A SDKs. Pure data — still no I/O; the gRPC
## transports in the server/client crates build their service bindings on top.
proto = [
    "dep:prost",
    "dep:prost-types",
    "dep:base64",
    "dep:time",
    "dep:prost-build",
    "dep:protoc-bin-vendored",
    "dep:anyhow", "dep:hashbrown", "dep:rustix",
]

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
base64      = { version = "0.23", optional = true }
ring        = { version = "0.17.12", optional = true }
x509-parser = { version = ">=0.18, <0.19", optional = true, default-features = false }
prost       = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
time        = { workspace = true, optional = true }

# Floors, not dependencies: nothing here is used by this crate's code. Each names
# a crate that a dependency of ours brings in, at the first version outside a RustSec
# advisory, so a consumer's cargo cannot keep an affected one (`scripts/check_advisory_floors.py`
# names the advisory and the path). Each is switched on only by the features that
# bring the crate in, and adds no crate to any build.
anyhow = { version = ">=1.0.103, <2", default-features = false, optional = true }  # RUSTSEC-2026-0190

[build-dependencies]
prost-build         = { workspace = true, optional = true }
protoc-bin-vendored = { workspace = true, optional = true }
# Floors (see the block above `[build-dependencies]`): build scripts only.
hashbrown = { version = ">=0.15.1, <0.16", default-features = false, optional = true }  # RUSTSEC-2024-0402
rustix = { version = ">=1.1.6, <2", default-features = false, optional = true }  # RUSTSEC-2026-0486

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
proptest  = "1"
criterion = { workspace = true }
ring      = "0.17.12"
base64    = "0.23"
# Mints the X.509 certificates the `x5c` tests verify against.
rcgen     = "0.14"

[[bench]]
name = "json_serde"
harness = false

# `cargo kani` builds with `--cfg kani`, which gates `src/kani_proofs.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
