[package]
name        = "a2a-protocol-client"
version     = "0.15.1"
description = "Agent2Agent (A2A) protocol v1.0 — HTTP client (hyper-backed)"
readme      = "README.md"

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/a2a-protocol-client"
keywords               = ["a2a", "agent2agent", "agent", "protocol", "client"]
categories             = ["network-programming", "web-programming"]

[features]
## HTTPS is on by default: the A2A spec serves agents over HTTPS, so the client
## must reach them out of the box. `tracing` is on by default too: several
## failure paths — a trace header the WebSocket binding cannot carry, a refused
## stream event — report only through it. `otel` adds the OpenTelemetry API,
## so a process that installs a provider gets the client's spans and its
## `rpc.client.call.duration` (decided 2026-10-14). `webhook` adds only `ring`, which `tls-rustls` already links.
## Opt out of all four with `default-features = false` for a
## plaintext-HTTP-only build with no rustls or ring dependency and no logging.
default = ["tls-rustls", "tracing", "otel", "webhook"]
## Enable HTTPS support via rustls (no OpenSSL system dependency), and
## `wss://` for the `websocket` transport. tokio-tungstenite's `__rustls-tls`
## is the feature that compiles its rustls connector in without a root store
## of its own: the transport hands it this crate's `ring`-backed config and
## Mozilla roots, so the public `rustls-tls-*` features would only add a
## second root-store crate. The version range below pins the feature name.
##
## The HTTP bindings, card discovery, JWKS and the token provider share one
## connector: Mozilla's roots plus `SSL_CERT_FILE` / `SSL_CERT_DIR` when set,
## or the config given to `ClientBuilder::with_tls_config`; and the proxy
## `HTTPS_PROXY`, `HTTP_PROXY`, `ALL_PROXY` and `NO_PROXY` name, as curl reads
## them (`hyper-util`'s matcher, already in the graph for OTLP export).
tls-rustls = ["dep:hyper-rustls", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots", "dep:tower-service", "dep:pin-project-lite", "hyper-util/client-proxy", "rustls-pki-types/std", "tokio-tungstenite?/__rustls-tls"]
## Make `a2a_protocol_types::signing` available (JWS, RFC 8785 canonicalization),
## and let card discovery verify signatures.
##
## Verifying needs a trust anchor the client cannot invent, so nothing is
## verified by default: `resolve_agent_card` and `fetch_card_from_url` return
## the card they fetched without checking its `signatures`. Pass the keys you
## trust with `CardFetchOptions::with_signature_keys` to the `_with_options`
## variants and the fetch verifies the card, refusing an unsigned one unless
## `with_require_signature(false)`; `fetch_jwks` fetches a key set.
signing = ["a2a-protocol-types/signing"]
## Structured logging via the `tracing` crate (on by default; compiled out
## when disabled).
tracing = ["dep:tracing"]
## OpenTelemetry for the client's spans: each call's `traceparent` names the
## call's own span, recorded by a `tracing-opentelemetry` layer, so the agent
## called is its child; and `rpc.client.call.duration`, through the global
## meter provider. No exporter — the application, or the server crate's
## `Telemetry`, installs one.
otel = ["tracing", "dep:opentelemetry", "dep:tracing-opentelemetry"]
## Enable WebSocket transport via `tokio-tungstenite`.
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]
## Enable gRPC transport via `tonic`. Speaks the canonical `lf.a2a.v1.A2AService`
## (protobuf-native, wire-compatible with the official Go/Python/Java A2A SDKs).
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tokio-stream", "dep:tonic-types", "dep:tonic-prost-build", "dep:protoc-bin-vendored", "a2a-protocol-types/proto"]
## gRPC over TLS. `grpc` alone has no TLS connector — tonic's is a feature —
## so an `https://` endpoint, or a bare `host:port` the default policy
## dials securely, is refused with a message naming this feature. Verifies
## against the same bundled Mozilla roots (`webpki-roots`, via ring) the
## HTTP transports use, or a `ClientTlsConfig` you supply for a private CA.
grpc-tls = ["grpc", "tonic?/tls-ring", "tonic?/tls-webpki-roots"]
## `webhook::WebhookReceiver`: the receiving side of push notifications
## (spec §4.3.3, §13.2) — token and `Authorization` checks, task-id check,
## duplicate suppression and an optional rate limit, framework-agnostic over
## `http::HeaderMap` and the body bytes. Needs `ring` for SHA-256, which the
## default `tls-rustls` build already links; on by default.
webhook = ["dep:ring"]
## `testing::ScriptedPeer`: a loopback A2A peer that stalls, cuts off,
## mis-frames or refuses every call on purpose, on each binding this build
## speaks, for testing code that calls agents. Adds no dependencies; not for
## production builds.
testing = []

[dependencies]
a2a-protocol-types = { version = "0.15.1", path = "../a2a-protocol-types" }
serde          = { workspace = true }
serde_json     = { workspace = true }
# RFC 6749 §2.3.1 Basic client authentication for the token_provider module.
# Tiny, zero transitive deps; also already in-tree via the types crate's
# `signing` feature.
base64         = "0.23"
# Wipes the stored OAuth client secret on drop. Already in the graph through
# rustls; no new crate.
zeroize        = { version = ">=1.8, <2", default-features = false, features = ["alloc"] }
hyper          = { workspace = true }
http-body-util = { workspace = true }
hyper-util     = { workspace = true }
# Reads an agent card's `Date` and `Expires` (RFC 9111 freshness, spec
# §8.6.2). Already in the graph through hyper; no new crate.
httpdate       = ">=1.0.3, <2"
tokio          = { workspace = true }
uuid           = { workspace = true }
# SHA-256 for the webhook receiver's token index and duplicate cache. The same
# `ring` rustls links in the default build; no new crate.
ring           = { version = "0.17.12", optional = true }
tracing        = { workspace = true, optional = true }
opentelemetry  = { version = "0.33", optional = true, default-features = false, features = ["trace", "metrics"] }
tracing-opentelemetry = { version = ">=0.34, <0.35", optional = true, default-features = false }
tokio-tungstenite = { version = ">=0.30, <0.31", optional = true }
futures-util      = { version = ">=0.3.30, <0.4", optional = true, default-features = false, features = ["sink"] }
hyper-rustls   = { version = ">=0.27, <0.28", optional = true, default-features = false, features = ["ring", "http1", "http2", "webpki-tokio"] }
rustls         = { version = ">=0.23.46, <0.24", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = { version = ">=1.7, <2", optional = true }
webpki-roots   = { version = ">=1.0.10, <2", optional = true }
# `#[mutants::skip]` for the one mutant no test can distinguish in the proxy
# connector (ADR 0006), as in the server crate, which already depends on it.
mutants          = { version = ">=0.0.4, <0.1" }
# The proxy connector (`proxy.rs`); both already in the graph through hyper.
tower-service  = { version = ">=0.3.3, <0.4", optional = true }
pin-project-lite = { version = ">=0.2.14, <0.3", optional = true }
tonic          = { workspace = true, optional = true }
tonic-prost    = { workspace = true, optional = true }
tonic-types    = { workspace = true, optional = true }
prost          = { workspace = true, optional = true }
tokio-stream   = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build   = { workspace = true, optional = true }
protoc-bin-vendored = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
# The call span's own tests record through a real OpenTelemetry tracer, to
# check the `traceparent` it sends (`src/call_span/tests.rs`), and the call
# metric's through a `ManualReader` (`src/call_metric/tests.rs`).
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "experimental_metrics_custom_reader"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
criterion = { workspace = true }
bytes = "1.11.1"
rcgen = "0.14"
tokio-rustls = { version = ">=0.26, <0.27", default-features = false, features = ["ring"] }
rustls = { version = ">=0.23.46, <0.24", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = { version = ">=1.7, <2" }
hyper = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true, features = ["server", "server-auto"] }
a2a-protocol-types = { version = "0.15.1", path = "../a2a-protocol-types" }
# `signing`: `tests/content_end_to_end.rs`, where this server signs what the
# client verifies.
a2a-protocol-server = { version = "0.15.1", path = "../a2a-protocol-server", features = ["websocket", "signing", "tls-rustls"] }
futures-util = { version = ">=0.3.30, <0.4", default-features = false, features = ["sink"] }
# Read socket options back in the connector test; both already in the tree
# through hyper-util.
socket2 = { version = ">=0.6, <0.7", features = ["all"] }
tower-service = ">=0.3, <0.4"
# Sign a card's JSON as a peer would, over a field this SDK does not model
# (`tests/card_signature_verification.rs`); both already in the tree through
# a2a-protocol-types.
ring = "0.17.12"
base64 = "0.23"

[[bench]]
name = "sse_parse"
harness = false

# `cargo fuzz` builds with `--cfg fuzzing`, which gates `src/fuzzing.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
