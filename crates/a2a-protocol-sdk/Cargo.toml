[package]
name        = "a2a-protocol-sdk"
version     = "0.13.0"
description = "Agent2Agent (A2A) protocol v1.0 — convenience umbrella re-export crate"
readme      = "README.md"

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/a2a-protocol-sdk"
keywords               = ["a2a", "agent2agent", "agent", "protocol", "ai"]
categories             = ["network-programming", "web-programming", "api-bindings"]

[features]
## HTTPS is on by default: the A2A spec serves agents over HTTPS, so both the
## client (reaching agents) and the bundled push sender (delivering webhooks)
## must speak TLS out of the box. `tracing` is on by default too, so a default
## build logs through the application's subscriber. Opt out of both with
## `default-features = false`: the three crates below are taken without their
## own defaults, so this list is the only one in force.
default = ["tls-rustls", "tracing"]
## Make `a2a_protocol_types::signing` available across the three crates.
##
## Signing and verification are primitives you call, not behaviour the server or
## client performs on your behalf — see those crates' own `signing` entries.
signing = ["a2a-protocol-types/signing", "a2a-protocol-server/signing", "a2a-protocol-client/signing"]
## Structured logging via the `tracing` crate, in the client and server (on by
## default).
tracing = ["a2a-protocol-client/tracing", "a2a-protocol-server/tracing"]
## Enable HTTPS support via rustls, for both the client and the bundled
## server-side push notification sender.
tls-rustls = ["a2a-protocol-client/tls-rustls", "a2a-protocol-server/tls-rustls"]
## Enable gRPC transport via tonic.
grpc = ["a2a-protocol-client/grpc", "a2a-protocol-server/grpc"]
## gRPC over TLS on both sides: the client dials `https://` (see the client
## crate's entry) and the server's own gRPC listener can serve TLS through
## `GrpcDispatcher::with_tls` (see the server crate's entry).
grpc-tls = ["grpc", "tls-rustls", "a2a-protocol-client/grpc-tls", "a2a-protocol-server/grpc-tls"]
## Enable OpenTelemetry integration.
otel = ["a2a-protocol-server/otel"]
## Enable WebSocket transport via tokio-tungstenite.
websocket = ["a2a-protocol-client/websocket", "a2a-protocol-server/websocket"]
## Enable SQLite-backed task and push config stores via sqlx.
sqlite = ["a2a-protocol-server/sqlite"]
## Enable PostgreSQL-backed task and push config stores via sqlx.
postgres = ["a2a-protocol-server/postgres"]
## Enable Axum framework integration (Router, extractors, IntoResponse).
axum = ["a2a-protocol-server/axum"]
## Enable JWT bearer-token authentication (server `JwtAuthInterceptor`,
## HS256/RS256/ES256, static or remote JWKS with OIDC discovery). The
## header/token interceptors and the client OAuth2 token provider need no
## feature.
auth-jwt = ["a2a-protocol-server/auth-jwt"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Without their own defaults, so the `default` list above decides what a
# default build enables and `default-features = false` removes it (audit K1).
a2a-protocol-types  = { version = "0.13.0", path = "../a2a-protocol-types" }
a2a-protocol-client = { version = "0.13.0", path = "../a2a-protocol-client", default-features = false }
a2a-protocol-server = { version = "0.13.0", path = "../a2a-protocol-server", default-features = false }

[dev-dependencies]
tokio       = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json  = { workspace = true }
tonic-prost = { workspace = true }
prost       = { workspace = true }
# `grpc_address_e2e.rs`: a TLS gRPC listener (tonic's server TLS is enabled
# by the client's `grpc-tls` feature, since tonic is one crate compiled with
# the union of its features) and the certificates it presents.
tonic        = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
rcgen        = "0.14"
rustls       = { version = ">=0.23.45, <0.24", default-features = false, features = ["std", "tls12", "ring"] }
# `observability_e2e.rs` (ADR 0013's gate): spans reach an in-memory exporter
# through `tracing-opentelemetry` 0.33, the release built on the workspace's
# opentelemetry 0.32 (crates.io index: `opentelemetry = "^0.32.0"`), and
# metrics reach a `ManualReader`.
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }
tracing-opentelemetry  = { version = ">=0.33, <0.34", default-features = false }
opentelemetry          = { version = "0.32" }
opentelemetry_sdk      = { version = "0.32", features = ["trace", "metrics", "testing", "experimental_metrics_custom_reader"] }
