[package]
name        = "a2a-protocol-sdk"
version     = "0.7.0"
description = "Agent2Agent (A2A) protocol v1.0 — convenience umbrella re-export crate"
readme      = "README.md"

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation          = "https://docs.rs/a2a-protocol-sdk"
keywords               = ["a2a", "agent2agent", "agent", "protocol", "ai"]
categories             = ["network-programming", "web-programming", "api-bindings"]

[features]
## HTTPS is on by default: the A2A spec serves agents over HTTPS, so both the
## client (reaching agents) and the bundled push sender (delivering webhooks)
## must speak TLS out of the box. Opt out with `default-features = false`.
default = ["tls-rustls"]
## Enable agent card signing.
signing = ["a2a-protocol-types/signing", "a2a-protocol-server/signing", "a2a-protocol-client/signing"]
## Enable structured logging via the `tracing` crate.
tracing = ["a2a-protocol-client/tracing", "a2a-protocol-server/tracing"]
## Enable HTTPS support via rustls, for both the client and the bundled
## server-side push notification sender.
tls-rustls = ["a2a-protocol-client/tls-rustls", "a2a-protocol-server/tls-rustls"]
## Enable gRPC transport via tonic.
grpc = ["a2a-protocol-client/grpc", "a2a-protocol-server/grpc"]
## Additionally serve the deprecated pre-0.7 JSON-tunnel gRPC service for
## rolling upgrades from 0.6 clients. Will be removed in 0.8.
grpc-legacy-json = ["grpc", "a2a-protocol-server/grpc-legacy-json"]
## Enable OpenTelemetry integration.
otel = ["a2a-protocol-server/otel"]
## Enable WebSocket transport via tokio-tungstenite.
websocket = ["a2a-protocol-client/websocket", "a2a-protocol-server/websocket"]
## Enable SQLite-backed task and push config stores via sqlx.
sqlite = ["a2a-protocol-server/sqlite"]
## Enable PostgreSQL-backed task and push config stores via sqlx.
postgres = ["a2a-protocol-server/postgres"]
## Enable Axum framework integration (Router, extractors, IntoResponse).
axum = ["a2a-protocol-server/axum"]
## Enable JWT bearer-token authentication (server `JwtAuthInterceptor`,
## HS256/RS256/ES256, static or remote JWKS with OIDC discovery). The
## header/token interceptors and the client OAuth2 token provider need no
## feature.
auth-jwt = ["a2a-protocol-server/auth-jwt"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
a2a-protocol-types  = { version = "0.7.0", path = "../a2a-protocol-types" }
a2a-protocol-client = { version = "0.7.0", path = "../a2a-protocol-client" }
a2a-protocol-server = { version = "0.7.0", path = "../a2a-protocol-server" }

[dev-dependencies]
tokio       = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json  = { workspace = true }
# Used by the gRPC legacy-coexistence test to hand-roll a 0.6-style
# JSON-tunnel client without regenerating the removed client stubs.
tonic       = { workspace = true }
tonic-prost = { workspace = true }
prost       = { workspace = true }
