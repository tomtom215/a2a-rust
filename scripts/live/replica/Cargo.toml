#
# One replica for the live scripts (scripts/live/README.md), built from this
# checkout. Outside the workspace, with no lockfile committed: it is a test
# harness, resolved fresh against the crates beside it.
# Build: cargo build --release --manifest-path scripts/live/replica/Cargo.toml --target-dir target/live/build

[package]
name = "a2a-live-replica"
version = "0.0.0"
publish = false
edition = "2024"

[[bin]]
name = "a2a-live-replica"
path = "src/main.rs"

[dependencies]
a2a-protocol-server = { path = "../../../crates/a2a-protocol-server", features = ["postgres"] }
a2a-protocol-types = { path = "../../../crates/a2a-protocol-types" }
tokio = { version = "1", features = ["full"] }

[workspace]
