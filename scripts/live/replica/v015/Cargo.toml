#
# The replica as it was at 420c3cb3 (main.rs here, copied from
# scripts/live/replica/src/main.rs at that commit), built against v0.15.0, for
# upgrade_live.py. The shared main.rs has since used 0.16-only APIs, so the
# v0.15 build keeps its own copy (2026-11-14). Needs that tag
# checked out at target/live/v015 first:
#   git worktree add target/live/v015 v0.15.0
# Build: cargo build --release --manifest-path scripts/live/replica/v015/Cargo.toml --target-dir target/live/build-v015

[package]
name = "a2a-live-replica-v015"
version = "0.0.0"
publish = false
edition = "2024"

[[bin]]
name = "a2a-live-replica-v015"
path = "main.rs"

[dependencies]
a2a-protocol-server = { path = "../../../../target/live/v015/crates/a2a-protocol-server", features = ["postgres"] }
a2a-protocol-types = { path = "../../../../target/live/v015/crates/a2a-protocol-types" }
tokio = { version = "1", features = ["full"] }

[workspace]
