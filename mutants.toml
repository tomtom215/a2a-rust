#
# Configuration for cargo-mutants — mutation testing for a2a-rust.
#
# Install:  cargo install cargo-mutants
# Run:      cargo mutants --workspace
# Docs:     https://mutants.rs/
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  NOTHING IN THIS FILE IS IN EFFECT. Measured 2026-08-14, cargo-mutants   ║
# ║  27.1.0. Read this before reasoning from any value below.                ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# cargo-mutants does not discover a `mutants.toml` at the repository root; it
# looks for `.cargo/mutants.toml`. Individual keys were already known to be
# ignored — `test_tool`, `profile` and `exclude_re` each carry a note below
# saying so — but the cause is not per-key. The file is never read.
#
# Two independent checks, both reproducible:
#
#   1. `cargo mutants -p a2a-protocol-types --all-features --list` lists 155
#      mutants under `crates/a2a-protocol-types/src/proto/`, the exact path
#      `exclude_globs` below claims to exclude. Identical count with
#      `--no-config`, which is the tell: disabling a config that is not being
#      read changes nothing.
#
#   2. `cargo mutants --config mutants.toml --list` — pointing at this file
#      explicitly — does not run at all:
#
#          Error: parse toml from mutants.toml
#          Caused by: TOML parse error at line 1, column 1
#                     unknown field `cap_timeout`
#
#      cargo-mutants 27.1.0 rejects unknown fields outright, so if this file
#      *were* discovered, every sweep would abort on it. It has never aborted,
#      which is the second proof that it is not being read.
#
# What actually governs a sweep is the command line in
# .github/workflows/mutants.yml: `-p <crate> --shard --jobs 4
# --test-tool=nextest --profile=mutants -- --all-features --run-ignored all`.
# Concretely, what that means versus what this file says:
#
#   * Timeout: cargo-mutants' default 5.0x baseline with NO cap, not the 3.0x
#     and 300s below. Measured on the same day: `Unmutated baseline in 50s
#     build + 65s test` / `Auto-set test timeout to 328s`. 328 > 300 settles it
#     independently of the multiplier — a cap that was applied could not be
#     exceeded. (The `mutants-incremental` job does pass `--timeout 300` on the
#     command line, so the PR gate is capped and the full sweep is not.)
#   * Exclusions: none. Generated protobuf code IS mutated, and its mutants are
#     inside every score this repository has published.
#   * `examine_globs`: moot — `-p <crate>` already scopes each shard.
#
# Deliberately NOT fixed as part of the 0.8 release. Moving this to
# `.cargo/mutants.toml` and dropping `cap_timeout` so it parses would change
# what the sweep measures — roughly 155 fewer mutants per crate with a proto
# module, and a per-mutant budget cut from ~328s to 195s — which makes the
# number non-comparable with every row in the mutation history and risks
# reintroducing the TIMEOUTs that a tighter budget caused before. That is a
# measured change, not a tail-of-release edit. See ROADMAP.md.
#
#
# Measured 2026-08-19, cargo-mutants 27.1.0, `-p a2a-protocol-types
# --all-features --list`, counting listed mutants:
#
#   no .cargo/mutants.toml (today)          731 listed, 155 of them src/proto/
#   this file copied to .cargo/ verbatim    tool refuses to start:
#                                           "unknown field `cap_timeout`"
#   the same file minus cap_timeout + jobs  576 listed, 0 of them src/proto/
#
# So the "roughly 155" estimate above is exact for this crate, and the move is
# a two-key edit away from working rather than a one-key edit. Note the middle
# row: as things stand the move does not *narrow* the gate, it *stops the tool*.
# A shard that cannot start is the one failure mode a mutation gate must not
# have, so whoever does this should confirm the sweep still lists mutants
# before trusting a green run.
#
# The hazard `cap_timeout` was written for — a hung mutant burning the whole
# job timeout — is now handled a layer down and better, by the 45s per-test
# kill in `.config/nextest.toml`: it bounds the hang *and* names the test.

# ── Timeout ──────────────────────────────────────────────────────────────────
# Not in effect. See the banner above.
timeout_multiplier = 3.0

# Floor: no mutant gets less than 30s even if the baseline is very fast.
minimum_test_timeout = 30

# Not in effect, and this key in particular is why the whole file is not read:
# cargo-mutants 27.1.0 has no `cap_timeout` field and rejects unknown fields, so
# the moment this file is actually discovered it becomes a hard parse error, not
# a warning. Anyone moving this to `.cargo/mutants.toml` must delete this line
# first. See the banner at the top.
#
# What it was written for, kept because the reasoning still holds if a cap is
# ever set on the command line: 120s proved too tight on slower GitHub runners
# where the a2a-server baseline alone is ~60s; at a 3x multiplier the effective
# timeout was ~120s, leaving almost no headroom and reporting trivial mutations
# (Debug impls, accessor methods) as TIMEOUT rather than CAUGHT.
cap_timeout = 300

# ── Test tool & build profile ───────────────────────────────────────────────
# CI passes `--test-tool=nextest --profile=mutants` on the command line
# (.github/workflows/mutants.yml): nextest runs the many per-crate test
# binaries in parallel with run-wide fail-fast so CAUGHT mutants die at the
# first failing test, and the `mutants` profile (Cargo.toml) drops debuginfo
# from the hundreds of per-mutant rebuilds. They are CLI flags rather than
# config keys because this cargo-mutants version ignores the corresponding
# config entries silently. Caveat: nextest does not run doctests — if a
# future sweep reports a missed mutant that only a doctest covered, add a
# unit test for it.

# ── Parallelism ──────────────────────────────────────────────────────────────
# Run mutants in parallel within each CI job.  GitHub-hosted ubuntu-latest
# runners have 4 vCPUs, so 4 concurrent mutants is the sweet spot.
# The CI workflow also splits crates across parallel jobs (matrix strategy).
#
# Also not a config key. Measured 2026-08-19 by writing each key of this file
# into `.cargo/mutants.toml` on its own and running
# `cargo mutants -p a2a-protocol-types --list`: `cap_timeout` and `jobs` are the
# only two that produce `unknown field`. The banner above named `cap_timeout`
# alone, so anyone following its "drop cap_timeout so it parses" would have hit
# a second crash on the next line. `--jobs` is a command-line flag in 27.1.0
# and mutants.yml already passes it.
jobs = 4

# ── Packages to test ────────────────────────────────────────────────────────
# Test the four library crates.  Examples are excluded — they are exercised
# indirectly by the dogfood test suite but are not the subject of mutation
# testing (their code is demonstration, not library surface area).
examine_globs = [
    "crates/a2a-protocol-types/src/**/*.rs",
    "crates/a2a-protocol-client/src/**/*.rs",
    "crates/a2a-protocol-server/src/**/*.rs",
    "crates/a2a-protocol-sdk/src/**/*.rs",
]

# ── Exclusions ───────────────────────────────────────────────────────────────
# Only generated code is excluded. Pure re-export files (e.g. the sdk's
# lib.rs) contain no function bodies, so cargo-mutants generates no mutants
# for them and they need no entry here. A previous blanket "**/mod.rs"
# exclusion claimed mod files were "re-exports only" — in fact 14 of them
# carry real logic (InMemoryTaskStore, the background event processor, the
# REST/JSON-RPC dispatch entry points, builder accessors, …), and the glob
# silently exempted ~2,800 lines from the mutation gate.
# Not in effect — measured 2026-08-14, and this is the check that first exposed
# the banner at the top of this file. `cargo mutants -p a2a-protocol-types
# --all-features --list` lists 155 mutants under
# `crates/a2a-protocol-types/src/proto/`, and `--no-config` lists the same 155.
# Generated protobuf code is mutated in every sweep, and its mutants are part of
# every published score.
exclude_globs = [
    "crates/*/src/proto/**",              # generated protobuf code
]

# Skip functions whose mutations are unproductive (logging, tracing)
# or semantically unkillable.
# Note: Display/Debug impls are NOT excluded — we have tests for them.
# !! This key is SILENTLY IGNORED by cargo-mutants 27.1.0. Verified 2026-08-09
# with `--list`: the entries below change nothing, and a precise pattern added
# here still produced the mutant it named. The same version ignores `test_tool`
# and `profile` the same way (see above), which is why those are CLI flags too.
#
# 2026-08-14 — the cause of all three is now known and it is not per-key: this
# file is not read at all, because cargo-mutants looks for `.cargo/mutants.toml`
# and this is at the repository root. See the banner at the top. The advice
# below is still the right advice; it was simply never the key's fault.
#
# The entries are kept because they express intent and will start working if a
# future version honours the key — but **do not add an exclusion here and assume
# it took effect**. Confirm with:
#
#     cargo mutants --file <path> --list | wc -l
#
# before and after. Real exclusions are passed as `--exclude-re` on the command
# line in .github/workflows/mutants.yml, where they demonstrably work.
exclude_re = [
    "^tracing::",                          # tracing instrumentation
    "^log::",                              # log macros
]

# ── No equivalent mutants are excluded anywhere ─────────────────────────────
# There is no `--exclude-re` in .github/workflows/mutants.yml. The sweep and
# the blocking incremental gate both run with zero exclusions.
#
# What used to be here: `replace > with >= in InMemoryTaskStore::evict`,
# matching the capacity guard in `evict` and its non-terminal fallback, both
# spelled `store.len() > max`. Both were genuinely equivalent — at `len == max`
# the `>=` arm entered with `overflow`/`remaining` of 0, sorted, and removed
# nothing observable.
#
# The note that replaced them said this guard could not be deleted the way
# `messaging.rs`'s was, because it skips an O(n log n) collect-and-sort and
# deleting it would pay that sort on every write sitting exactly at capacity.
# That was correct, and it is why the fix (2026-08-09) changes the guard's
# *spelling* rather than removing it:
#
#     let overflow = store.len().saturating_sub(max);
#     if overflow != 0 { … }
#
# The branch still short-circuits at or below capacity, so the sort is skipped
# exactly as before. But `!=` mutates only to `==`, which inverts the guard and
# is caught, whereas `>` mutated to the equivalent `>=`. The equivalence was a
# property of the operator, not of the logic.
#
# Measured, not assumed — `--list` before and after:
#   * eviction.rs: 25 mutants -> 17
#   * the old exclusion pattern: 2 matches -> 0, crate-wide across 2097 mutants
#   * full sweep of eviction.rs afterwards: 17 mutants, 17 caught, exit 0
#
# The general rule this suggests: an equivalent mutant is usually a branch
# guarding a no-op, or an operator whose weakened form reaches the same state.
# Both are often fixable in the source, which is strictly better than a gate
# agreeing not to look. Try that before adding an exclusion here.
#
# It also retires the open question of whether to take `mutants` as a
# dependency of a published crate for in-source `#[mutants::skip]` (ADR 0006,
# ROADMAP.md): with nothing left to skip, nothing rides on that decision.

# Previously this list held workarounds for equivalent mutations in
# grpc_code_to_error_code (DeadlineExceeded|Cancelled arms) and
# build_query_string (Number|Bool arms), plus hard-to-test targets like
# GrpcTransport::endpoint and grpc_stream_reader_task. Those entries are
# now unnecessary: the redundant match arms have been deleted (the wildcard
# already covers them) and direct unit tests have been added for the two
# transport paths using `Channel::connect_lazy` and an in-memory
# `tokio_stream::iter` mock stream.

# ── Additional cargo test arguments ─────────────────────────────────────────
# Pass --all-features so mutation tests exercise signing, tracing, websocket,
# sqlite, etc.  This matches the CI test matrix.
#
# Not in effect either (see the banner at the top), but harmless here and only
# here: every invocation in .github/workflows/mutants.yml already passes
# `-- --all-features --run-ignored all` on the command line, so the sweep gets
# what this line asks for by another route. A local `cargo mutants` with no
# trailing args does NOT, and will quietly measure a smaller feature set.
additional_cargo_test_args = ["--all-features"]
