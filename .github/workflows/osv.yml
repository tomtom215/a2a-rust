#
# OSV-Scanner: every tracked lockfile against the OSV database.
#
# # Why this exists beside cargo-deny
#
# cargo-deny (ci.yml `deny`, and the binding's own step) audits the Rust graph
# cargo *resolves*, for the root workspace and the SLIMRPC binding. It never
# looked at the other five Cargo.lock files this repository tracks, nor at the
# Go, Java, JavaScript and Python lockfiles of the conformance peers. On
# 2026-10-08 a first osv-scanner run found `itk/Cargo.lock` and
# `fuzz/Cargo.lock` still pinning h2 0.4.15 (RUSTSEC-2026-0258) months after
# the root workspace moved to a fixed h2, and dozens of advisories in the
# peers' lockfiles. Nothing in CI could have said so.
#
# # Two scopes, two verdicts
#
# * **Rust lockfiles — blocking.** The nine Cargo.lock files. A finding here
#   is ours to fix, or to waive in the `osv-scanner.toml` beside the lockfile
#   with a reason and an `ignoreUntil` date, as `deny.toml` does.
# * **Conformance peers — reported, not blocking.** The Go, Java, JavaScript
#   and Python agents under `itk/` and `benches/` pin the official SDKs at the
#   versions `tck.yml` grades; their transitive dependencies are those SDKs'
#   choices, and they run only on CI runners against loopback. Their findings
#   go to code scanning, where they are visible, without turning the build red
#   over a dependency this repository does not ship.
#
# A pull request runs both Rust jobs. `rust` scans the head as it is and
# fails on any finding not waived, exactly as on main; `rust-pr` compares the
# head against the base and attributes what the pull request introduced.
# Until 2026-10-14 a pull request ran only `rust-pr`, and `rust` showed as
# skipped. A finding already on main is not new, so no pull request could
# fail on it: RUSTSEC-2024-0449 was waived in the binding's deny.toml but not
# in its osv-scanner.toml (PR #168), every run of that PR passed, and main
# went red on the merge. cargo-deny in ci.yml already fails a pull request on
# any unwaived advisory, published that day or not; this job now agrees with
# it. The cost is the same one deny has: an advisory published against an
# unchanged lockfile reddens every open pull request until it is fixed or
# waived.
#
# The PR variant scans the base with the same arguments, and a lockfile the
# base does not have yet fails that scan, which fails the job. So a new
# lockfile goes in `rust` first and joins `rust-pr` in a later pull request,
# once it is on main. `verification/loom-halt/Cargo.lock` went through that
# sequence: `rust` from #163, `rust-pr` once #163 had merged, and
# `tools/a2a-codegen/Cargo.lock` the same way with #171.

name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust-pr:
    name: Rust lockfiles (new findings)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      results-file-name: osv-rust.sarif
      fail-on-vuln: true
      scan-args: |-
        --lockfile=Cargo.lock
        --lockfile=bindings/a2a-protocol-slimrpc/Cargo.lock
        --lockfile=itk/Cargo.lock
        --lockfile=fuzz/Cargo.lock
        --lockfile=benches/sdk-comparison/harness/agent-a2a-rs/Cargo.lock
        --lockfile=benches/sdk-comparison/harness/agent-a2a-rust/Cargo.lock
        --lockfile=benches/sdk-comparison/harness/loadgen/Cargo.lock
        --lockfile=verification/loom-halt/Cargo.lock
        --lockfile=tools/a2a-codegen/Cargo.lock

  # Inline rather than through the reusable workflow, step for step what that
  # workflow runs (osv-scanner-reusable.yml at v2.6.0), so this workflow has
  # an upload-sarif step of its own. Scorecard's Token-Permissions check
  # accepts `security-events: write` only in a workflow where it can see the
  # SARIF upload; the reusable workflow hides it, and all three jobs were
  # reported (alerts #94-#96 on main).
  rust:
    name: Rust lockfiles
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run scanner
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.6.0
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --output=results.json
            --format=json
            --lockfile=Cargo.lock
            --lockfile=bindings/a2a-protocol-slimrpc/Cargo.lock
            --lockfile=itk/Cargo.lock
            --lockfile=fuzz/Cargo.lock
            --lockfile=benches/sdk-comparison/harness/agent-a2a-rs/Cargo.lock
            --lockfile=benches/sdk-comparison/harness/agent-a2a-rust/Cargo.lock
            --lockfile=benches/sdk-comparison/harness/loadgen/Cargo.lock
            --lockfile=verification/loom-halt/Cargo.lock
            --lockfile=tools/a2a-codegen/Cargo.lock
        continue-on-error: true
      - name: Check that the scan completed
        if: ${{ steps.scan.outcome == 'failure' }}
        run: |
          if [ ! -s results.json ]; then
            echo "::error::OSV-Scanner failed without writing results.json, so there are no results to report on."
            exit 1
          fi
      - name: Report
        uses: google/osv-scanner-action/osv-reporter-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.6.0
        with:
          scan-args: |-
            --output=osv-rust.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true
      - name: Upload artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OSV Scanner SARIF file
          path: osv-rust.sarif
          retention-days: 5
      - name: Upload to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: osv-rust.sarif

  peers:
    name: Conformance peers (informational)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      results-file-name: osv-peers.sarif
      fail-on-vuln: false
      scan-args: |-
        --lockfile=itk/agents/go-agent/go.mod
        --lockfile=itk/agents/go-sdk/go.mod
        --lockfile=itk/interop/go-sdk-client/go.mod
        --lockfile=itk/agents/java-agent/pom.xml
        --lockfile=itk/agents/java-sdk/pom.xml
        --lockfile=itk/agents/js-sdk/package-lock.json
        --lockfile=itk/agents/js-agent/package-lock.json
        --lockfile=itk/agents/python/requirements.txt
        --lockfile=requirements.txt:itk/agents/python/requirements.lock
        --lockfile=benches/requirements-cross-language.txt
