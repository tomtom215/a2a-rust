# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 Tom F.
#
# Mutation testing — verifies that tests actually detect code changes.
#
# Runs cargo-mutants on all library crates and fails if any mutant survives.
# Full sweep is scheduled weekly + on-demand; PRs to main run the
# incremental (diff-only) job instead — see the `on.schedule` cron below.
#
# Architecture:
#   - Full sweep splits into 21 parallel jobs: 12 shards of a2a-server,
#     4 each of a2a-types and a2a-client, and a2a-sdk whole (it is a pure
#     re-export facade and generates no mutants at all). Sharding exists to
#     stay inside the per-job timeout, which was 120 minutes until 2026-08-07
#     and is now 240; at 8 shards two of them hit the old limit (run
#     30236603180, 2026-07-27) and were cancelled. Every sharded job now
#     carries a comparable load of roughly 170-200 mutants.
#   - A lightweight aggregation job merges per-crate reports and produces the
#     combined score.
#   - Incremental mode (PRs) mutates only PR-diff changes (--in-diff) in one job.
#
# CI output is optimised for readability:
#   - cargo-mutants raw output is captured to a file (not streamed to the log)
#   - GitHub Actions log groups collapse noisy sections
#   - A structured summary with per-crate breakdown is written to GITHUB_STEP_SUMMARY
#   - Timeouts are tracked and surfaced separately from missed mutants
#   - Only actionable information (surviving mutants + how to fix) appears un-collapsed

name: Mutation Testing

on:
  # PRs run the **incremental** job (`mutants-incremental` below): only the
  # source lines changed in the PR diff are mutated (cargo-mutants `--in-diff`),
  # which fits inside the per-job timeout without needing a full sweep. The
  # full sweep across
  # every crate (`mutants-crate`) is gated on the matrix itself (`if:
  # github.event_name != 'pull_request'`) so incremental runs on PRs and
  # the full sweep runs on schedule / workflow_dispatch.
  pull_request:
    branches: ["main"]
  # Full sweep runs weekly (and on-demand via workflow_dispatch). The
  # incremental PR gate only re-checks mutation adequacy of files a PR
  # touches; without a recurring whole-repo sweep, code outside recent diffs
  # would never be re-verified.
  schedule:
    - cron: "0 3 * * 1" # 03:00 UTC every Monday
  workflow_dispatch:
    inputs:
      package:
        description: "Specific package to test (blank = all 4 crates in parallel)"
        required: false
        type: string

# Mutation testing only reads sources — never grant the default token more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # There are deliberately NO mutation exclusions here.
  #
  # There used to be one — `replace > with >= in InMemoryTaskStore::evict`,
  # matching two proven-equivalent mutants. It is gone because the equivalence
  # was a property of the code's shape rather than of the logic: `evict`
  # computed `len - max` under an `if len > max` guard, so at `len == max` the
  # `>=` arm collected, sorted and then `take(0)`-ed, doing nothing observable.
  # Rewriting it as `saturating_sub` followed by `!= 0` keeps the behaviour and
  # deletes the operator, so the mutants no longer exist to be excluded.
  # Measured 2026-08-09: the pattern matched 2 mutants before and 0 after, and
  # `eviction.rs` went from 25 mutants to 17 with all 17 caught (exit 0).
  #
  # Prefer that route to adding an entry here. An equivalent mutant is usually
  # a branch guarding a no-op, and a branch guarding a no-op can be deleted —
  # which is a better outcome than a gate that agrees to ignore it. Anything
  # added here must clear ADR 0006's burden: "no test can distinguish it", not
  # "no test occurred to me", and must be measured with `--list` before and
  # after so its scope is known rather than assumed.

jobs:
  # ── Per-crate mutation sweep (parallel) ──────────────────────────────────────
  #
  # Splits the workspace across parallel runners. This avoids the per-job
  # timeout that the monolithic --workspace run hit when it was 120 minutes,
  # since a2a-server alone generates > 1,800 mutants.
  #
  # When a specific package is provided via workflow_dispatch, only that
  # package's job runs (the others are skipped via the `if` condition).
  mutants-crate:
    name: "Mutants (${{ matrix.name }})"
    # Full-sweep matrix runs only on manual dispatch or (if re-enabled) the
    # nightly schedule. Pull requests are covered by the incremental job
    # below, which fits inside the per-job timeout by mutating only changed
    # files.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 240, raised from 120 on 2026-08-07. Measured from run 31193107921, the
    # first sweep in which every shard completed:
    #
    #   a2a-types    113m   674 mutants, unsharded
    #   a2a-server 2/12  111m   180 mutants (135 of them unviable)
    #   a2a-client   101m   804 mutants, unsharded
    #   …
    #   a2a-server 3/12   41m   180 mutants (0 unviable)
    #
    # The slowest job finished with **seven minutes** to spare against the old
    # 120. That is the same margin that lost two shards in run 30236603180, and
    # the workload only grows. 240 gives better than 2x headroom over the
    # measured worst case and stays well inside the 360-minute ceiling for
    # GitHub-hosted runners.
    #
    # Raising a timeout is not free — a genuinely stuck job now burns four
    # hours instead of two. ~~That is bounded in practice: `cap_timeout = 300`
    # in mutants.toml kills any single mutant after five minutes, so a shard
    # can be slow but not hung.~~ **False, and measured false on 2026-08-14:**
    # cargo-mutants never reads that file (it looks for `.cargo/mutants.toml`),
    # so there is no cap and the per-mutant budget is the tool's default 5x
    # baseline. What actually bounds a shard is `.config/nextest.toml`, which
    # nextest does read and which kills any single *test* at 45s. That is a
    # tighter bound than `cap_timeout` ever described, and it names the test.
    #
    # Note what the table shows: runtime tracks *unviable* mutants more than
    # total ones. Shard 2/12 and shard 3/12 both had 180 mutants and differed
    # by 70 minutes — 135 unviable versus 0. An unviable mutant still costs a
    # full compile before it fails, whereas a caught one exits early under
    # nextest's fail-fast. So per-shard cost is dominated by builds, not tests.
    #
    # The two slowest jobs in that run were the two crates that had never been
    # sharded — a2a-server was split 12 ways when it hit this wall, while
    # a2a-types and a2a-client were left whole and quietly grew to 4x the load
    # of any a2a-server shard. Both are now split 4 ways as well, which is the
    # structural fix; this timeout is the safety net behind it.
    #
    # Note that the sweep's wall-clock is unchanged by that split: it is set by
    # the slowest job overall, still a2a-server 2/12 at 111m. What changed is
    # that no job now sits near its own ceiling.
    timeout-minutes: 240
    # A live database, for the same reason `test-postgres` in ci.yml has one.
    #
    # Without it the Postgres sources are mutated but their tests cannot run
    # (the whole suite is `#[ignore]`d behind A2A_TEST_POSTGRES_URL), so every
    # mutant in them survives — and the gate reports environmental blindness
    # as test inadequacy. Measured, not assumed: `pg_migration.rs` had 12
    # survivors in the 2026-07-27 sweep; re-run locally against a real
    # PostgreSQL 16 with `--run-ignored all`, 13 of its 14 mutants were caught
    # immediately and the 14th was a genuine boundary gap, now covered. The
    # file is at 14/14.
    #
    # The alternative was excluding these files in mutants.toml. That would
    # have recorded 18 real, checkable mutants as permanently out of scope on
    # the strength of a CI limitation — the same trade that put a blanket
    # `**/mod.rs` exclusion in this project's config and silently exempted
    # ~2,800 lines. Measuring them costs one service container. (Post-2026-08-14
    # footnote: an exclusion there would not have taken effect anyway, since
    # cargo-mutants never reads that file. The judgement was right for the
    # wrong reason, which is worth knowing before trusting the next one.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    strategy:
      fail-fast: false   # Don't cancel other crates if one fails
      matrix:
        # a2a-server has > 1,800 mutants and cannot finish inside a single
        # 2-hour job even at 4-way intra-crate parallelism — so we shard it
        # across 12 separate runners. Wall-clock ≈ the slowest shard; runs
        # use nextest + a debuginfo-free profile, both passed as CLI flags in
        # the step below (`[profile.mutants]` is defined in Cargo.toml).
        #
        # It was 8, and 8 was not enough: in run 30236603180 (2026-07-27) the
        # shards that finished took 86-113 minutes, and shards 3/8 and 4/8
        # were cancelled at the 120-minute job timeout. 12 shards cut the
        # per-shard load by a third, putting the slowest inside the limit
        # with real headroom rather than four minutes of it.
        #
        # a2a-types (674 mutants, 113m) and a2a-client (804 mutants, 101m) were
        # single jobs until 2026-08-07 and had become the slowest in the sweep,
        # a2a-types finishing seven minutes inside the old 120-minute limit.
        # Split 4 ways they land at ~168 and ~201 mutants — the same size class
        # as an a2a-server shard — for a projected ~33m and ~30m each, derived
        # from run 31193107921 by holding the ~7m fixed cost (toolchain install,
        # cache, baseline build and test) constant and dividing the remainder.
        #
        # The `shard` value is passed verbatim to cargo-mutants' `--shard K/N`
        # flag, which splits mutants deterministically across shards. a2a-sdk
        # stays whole at K=0/N=1 (≡ no sharding): it has no mutants to split.
        include:
          - crate: a2a-protocol-types
            short: a2a-types
            name: a2a-types shard 1/4
            shard: "0/4"
          - crate: a2a-protocol-types
            short: a2a-types
            name: a2a-types shard 2/4
            shard: "1/4"
          - crate: a2a-protocol-types
            short: a2a-types
            name: a2a-types shard 3/4
            shard: "2/4"
          - crate: a2a-protocol-types
            short: a2a-types
            name: a2a-types shard 4/4
            shard: "3/4"
          - crate: a2a-protocol-client
            short: a2a-client
            name: a2a-client shard 1/4
            shard: "0/4"
          - crate: a2a-protocol-client
            short: a2a-client
            name: a2a-client shard 2/4
            shard: "1/4"
          - crate: a2a-protocol-client
            short: a2a-client
            name: a2a-client shard 3/4
            shard: "2/4"
          - crate: a2a-protocol-client
            short: a2a-client
            name: a2a-client shard 4/4
            shard: "3/4"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 1/12
            shard: "0/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 2/12
            shard: "1/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 3/12
            shard: "2/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 4/12
            shard: "3/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 5/12
            shard: "4/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 6/12
            shard: "5/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 7/12
            shard: "6/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 8/12
            shard: "7/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 9/12
            shard: "8/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 10/12
            shard: "9/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 11/12
            shard: "10/12"
          - crate: a2a-protocol-server
            short: a2a-server
            name: a2a-server shard 12/12
            shard: "11/12"
          - crate: a2a-protocol-sdk
            short: a2a-sdk
            name: a2a-sdk
            shard: "0/1"
    env:
      A2A_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      # Skip this matrix entry if a specific package was requested and it
      # doesn't match this crate.
      - name: Check if this crate should run
        id: check
        run: |
          INPUT_PKG="${{ inputs.package }}"
          if [ -n "$INPUT_PKG" ] && [ "$INPUT_PKG" != "${{ matrix.crate }}" ] && [ "$INPUT_PKG" != "${{ matrix.short }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.crate }} — user requested '$INPUT_PKG'"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # Shard-safe artifact name (GitHub disallows `/` in artifact names).
          SHARD_TAG="${{ matrix.shard }}"
          SHARD_TAG="${SHARD_TAG//\//-}"
          echo "shard_tag=${SHARD_TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.check.outputs.skip == 'false'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.skip == 'false'

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.check.outputs.skip == 'false'

      # protoc is bundled via the `protoc-bin-vendored` crate.

      - name: Install cargo-mutants and nextest
        if: steps.check.outputs.skip == 'false'
        run: cargo install cargo-mutants cargo-nextest --locked

      # ── Run mutants for this crate ───────────────────────────────────────
      - name: "Run mutation tests: ${{ matrix.name }}"
        id: mutants
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "::group::cargo-mutants execution log (${{ matrix.name }})"

          set +e
          # `pipefail` so `tee` cannot mask cargo-mutants' exit status —
          # without it `$?` is always tee's 0 and the code recorded below is
          # meaningless.
          set -o pipefail
          # `--output .` writes the report to ./mutants.out.
          #
          # cargo-mutants always creates a directory *named* `mutants.out`
          # inside whatever `--output` names, so the previous
          # `--output mutants.out` wrote to `mutants.out/mutants.out/` while
          # every reader below looked in `mutants.out/`. That mismatch is
          # what made this gate vacuous; the next step asserts the layout
          # rather than trusting this comment.
          #
          # ~~Per-mutant timeout is controlled via `cap_timeout` in
          # mutants.toml (raised from 120 → 300 because the a2a-server
          # baseline test suite alone takes ~60s on GitHub-hosted runners;
          # at 3x the auto-computed timeout already exceeds 120, so the
          # previous cap was masking real CAUGHT results as TIMEOUT).~~
          # **Measured false 2026-08-14** — mutants.toml is never read, so the
          # per-mutant budget here is cargo-mutants' default 5x baseline with
          # no cap (`baseline 65s test` → `Auto-set test timeout to 328s`,
          # above the 300 that file claims). The reasoning about ~60s baselines
          # still explains why a tight cap was a bad idea; it just never
          # applied. `.config/nextest.toml` is what bounds a hang now.
          # `--run-ignored all` so the Postgres suite actually runs against
          # the service container above; without it those tests stay
          # `#[ignore]`d and every Postgres mutant survives for want of a
          # database rather than for want of a test.
          # No `--exclude-re`: the sweep now has no exclusions at all. See the
          # note in the `env:` block above for what was here and why deleting
          # the branch beat excluding the mutant. If one is ever needed again it
          # belongs on the command line, not as `exclude_re` in mutants.toml —
          # cargo-mutants 27.1.0 silently ignores that config key, exactly as it
          # ignores `test_tool` and `profile`.
          #
          # `--test-tool=nextest` means `.config/nextest.toml` applies, and it
          # is load-bearing here rather than incidental: it kills any single
          # test that runs past 45s. Without that, a mutant that makes a test
          # *hang* rather than fail wedges the whole run until cargo-mutants'
          # own timeout and is reported TIMEOUT, which this workflow's score
          # counts in neither the numerator nor the denominator. See that file
          # for the mutant that established it and the measurement behind the
          # numbers. Do not run this sweep with `--test-tool` unset.
          cargo mutants -p ${{ matrix.crate }} \
            --output . \
            --shard ${{ matrix.shard }} \
            --jobs 4 \
            --test-tool=nextest \
            --profile=mutants \
            -- --all-features --run-ignored all 2>&1 | tee /tmp/mutants-run.log
          MUTANTS_EXIT=$?
          set -e

          echo "::endgroup::"
          echo "exit_code=${MUTANTS_EXIT}" >> "$GITHUB_OUTPUT"

          # THE COMPLETION MARKER.
          #
          # Written inline, as the last thing this step does, so it exists if
          # and only if cargo-mutants actually returned. A shard killed at the
          # job timeout never reaches this line.
          #
          # This is the signal the summary job needs, and it is *not* the
          # shard's job conclusion. A shard that finds surviving mutants fails
          # by design, yet its report is complete and its numbers are exactly
          # what the sweep exists to produce. Keying completeness off the
          # matrix `result` conflated "did not finish" with "finished and did
          # its job", so the first sweep that worked end to end (run
          # 31193107921) refused to score itself.
          #
          # The marker cannot live in a separate `always()` step: those still
          # run on cancellation — proven by run 30236603180, where cancelled
          # shards uploaded artifacts.
          mkdir -p mutants.out
          echo "${MUTANTS_EXIT}" > mutants.out/COMPLETED

      # ── THE ZERO-DATA GUARD ──────────────────────────────────────────────
      #
      # Every gate in this workflow is a line count over the files below, and
      # a *missing* file counts as zero — which reads identically to "nothing
      # survived". That is not hypothetical: in run 30236603180 (2026-07-27)
      # all 11 sweep jobs reported "Score: 100%, Missed: 0" and concluded
      # success while their uploaded artifacts contained **200 surviving
      # mutants**, because the report was written to `mutants.out/mutants.out/`
      # and read from `mutants.out/`.
      #
      # So: a report that is absent, or that cargo-mutants never produced, is
      # now a hard error. This also fails within minutes if the `--output`
      # layout above ever changes again, instead of after a two-hour sweep
      # that silently measured nothing.
      - name: Require a readable mutation report
        if: always() && steps.check.outputs.skip == 'false'
        run: |
          missing=0
          for f in caught.txt missed.txt timeout.txt unviable.txt mutants.json; do
            if [ ! -f "mutants.out/$f" ]; then
              echo "::error::mutants.out/${f} is missing — cargo-mutants produced no usable report."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "cargo-mutants exit code was: ${{ steps.mutants.outputs.exit_code }}"
            echo "Report files actually found (if any):"
            find . -maxdepth 4 -name 'caught.txt' -printf '  %p\n' 2>/dev/null || true
            echo ""
            echo "A missing report is not 'zero surviving mutants' — it is no"
            echo "measurement at all. Failing rather than reporting a clean sweep."
            exit 1
          fi

          echo "Report present under mutants.out/."

      # ── Per-crate report ─────────────────────────────────────────────────
      - name: Generate per-crate report
        if: always() && steps.check.outputs.skip == 'false'
        run: |
          # Emits exactly one integer. The previous form
          #   grep -c . "$1" 2>/dev/null || echo 0
          # printed *two* lines for an empty-but-present file, because
          # `grep -c` prints "0" and still exits 1, so the `|| echo 0` fired
          # as well — and "0\n0" then breaks every `$(( ))` below. That was
          # latent only because the files were missing entirely rather than
          # empty; it would fire the moment the paths were corrected.
          count() {
            if [ ! -f "$1" ]; then echo 0; return; fi
            local n
            n=$(grep -c . "$1" 2>/dev/null || true)
            echo "${n:-0}"
          }

          CAUGHT=$(count mutants.out/caught.txt)
          MISSED=$(count mutants.out/missed.txt)
          UNVIABLE=$(count mutants.out/unviable.txt)
          TIMEOUT=$(count mutants.out/timeout.txt)
          TOTAL=$((CAUGHT + MISSED))

          if [ "$TOTAL" -gt 0 ]; then
            SCORE=$(( (CAUGHT * 100) / TOTAL ))
          else
            SCORE=100
          fi

          {
            echo "# Mutation Testing: \`${{ matrix.short }}\`"
            echo ""
            echo "## Score: ${SCORE}%"
            echo ""
            echo "| Outcome | Count |"
            echo "|---------|------:|"
            echo "| Caught | ${CAUGHT} |"
            echo "| Missed | ${MISSED} |"
            echo "| Timeout | ${TIMEOUT} |"
            echo "| Unviable | ${UNVIABLE} |"
            echo ""
            echo "Score is \`caught / (caught + missed)\`. **Timeouts are in"
            echo "neither term**, so each one is a mutant whose adequacy this"
            echo "score does not describe — read the count above, not past it."
            echo ""

            if [ "$MISSED" -gt 0 ]; then
              echo "## Surviving Mutants"
              echo ""
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
              echo ""
            fi

            if [ "$TIMEOUT" -gt 0 ]; then
              echo "## Timed-Out Mutants"
              echo ""
              echo '```'
              cat mutants.out/timeout.txt
              echo '```'
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Console summary
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " ${{ matrix.short }}: SCORE ${SCORE}%"
          echo " Caught: ${CAUGHT}  Missed: ${MISSED}  Timeout: ${TIMEOUT}  Unviable: ${UNVIABLE}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$MISSED" -gt 0 ]; then
            echo ""
            echo "::error::${MISSED} mutant(s) survived in ${{ matrix.short }}:"
            while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              LINE=$(echo "$line" | cut -d: -f2)
              MSG=$(echo "$line" | cut -d: -f3-)
              if [ -n "$FILE" ] && [ -n "$LINE" ]; then
                echo "::error file=${FILE},line=${LINE}::SURVIVED:${MSG}"
              else
                echo "  $line"
              fi
            done < mutants.out/missed.txt
            exit 1
          fi

      # Fold the run log into the report directory so the upload below has a
      # *single* path. With two paths — one relative, one under /tmp —
      # upload-artifact takes the least common ancestor of both, which is `/`,
      # and stores every entry under its absolute path
      # (`home/runner/work/a2a-rust/a2a-rust/mutants.out/...`). The summary job
      # then finds nothing where it looks and aggregates zeros. Verified in the
      # 2026-07-27 artifacts and in that run's own log:
      # "The least common ancestor is /. This will be the root directory of the artifact".
      - name: Fold the run log into the report
        if: always() && steps.check.outputs.skip == 'false'
        run: cp /tmp/mutants-run.log mutants.out/mutants-run.log || true

      - name: Upload per-crate report
        if: always() && steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Include the shard tag so sharded jobs (a2a-server) don't collide
          # on the same artifact name.
          name: mutation-report-${{ matrix.short }}-${{ steps.check.outputs.shard_tag }}
          # Single path ⇒ the artifact root is mutants.out/ itself, so entries
          # are `caught.txt`, `missed.txt`, … at the top level. The summary job
          # reads them at exactly that depth.
          path: mutants.out/
          # 90 is the GitHub Actions maximum. This is the weekly full-sweep
          # report — the only record of the actual surviving-mutant count —
          # so it should outlive as many weekly runs as possible rather than
          # rolling off after ~4 sweeps at the previous 30-day setting. This
          # is a partial fix for the missing persisted ledger (see
          # book/src/reference/mutation-history.md): it buys more time
          # before data is lost, it does not replace an actual durable
          # record.
          retention-days: 90

  # ── Aggregation job ──────────────────────────────────────────────────────────
  #
  # Merges all per-crate reports into a single combined summary.  Fails if any
  # crate had surviving mutants.
  mutants-summary:
    name: "Mutants Summary"
    needs: mutants-crate
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download all per-crate reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: mutation-report-*
          path: reports/

      # THE SHARD-COMPLETENESS GATE.
      #
      # This job aggregates whatever artifacts happen to be present and then
      # fails only on `TOTAL_MISSED > 0`. That is unsound on its own: a shard
      # that times out still runs its upload step, so it contributes an empty
      # or partial `mutants.out`, `count()` reads 0 missed from it, and the
      # aggregate reports a clean sweep over a shrunken denominator.
      #
      # This is not hypothetical. Run 30236603180 (2026-07-27, the first and
      # so far only scheduled full sweep) hit exactly this: `a2a-server`
      # shards 3/8 and 4/8 were cancelled at the 120-minute job timeout, and
      # "Mutants Summary" still concluded **success**. Two elevenths of the
      # workspace went unmutated and the gate said everything was caught.
      #
      # The incremental job below already documents this same hazard in its
      # own header — "it gets cancelled, so the gate silently stops
      # enforcing" — and was sharded to avoid it. The full sweep had the
      # identical hole and no equivalent guard. This is that guard.
      #
      # Two independent checks, because they fail differently: a shard can
      # end non-success (timeout/failure/cancel), or its artifact can go
      # missing while the job still reports success.
      - name: Require every shard to have completed
        env:
          # Matrix result. Reported for diagnostics only — it is deliberately
          # NOT the completeness signal. 'failure' here is the *expected*
          # outcome of a healthy sweep that found surviving mutants, so gating
          # on it blocks the aggregation of exactly the runs worth scoring.
          # Completeness is decided by the per-shard COMPLETED markers below.
          SHARD_RESULT: ${{ needs.mutants-crate.result }}
          # Must equal the number of `include:` entries in mutants-crate:
          # 12 a2a-server + 4 a2a-types + 4 a2a-client + 1 a2a-sdk. Deliberately
          # a literal: if the matrix grows and this does not, the sweep fails
          # loudly here rather than quietly measuring less. It went 15 -> 21 on
          # 2026-08-07 when a2a-types and a2a-client were sharded 4 ways.
          EXPECTED_SHARDS: 21
          # A workflow_dispatch scoped to one package skips the other matrix
          # entries by design, so they legitimately upload nothing. Only the
          # unscoped sweep — the one whose score means "the whole workspace" —
          # is held to the full count.
          PACKAGE_FILTER: ${{ inputs.package }}
        run: |
          fail=0
          echo "Matrix result (diagnostic only): ${SHARD_RESULT}"

          # Every shard must carry the COMPLETED marker its run step writes
          # inline once cargo-mutants returns. A shard cancelled at the job
          # timeout still runs its `always()` upload step and so still produces
          # a directory here — but it cannot have produced this file.
          incomplete=0
          for d in reports/mutation-report-*/; do
            [ -d "$d" ] || continue
            if [ ! -f "${d}COMPLETED" ]; then
              echo "::error::$(basename "$d") has no COMPLETED marker — its cargo-mutants run did not return."
              incomplete=$((incomplete + 1))
            fi
          done
          if [ "$incomplete" -ne 0 ]; then
            echo "${incomplete} shard(s) were killed mid-run. Their reports are partial, so"
            echo "aggregating them would understate the surviving-mutant count."
            fail=1
          fi

          found=$(find reports -maxdepth 1 -type d -name 'mutation-report-*' | wc -l)
          if [ -n "$PACKAGE_FILTER" ]; then
            echo "Scoped run (package='${PACKAGE_FILTER}'): ${found} report(s); count not enforced."
          elif [ "$found" -ne "$EXPECTED_SHARDS" ]; then
            echo "::error::expected ${EXPECTED_SHARDS} per-shard reports, found ${found}."
            echo "Reports present:"
            find reports -maxdepth 1 -type d -name 'mutation-report-*' -printf '  %f\n' | sort
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "The sweep is incomplete, so its score is not a measurement of the"
            echo "whole workspace. Re-run it, or raise the per-shard timeout /"
            echo "shard count, before trusting or recording any number from it."
            exit 1
          fi

          echo "All ${EXPECTED_SHARDS} shards completed and reported."

      - name: Aggregate results
        env:
          # Same exemption rule as the completeness gate above.
          PACKAGE_FILTER: ${{ inputs.package }}
        run: |
          # See the note on the identical helper in the per-crate job: the
          # previous form emitted "0\n0" for an empty-but-present file and
          # broke the arithmetic below.
          count() {
            if [ ! -f "$1" ]; then echo 0; return; fi
            local n
            n=$(grep -c . "$1" 2>/dev/null || true)
            echo "${n:-0}"
          }

          TOTAL_CAUGHT=0
          TOTAL_MISSED=0
          TOTAL_TIMEOUT=0
          TOTAL_UNVIABLE=0

          {
            echo "# Mutation Testing Report (combined)"
            echo ""
            echo "| Crate | Caught | Missed | Timeout | Score |"
            echo "|-------|-------:|-------:|--------:|------:|"
          } > /tmp/summary.md

          # Sum stats per base crate, merging shards (e.g. a2a-server-0-4
          # and a2a-server-1-4 both roll up into the `a2a-server` row).
          declare -A CRATE_CAUGHT
          declare -A CRATE_MISSED
          declare -A CRATE_TIMEOUT
          declare -A CRATE_UNVIABLE
          MALFORMED=0

          for CRATE_DIR in reports/mutation-report-*/; do
            if [ ! -d "$CRATE_DIR" ]; then continue; fi
            REPORT_NAME=$(basename "$CRATE_DIR" | sed 's/mutation-report-//')
            # Strip trailing shard suffix "-K-N" (e.g. "-0-4") to get the
            # base crate name.
            CRATE_NAME=$(echo "$REPORT_NAME" | sed -E 's/-[0-9]+-[0-9]+$//')

            # Flat, because each artifact's root *is* the shard's mutants.out
            # directory (single upload path — see the upload step). This read
            # previously went through an extra `mutants.out/` level that did
            # not exist in the artifact, so every count came back zero.
            if [ ! -f "${CRATE_DIR}caught.txt" ]; then
              echo "::error::${CRATE_DIR} contains no caught.txt — shard report is unusable."
              echo "Contents:"; find "$CRATE_DIR" -maxdepth 2 -printf '  %P\n' | head -20
              MALFORMED=$((MALFORMED + 1))
              continue
            fi

            C=$(count "${CRATE_DIR}caught.txt")
            M=$(count "${CRATE_DIR}missed.txt")
            T=$(count "${CRATE_DIR}timeout.txt")
            U=$(count "${CRATE_DIR}unviable.txt")

            CRATE_CAUGHT[$CRATE_NAME]=$((${CRATE_CAUGHT[$CRATE_NAME]:-0} + C))
            CRATE_MISSED[$CRATE_NAME]=$((${CRATE_MISSED[$CRATE_NAME]:-0} + M))
            CRATE_TIMEOUT[$CRATE_NAME]=$((${CRATE_TIMEOUT[$CRATE_NAME]:-0} + T))
            CRATE_UNVIABLE[$CRATE_NAME]=$((${CRATE_UNVIABLE[$CRATE_NAME]:-0} + U))
          done

          for CRATE_NAME in "${!CRATE_CAUGHT[@]}"; do
            C=${CRATE_CAUGHT[$CRATE_NAME]}
            M=${CRATE_MISSED[$CRATE_NAME]}
            T=${CRATE_TIMEOUT[$CRATE_NAME]}
            U=${CRATE_UNVIABLE[$CRATE_NAME]}
            CRATE_TOTAL=$((C + M))

            if [ "$CRATE_TOTAL" -gt 0 ]; then
              CS=$(( (C * 100) / CRATE_TOTAL ))
            else
              CS=100
            fi

            echo "| \`${CRATE_NAME}\` | ${C} | ${M} | ${T} | ${CS}% |" >> /tmp/summary.md

            TOTAL_CAUGHT=$((TOTAL_CAUGHT + C))
            TOTAL_MISSED=$((TOTAL_MISSED + M))
            TOTAL_TIMEOUT=$((TOTAL_TIMEOUT + T))
            TOTAL_UNVIABLE=$((TOTAL_UNVIABLE + U))
          done

          GRAND_TOTAL=$((TOTAL_CAUGHT + TOTAL_MISSED))

          # THE NO-DATA GATE.
          #
          # `SCORE=100` on an empty denominator is the single line that turned
          # every previous failure into a green check: zero mutants examined
          # became "100%, all mutants caught". A whole-workspace sweep that
          # examined no mutants has not passed — it has not run. Refuse to
          # publish a score rather than invent one.
          #
          # A `workflow_dispatch` scoped to one package is exempt only from the
          # *shard count*, not from this: even a single crate must yield some
          # mutants, except a2a-sdk, which is a pure re-export facade and
          # genuinely has none (mutants.json == []).
          if [ "$MALFORMED" -gt 0 ]; then
            echo "::error::${MALFORMED} shard report(s) were malformed; the aggregate would understate the true count."
            exit 1
          fi

          if [ "$GRAND_TOTAL" -eq 0 ]; then
            if [ -n "${PACKAGE_FILTER}" ]; then
              echo "::warning::Scoped run examined 0 mutants — expected only for a2a-sdk (pure re-exports)."
              SCORE=100
            else
              echo "::error::the full sweep examined 0 mutants across all shards."
              echo "That is not a 100% score; it means no mutation testing happened."
              echo "Check the per-shard 'Require a readable mutation report' steps."
              exit 1
            fi
          else
            SCORE=$(( (TOTAL_CAUGHT * 100) / GRAND_TOTAL ))
          fi

          # Prepend overall score
          {
            head -2 /tmp/summary.md
            echo "## Overall Score: ${SCORE}%"
            echo ""
            echo "| Outcome | Count |"
            echo "|---------|------:|"
            echo "| Caught | ${TOTAL_CAUGHT} |"
            echo "| Missed | ${TOTAL_MISSED} |"
            echo "| Timeout | ${TOTAL_TIMEOUT} |"
            echo "| Unviable | ${TOTAL_UNVIABLE} |"
            echo ""
            echo "Score is \`caught / (caught + missed)\`. **Timeouts are in"
            echo "neither term**, so each one is a mutant whose adequacy this"
            echo "score does not describe — read the count above, not past it."
            echo ""
            tail -n +3 /tmp/summary.md
          } > /tmp/final-summary.md

          # Append surviving mutants from all crates
          if [ "$TOTAL_MISSED" -gt 0 ]; then
            {
              echo ""
              echo "## Surviving Mutants (all crates)"
              echo ""
              echo '```'
              cat reports/mutation-report-*/missed.txt 2>/dev/null || true
              echo '```'
              echo ""
              echo "## How to Fix"
              echo ""
              echo '```bash'
              echo "cargo install cargo-mutants cargo-nextest --locked"
              echo "# a live database, or every Postgres mutant survives for want of one:"
              echo "export A2A_TEST_POSTGRES_URL=postgres://postgres:postgres@localhost:5432/postgres"
              echo "cargo mutants -p <crate-name> --test-tool=nextest -- --all-features --run-ignored all"
              echo '```'
            } >> /tmp/final-summary.md
          fi

          cat /tmp/final-summary.md >> "$GITHUB_STEP_SUMMARY"

          # Console output
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " COMBINED MUTATION SCORE: ${SCORE}%"
          echo " Caught: ${TOTAL_CAUGHT}  Missed: ${TOTAL_MISSED}  Timeout: ${TOTAL_TIMEOUT}  Unviable: ${TOTAL_UNVIABLE}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$TOTAL_MISSED" -gt 0 ]; then
            echo ""
            echo "::error::${TOTAL_MISSED} mutant(s) survived across all crates"
            exit 1
          fi

          echo ""
          echo "All mutants caught across all crates."

  # ── Incremental mutation testing (PR only) ────────────────────────────────
  #
  # A large PR can produce hundreds of in-diff mutants; a single job at 4-way
  # parallelism does not finish inside the 60-minute timeout (it gets cancelled,
  # so the gate silently stops enforcing). We shard the in-diff mutant set
  # across parallel runners with cargo-mutants' `--shard K/N` (which composes
  # with `--in-diff`, splitting the selected mutants deterministically and
  # evenly). Each shard fails on its own surviving mutants; the lightweight
  # `mutants-incremental` aggregator below keeps the stable required-check name
  # and fails if any shard failed.
  mutants-incremental-shard:
    name: "Mutants incremental (shard ${{ matrix.shard }})"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 75, raised from 45 on 2026-08-07. Unlike the full sweep's 240, this one
    # is **not** measured — no recent PR has produced enough in-diff mutants to
    # test the ceiling, so there is no worst case to size against.
    #
    # It is raised anyway because the work per mutant grew underneath it: this
    # job now runs the Postgres suite too (see the service block below), which
    # the 45 predates. Leaving a budget unchanged after adding work to it is
    # how the full sweep ended up with seven minutes of headroom.
    #
    # If a PR ever does overrun this, it now fails loudly at "Require a
    # readable mutation report" rather than silently reporting no survivors.
    timeout-minutes: 75
    # Same reasoning as the full sweep above: a PR touching Postgres code must
    # be judged against a real database, not against absent tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    strategy:
      fail-fast: false # a survivor in one shard must not cancel the others
      matrix:
        # 8-way (matching the full-sweep shard count for a2a-server): a large
        # PR diff generates enough in-diff mutants that a 4-way split pushed the
        # heaviest shards past the 45-minute timeout. Doubling the shard count
        # halves each runner's mutant load so every shard finishes in time.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      INCREMENTAL_SHARDS: 8
      A2A_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # full history for diff

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # protoc is bundled via the `protoc-bin-vendored` crate.

      - name: Install cargo-mutants and nextest
        run: cargo install cargo-mutants cargo-nextest --locked

      - name: Build PR source diff (rename-aware)
        id: diff
        run: |
          BASE="origin/${{ github.base_ref }}"
          # `-M` so a pure file/directory rename carries no content hunks.
          # Without it, a large rename (e.g. crates/a2a-* -> crates/a2a-protocol-*)
          # looks like thousands of brand-new lines and balloons the run to the
          # entire mutant set, blowing the timeout. We scope to library source.
          #
          # `:(glob)` is load-bearing, not decoration. Without it a pathspec is
          # matched by fnmatch WITHOUT FNM_PATHNAME, so `*` crosses `/` and the
          # `**/` in the middle degenerates into "one or more directories" — the
          # literal slash after it still has to match something. The effect was
          # that `crates/*/src/**/*.rs` saw only files in a SUBDIRECTORY of
          # `src/` and was blind to every file sitting directly in
          # `crates/<crate>/src/`: 41 of 141 tracked sources at 6ebf821,
          # including rate_limit.rs, serve.rs, builder.rs, method.rs, signing.rs
          # and all four lib.rs.
          #
          # That is not theoretical. Nine of the last 120 commits changed only
          # such files, so `ADDED` came out 0, `skip` came out true, this job's
          # mutation step was skipped by its own `if:`, and the summary below
          # announced "No Rust source files changed in crates/*/src/" — which
          # was false. Among them: two behavioural fixes to rate_limit.rs
          # (a9e1235, a116bc5) and e6aa9e1, a feature commit carrying 376 added
          # source lines that were never mutated. Measured, not deduced: those
          # three give ADDED = 0 / 0 / 0 under the old pathspec and 57 / 24 /
          # 376 under this one.
          #
          # With `:(glob)`, `**` means "zero or more directories" as readers
          # already assume, and the pattern matches all 141. Verified with
          # `git ls-files -- ':(glob)crates/*/src/**/*.rs' | wc -l` = 141,
          # against 100 for the unprefixed form, with nothing outside `src/`.
          git diff -M "${BASE}...HEAD" -- ':(glob)crates/*/src/**/*.rs' > pr-src.diff
          ADDED=$(grep -cE '^\+[^+]' pr-src.diff || true)

          if [ "${ADDED:-0}" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No added/changed lines in crates/*/src — nothing to mutate (renames carry no content)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changed source lines to mutate: ${ADDED}"
            echo "::group::PR source diff"
            cat pr-src.diff
            echo "::endgroup::"
          fi

      - name: Run incremental mutation testing
        id: mutants
        if: steps.diff.outputs.skip == 'false'
        run: |
          echo "::group::cargo-mutants execution log"

          set +e
          set -o pipefail
          # `--in-diff` restricts mutants to functions whose lines were added or
          # changed in this PR's diff, so renames contribute nothing and only
          # genuinely edited code is mutated. `--timeout 300` was written to
          # match `cap_timeout` in mutants.toml; since that file is never read
          # (measured 2026-08-14), this flag is the only per-mutant cap either
          # job has, and only this job has it. Keep it.
          # `--shard K/N` partitions the in-diff mutant set across the matrix
          # so each runner tests roughly 1/N of the mutants and fits the timeout.
          # `--output .` ⇒ report at ./mutants.out — see the full-sweep job for
          # why `--output mutants.out` silently disabled this gate.
          # No `--exclude-re` here either; the two invocations stay in step
          # because neither excludes anything. That symmetry is the point: an
          # exclusion applied to only one would make a PR pass a check the
          # weekly sweep then fails on, or the reverse.
          cargo mutants --in-diff pr-src.diff \
            --output . \
            --timeout 300 \
            --jobs 4 \
            --shard ${{ matrix.shard }}/${{ env.INCREMENTAL_SHARDS }} \
            --test-tool=nextest \
            --profile=mutants \
            -- --all-features --run-ignored all 2>&1 | tee /tmp/mutants-run.log
          MUTANTS_EXIT=$?
          set -e

          echo "::endgroup::"
          echo "exit_code=${MUTANTS_EXIT}" >> "$GITHUB_OUTPUT"

      - name: No source changes to mutate
        if: steps.diff.outputs.skip == 'true'
        run: |
          echo "# Mutation Testing — Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No Rust source files changed in \`crates/*/src/\` — nothing to mutate." >> "$GITHUB_STEP_SUMMARY"

      # Same guard as the full sweep, with one legitimate exception: when the
      # PR diff selects no mutable code, cargo-mutants logs "No mutants to
      # filter", exits 0 and writes no report at all. That is a real "nothing
      # to do", not a broken run — but it must be recognised explicitly rather
      # than inferred from files that happen to be absent.
      - name: Require a readable mutation report
        if: always() && steps.diff.outputs.skip == 'false'
        id: report_check
        run: |
          if [ -f mutants.out/caught.txt ] && [ -f mutants.out/missed.txt ]; then
            echo "empty_selection=false" >> "$GITHUB_OUTPUT"
            echo "Report present under mutants.out/."
            exit 0
          fi

          if grep -q "No mutants to filter" /tmp/mutants-run.log 2>/dev/null; then
            echo "empty_selection=true" >> "$GITHUB_OUTPUT"
            echo "cargo-mutants selected no mutants from this PR's diff — nothing to gate."
            exit 0
          fi

          echo "::error::no mutation report was produced, and cargo-mutants did not report an empty selection."
          echo "cargo-mutants exit code was: ${{ steps.mutants.outputs.exit_code }}"
          echo "Captured output:"; tail -30 /tmp/mutants-run.log 2>/dev/null || true
          echo ""
          echo "Treating this as 'zero surviving mutants' is what made this gate"
          echo "vacuous before; failing instead."
          exit 1

      - name: Generate mutation report
        if: always() && steps.diff.outputs.skip == 'false' && steps.report_check.outputs.empty_selection == 'false'
        run: |
          # See the full-sweep job: the previous helper emitted "0\n0" for an
          # empty-but-present file, which breaks the arithmetic below.
          count() {
            if [ ! -f "$1" ]; then echo 0; return; fi
            local n
            n=$(grep -c . "$1" 2>/dev/null || true)
            echo "${n:-0}"
          }

          CAUGHT=$(count mutants.out/caught.txt)
          MISSED=$(count mutants.out/missed.txt)
          UNVIABLE=$(count mutants.out/unviable.txt)
          TIMEOUT=$(count mutants.out/timeout.txt)
          TOTAL=$((CAUGHT + MISSED))

          if [ "$TOTAL" -gt 0 ]; then
            SCORE=$(( (CAUGHT * 100) / TOTAL ))
          else
            SCORE=100
          fi

          {
            echo "# Mutation Testing Report (incremental)"
            echo ""
            echo "Only files changed in this PR were mutated."
            echo ""
            echo "## Score: ${SCORE}%"
            echo ""
            echo "| Outcome | Count | Meaning |"
            echo "|---------|------:|---------|"
            echo "| Caught | ${CAUGHT} | Test suite detected the mutation |"
            echo "| Missed | ${MISSED} | **Test gap** — a real bug here would go undetected |"
            echo "| Timeout | ${TIMEOUT} | Mutant caused tests to hang (killed after limit) |"
            echo "| Unviable | ${UNVIABLE} | Mutation caused a compile error (not a test gap) |"
            echo ""

            if [ "$MISSED" -gt 0 ]; then
              echo "## Surviving Mutants"
              echo ""
              echo "These mutations were **not detected** by your tests."
              echo "Add or strengthen tests to cover these gaps before merging."
              echo ""
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
              echo ""
            fi

            if [ "$TIMEOUT" -gt 0 ]; then
              echo "## Timed-Out Mutants"
              echo ""
              echo "These mutations caused the test suite to **hang**."
              echo ""
              echo '```'
              cat mutants.out/timeout.txt
              echo '```'
              echo ""
            fi

            if [ "$MISSED" -gt 0 ] || [ "$TIMEOUT" -gt 0 ]; then
              echo "## How to Reproduce Locally"
              echo ""
              echo '```bash'
              echo "cargo install cargo-mutants cargo-nextest --locked"
              echo "# a live database, or every Postgres mutant survives for want of one:"
              echo "export A2A_TEST_POSTGRES_URL=postgres://postgres:postgres@localhost:5432/postgres"
              echo "cargo mutants --file <path-to-file> --test-tool=nextest -- --all-features --run-ignored all"
              echo '```'
              echo ""
            fi

            if [ "$MISSED" -eq 0 ] && [ "$TIMEOUT" -eq 0 ]; then
              echo "All mutants in changed files were caught. No test gaps found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " MUTATION SCORE: ${SCORE}%"
          echo " Caught: ${CAUGHT}  Missed: ${MISSED}  Timeout: ${TIMEOUT}  Unviable: ${UNVIABLE}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$MISSED" -gt 0 ]; then
            echo ""
            echo "::error::${MISSED} mutant(s) survived in changed files — add tests that detect these mutations:"
            while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              LINE=$(echo "$line" | cut -d: -f2)
              MSG=$(echo "$line" | cut -d: -f3-)
              if [ -n "$FILE" ] && [ -n "$LINE" ]; then
                echo "::error file=${FILE},line=${LINE}::SURVIVED:${MSG}"
              else
                echo "  $line"
              fi
            done < mutants.out/missed.txt
          fi

          if [ "$TIMEOUT" -gt 0 ]; then
            echo ""
            echo "::warning::${TIMEOUT} mutant(s) timed out:"
            while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              LINE=$(echo "$line" | cut -d: -f2)
              MSG=$(echo "$line" | cut -d: -f3-)
              if [ -n "$FILE" ] && [ -n "$LINE" ]; then
                echo "::warning file=${FILE},line=${LINE}::TIMEOUT:${MSG}"
              else
                echo "  $line"
              fi
            done < mutants.out/timeout.txt
          fi

          if [ "$MISSED" -gt 0 ]; then
            exit 1
          fi

      # Single upload path, so the artifact root is mutants.out/ itself and the
      # aggregator's `shards/*/missed.txt` glob resolves. Two paths (one of them
      # under /tmp) made the artifact root `/`, burying every file under
      # `home/runner/work/...` where nothing looked for it.
      - name: Fold the run log into the report
        if: always() && steps.diff.outputs.skip == 'false'
        run: |
          mkdir -p mutants.out
          cp /tmp/mutants-run.log mutants.out/mutants-run.log || true

      - name: Upload mutation report
        if: always() && steps.diff.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-incremental-shard-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 14

  # ── Incremental aggregator (stable required-check name) ───────────────────
  #
  # Keeps the branch-protection check name "Mutation Testing (incremental)"
  # stable while the heavy work runs in the sharded matrix above. Fails if any
  # shard failed (surviving mutants or an infrastructure error). `if: always()`
  # so it still runs — and can fail — when a shard reports survivors.
  mutants-incremental:
    name: "Mutation Testing (incremental)"
    needs: mutants-incremental-shard
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download shard reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: mutation-report-incremental-shard-*
          path: shards/

      - name: Aggregate shard results and gate
        run: |
          # See the full-sweep job for why the previous one-liner was unsafe.
          count() {
            if [ ! -f "$1" ]; then echo 0; return; fi
            local n
            n=$(grep -c . "$1" 2>/dev/null || true)
            echo "${n:-0}"
          }

          # Sum surviving mutants across every shard's report (if any ran).
          TOTAL_MISSED=0
          shopt -s nullglob
          MISSED_ANY=""
          for f in shards/*/missed.txt; do
            n=$(count "$f")
            TOTAL_MISSED=$((TOTAL_MISSED + n))
            if [ "$n" -gt 0 ]; then MISSED_ANY="${MISSED_ANY}${f}"$'\n'; fi
          done

          {
            echo "# Mutation Testing — incremental (aggregated)"
            echo ""
            echo "Sharded across parallel runners; only PR-diff changes were mutated."
            echo ""
            if [ "$TOTAL_MISSED" -gt 0 ]; then
              echo "## ${TOTAL_MISSED} surviving mutant(s)"
              echo ""
              echo '```'
              cat shards/*/missed.txt 2>/dev/null
              echo '```'
            else
              echo "No surviving mutants across all shards."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Gate 1: any shard that failed (survivors OR an error/timeout) makes
          # the matrix result non-success. This is the authoritative gate.
          SHARD_RESULT="${{ needs.mutants-incremental-shard.result }}"
          echo "Shard matrix result: ${SHARD_RESULT}"
          echo "Aggregated surviving mutants: ${TOTAL_MISSED}"

          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::Incremental mutation testing failed (a shard reported survivors or errored). See the per-shard jobs."
            exit 1
          fi

          # Gate 2: defence in depth — fail if any survivor slipped through even
          # though the shard job reported success.
          if [ "$TOTAL_MISSED" -gt 0 ]; then
            echo "::error::${TOTAL_MISSED} mutant(s) survived in changed files."
            exit 1
          fi

          echo "All incremental mutants caught across all shards."
