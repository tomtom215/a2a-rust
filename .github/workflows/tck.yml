# SPDX-License-Identifier: Apache-2.0
# Technology Compatibility Kit (TCK) — conformance testing
name: TCK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Conformance runs only read sources — never grant the default token more.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tck-self-test:
    name: TCK self-test (echo-agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Build both the echo agent and TCK
      - name: Build echo-agent and TCK
        run: cargo build --release -p echo-agent -p a2a-tck

      # Start the echo agent in the background and poll its discovery
      # endpoint until it answers (same readiness pattern as the
      # cross-language matrix below — a fixed sleep flakes under load).
      - name: Start echo-agent
        run: |
          ./target/release/echo-agent &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9090/.well-known/agent-card.json > /dev/null 2>&1; then
              echo "echo-agent ready"
              exit 0
            fi
            sleep 1
          done
          echo "echo-agent failed to start"
          exit 1
        env:
          A2A_BIND_ADDR: "127.0.0.1:9090"
          # Brings up the §12 WebSocket listener and adds its WEBSOCKET
          # interface to the served agent card, which is how the websocket
          # leg below finds it — the same path a real client takes.
          A2A_WS_BIND_ADDR: "127.0.0.1:9091"

      # Run TCK against JSON-RPC binding
      - name: TCK — JSON-RPC binding
        run: ./target/release/a2a-tck --url http://127.0.0.1:9090 --binding jsonrpc

      # Run TCK against REST binding
      - name: TCK — REST binding
        run: ./target/release/a2a-tck --url http://127.0.0.1:9090 --binding rest

      # Run TCK against the §12 WebSocket binding. `--url` stays the HTTP
      # origin for every binding: §5 discovery is served over HTTP whichever
      # transport carries the RPCs, and the socket endpoint is read from the
      # card. Shipping this transport without a conformance leg meant its only
      # coverage was the server crate's own unit tests — never an
      # outside-in run against the wire.
      - name: TCK — WebSocket binding
        run: ./target/release/a2a-tck --url http://127.0.0.1:9090 --binding websocket

      - name: Setup Python (a2a-inspector card check)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Reproduces the official a2a-inspector's agent-card validation
      # (vendored from its backend/validators.py) headlessly against our
      # card. The inspector ships web-UI-only, so this is the scriptable
      # equivalent of "open it in the inspector and check it's green".
      #
      # continue-on-error, deliberately and narrowly: confirmed 2026-07-29
      # that a2aproject/a2a-inspector's validate_agent_card (fetched
      # byte-for-byte from its upstream main, so our vendored copy is not
      # stale) still hard-requires a top-level `url` field. The v1.0
      # AgentCard proto has no such field — `supported_interfaces` replaced
      # it (see docs/official-tck-findings.md §13-14) — so a fully
      # v1.0-compliant card will always fail this specific check until the
      # inspector itself is updated upstream. This does not loosen the TCK
      # conformance steps above, which stay hard gates.
      - name: a2a-inspector card validation
        continue-on-error: true
        run: |
          pip install httpx
          python itk/interop/inspector_card_check.py http://127.0.0.1:9090

  tck-cross-language:
    name: TCK cross-language (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    # Run on both PRs and pushes to main to prevent merging broken cross-language agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: python
            setup: |
              pip install -r itk/agents/python/requirements.txt
              python itk/agents/python/agent.py &
              sleep 3
            port: 9100
          - sdk: javascript
            setup: |
              # Install deps in the FOREGROUND so a slow npm registry can't eat
              # the readiness-poll window; background only the server. A
              # backgrounded `npm install` that hasn't finished when the poll
              # starts leaves the agent unstarted → spurious "failed to start".
              # Matches the python-sdk / java-sdk legs.
              cd itk/agents/js-agent
              npm install
              node index.js &
              sleep 3
            port: 9101
          - sdk: go
            setup: |
              cd itk/agents/go-agent && go mod tidy && go run . &
              sleep 3
            port: 9102
          - sdk: java
            setup: |
              cd itk/agents/java-agent && mvn -q compile exec:java &
              sleep 5
            port: 9103
          # ── Agents built on the OFFICIAL SDKs — the runs that prove real
          # cross-SDK interop rather than agreement with our own stubs. ──
          - sdk: python-sdk
            setup: |
              pip install 'a2a-sdk[http-server]' uvicorn httpx
              PORT=9110 python itk/agents/python-sdk/agent.py &
              sleep 3
            port: 9110
          - sdk: js-sdk
            setup: |
              # Install deps in the FOREGROUND so a slow npm registry can't eat
              # the readiness-poll window; background only the server (see the
              # `javascript` leg above). Matches the python-sdk / java-sdk legs.
              cd itk/agents/js-sdk
              npm install
              PORT=9111 node index.js &
              sleep 3
            port: 9111
            # Documented @a2a-js/sdk 1.0.0 bugs (not our deviations):
            # - ListTasks: ListTasksRequest.fromJSON({}) materializes the
            #   proto3 default status=TASK_STATE_UNSPECIFIED and the store
            #   filters on it, so an unfiltered list always returns empty.
            # - application/a2a+json requests are rejected despite spec §6.1
            #   examples using that media type (Python/Go SDKs accept it).
            skip_jsonrpc: list_tasks_basic,a2a_media_type_accepted
            skip_rest: list_tasks_basic
          - sdk: go-sdk
            setup: |
              cd itk/agents/go-sdk && go mod tidy && PORT=9112 go run . &
              sleep 5
            port: 9112
          - sdk: java-sdk
            setup: |
              # Build in a subshell so the `java -jar` below runs from the
              # repo root with the repo-root-relative jar path (a plain `cd`
              # would double the prefix and fail with "Unable to access jarfile").
              ( cd itk/agents/java-sdk && mvn -q package -DskipTests )
              PORT=9113 java -jar itk/agents/java-sdk/target/quarkus-app/quarkus-run.jar &
              sleep 5
            port: 9113
            # Documented a2a-java 1.0.0.CR1 divergence: rejects
            # application/a2a+json (spec §6.1 examples use it; Python/Go
            # reference SDKs accept it).
            skip_jsonrpc: a2a_media_type_accepted
            skip_rest: a2a_media_type_accepted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup Python
        if: matrix.sdk == 'python' || matrix.sdk == 'python-sdk'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: matrix.sdk == 'javascript' || matrix.sdk == 'js-sdk'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup Go
        if: matrix.sdk == 'go' || matrix.sdk == 'go-sdk'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25'

      - name: Setup Java
        if: matrix.sdk == 'java' || matrix.sdk == 'java-sdk'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build TCK
        run: cargo build --release -p a2a-tck

      - name: Setup ${{ matrix.sdk }} agent
        run: ${{ matrix.setup }}

      - name: Wait for agent to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:${{ matrix.port }}/.well-known/agent-card.json > /dev/null 2>&1; then
              echo "Agent ready on port ${{ matrix.port }}"
              exit 0
            fi
            sleep 1
          done
          echo "Agent failed to start on port ${{ matrix.port }}"
          exit 1

      - name: TCK — ${{ matrix.sdk }} (JSON-RPC)
        run: >
          ./target/release/a2a-tck --url http://127.0.0.1:${{ matrix.port }}
          --binding jsonrpc
          ${{ matrix.skip_jsonrpc && format('--skip {0}', matrix.skip_jsonrpc) || '' }}

      - name: TCK — ${{ matrix.sdk }} (REST)
        run: >
          ./target/release/a2a-tck --url http://127.0.0.1:${{ matrix.port }}
          --binding rest
          ${{ matrix.skip_rest && format('--skip {0}', matrix.skip_rest) || '' }}

  official-client-vs-rust-server:
    name: Official Python SDK client vs our server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install official A2A Python SDK (client)
        run: pip install 'a2a-sdk[http-server]' httpx

      - name: Build and start our echo agent
        run: |
          cargo build --release -p echo-agent
          A2A_BIND_ADDR="127.0.0.1:9090" ./target/release/echo-agent &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9090/.well-known/agent-card.json > /dev/null 2>&1; then
              echo "echo-agent ready"; exit 0
            fi
            sleep 1
          done
          echo "echo-agent failed to start"; exit 1

      # The reverse direction of the matrix above: the reference client
      # driving a server built on a2a-protocol-server, over both bindings —
      # send (plain + streaming), get, list, cancel semantics, push-config
      # CRUD, and terminal-subscribe rejection.
      - name: Official Python client interop suite
        run: python itk/interop/python_client_vs_rust.py http://127.0.0.1:9090

  grpc-wire-compat:
    name: gRPC wire compatibility (official Python SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install official A2A Python SDK
        run: pip install a2a-sdk

      # Guard against drift between our vendored a2a.proto and the schema
      # revision shipped by the official SDK: re-parse the corpus with the
      # installed SDK and compare against the checked-in golden bytes.
      - name: Golden fixtures still match the official SDK
        run: python3 tck/scripts/grpc_wire_compat.py check-golden

      # Forward direction: prost decodes the official SDK's exact bytes and
      # converts them to the expected domain values. Also emits Rust-encoded
      # bytes for the reverse check below.
      - name: Rust decodes official-SDK bytes (and emits its own)
        run: cargo test -p a2a-protocol-types --features proto --test proto_golden_fixtures

      # Reverse direction: the official SDK parses what prost encoded and
      # must see exactly the corpus-expected messages.
      - name: Official SDK parses Rust-encoded bytes
        run: python3 tck/scripts/grpc_wire_compat.py verify-rust
