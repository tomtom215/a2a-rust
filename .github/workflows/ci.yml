#
# Continuous integration — enforces all quality gates.
#
# Jobs: format, clippy, test (default + signing + tls-rustls + tracing + all-features),
#       documentation, cargo-deny (license/advisory), package validation, nightly.
#
# Matrix: stable + MSRV (1.93), multi-platform.

name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same branch/PR — saves CI minutes when
# multiple commits are pushed in quick succession.  Main-branch pushes
# are NOT cancelled so merge builds always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# CI only reads sources — never grant the default token more than that.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # No debuginfo in CI test builds: the 9-combination test matrix shares one
  # target dir per runner, and full debuginfo pushed linker memory/disk far
  # enough that `ld` died with SIGBUS on the 1.93 leg after rig-core joined
  # the workspace. Tests don't need debuginfo to pass or to report failures.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ── Format check ─────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Four crates plus the repo root each vendor the canonical a2a.proto,
      # because build.rs can only reach inside its own crate. Nothing checked
      # they still agreed, and drift between them yields a client and a server
      # that both build, both pass their tests, and disagree on the wire.
      - name: Vendored protos agree
        run: ./scripts/check_proto_copies.sh

      # CONTRIBUTING's 500-line rule was a PR-checklist item with nothing
      # enforcing it, and the count printed beside it had drifted from 46/139
      # to 77/310 unnoticed. This is a ratchet: existing long files stay
      # legal, the list may only shrink.
      - name: File lengths (500-line ratchet)
        run: ./scripts/check_file_lengths.sh

      # `scripts/prove_gates_fail.sh` proves the gates in *this* file can fail,
      # but it is a 20-minute source-injection sweep and cannot run on a PR.
      # This is its fast sibling: it proves the verdict-bearing steps in the
      # other ten workflows can fail, by running each step's real body against
      # synthetic healthy and defective inputs. ~7s, no cargo, no network.
      #
      # It earns its place on every PR because it already found a live one: the
      # official-TCK conformance gate ended `| tee`, and GitHub's default shell
      # is `bash -e` without pipefail, so the step's exit status was tee's. The
      # gate printed "REGRESSION" and went green.
      #
      # setup-python above it rather than relying on the runner's system
      # interpreter: PyYAML must be present, and a harness that skips the
      # workflows it cannot parse is the failure mode it exists to prevent.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Workflow verdict gates can fail
        run: python3 -m pip install --quiet pyyaml && ./scripts/prove_workflow_gates_fail.py

  # ── Clippy ───────────────────────────────────────────────────────────────
  clippy:
    name: Clippy (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust: [stable, "1.93"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # protoc is bundled via the `protoc-bin-vendored` crate (see the
      # `grpc` build scripts in crates/a2a-protocol-client and crates/a2a-protocol-server),
      # so no system protoc install is needed. Contributors building
      # `--features grpc` on a clean machine get the same behaviour.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (signing)
        run: cargo clippy --workspace --all-targets --features signing -- -D warnings
      - name: Clippy (tracing)
        run: cargo clippy --workspace --all-targets --features tracing -- -D warnings
      - name: Clippy (tls-rustls)
        run: cargo clippy -p a2a-protocol-client --all-targets --features tls-rustls -- -D warnings
      - name: Clippy (sqlite)
        run: cargo clippy -p a2a-protocol-server --all-targets --features sqlite -- -D warnings
      - name: Clippy (postgres)
        run: cargo clippy -p a2a-protocol-server --all-targets --features postgres -- -D warnings
      - name: Clippy (axum)
        run: cargo clippy -p a2a-protocol-server --all-targets --features axum -- -D warnings
      - name: Clippy (websocket)
        run: cargo clippy --workspace --all-targets --features websocket -- -D warnings
      - name: Clippy (grpc)
        run: cargo clippy --workspace --all-targets --features grpc -- -D warnings
      # Lint auth-jwt in isolation (no TLS): exercises the plaintext JWKS
      # client path that --all-features (TLS on) never compiles.
      - name: Clippy (auth-jwt feature, no default features)
        run: cargo clippy -p a2a-protocol-server --all-targets --no-default-features --features auth-jwt -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Tests ────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust: [stable, "1.93"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # protoc is bundled via the `protoc-bin-vendored` crate (see above).
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (signing feature)
        run: cargo test --workspace --features signing
      - name: Test (tracing feature)
        run: cargo test --workspace --features tracing
      - name: Test (tls-rustls feature)
        run: cargo test -p a2a-protocol-client --features tls-rustls
      - name: Test (tls-rustls feature, server — live-TLS push E2E)
        run: cargo test -p a2a-protocol-server --features tls-rustls
      - name: Test (sqlite feature)
        run: cargo test -p a2a-protocol-server --features sqlite
      - name: Test (postgres feature)
        run: cargo test -p a2a-protocol-server --features postgres
      - name: Test (axum feature)
        run: cargo test -p a2a-protocol-server --features axum
      # Dedicated websocket/grpc legs: --all-features also compiles these,
      # but a feature-specific regression (missing gate, dep drift) only
      # surfaces when the feature is built in isolation.
      - name: Test (websocket feature)
        run: cargo test --workspace --features websocket
      - name: Test (grpc feature)
        run: cargo test --workspace --features grpc
      - name: Test (auth-jwt feature)
        run: cargo test -p a2a-protocol-server --features auth-jwt
      - name: Test (auth-jwt + tls-rustls — live-TLS JWKS E2E)
        run: cargo test -p a2a-protocol-server --features auth-jwt,tls-rustls
      - name: Test (all features)
        run: cargo test --workspace --all-features
      - name: Test (no default features)
        run: cargo test --workspace --no-default-features

  # ── PostgreSQL-backed store integration tests ───────────────────────────
  #
  # The postgres store implementations only execute against a live server,
  # so the matrix above (which runs `cargo test --features postgres` without
  # a database) never exercises them. This job provides a real PostgreSQL 16
  # service and runs the #[ignore]-gated integration suite in
  # crates/a2a-protocol-server/tests/postgres_store_tests.rs.
  test-postgres:
    name: Test (postgres integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      A2A_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test (postgres integration, live database)
        run: cargo test -p a2a-protocol-server --features postgres --test postgres_store_tests -- --ignored

  # ── Nightly CI ──────────────────────────────────────────────────────────
  nightly:
    name: Nightly (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Deliberately un-pinned: this informational canary exists to surface
      # upcoming toolchain breakage early, so it must float with nightly.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # protoc is bundled via the `protoc-bin-vendored` crate (see above).
      - name: Test (all features, nightly)
        run: cargo test --workspace --all-features

  # ── Documentation ────────────────────────────────────────────────────────
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build docs (zero warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ── cargo-deny (license/advisory compliance) ─────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          command: check

  # ── Semver compatibility ─────────────────────────────────────────────────
  #
  # From 0.7.0 onward, catch accidental breaking changes to the public API of
  # the three published crates against the last release on crates.io. On a
  # 0.x baseline a MINOR bump is allowed to break, so this reports rather than
  # hard-fails until the first 1.0 — but it makes every break visible in review.
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check semver (types, client, server)
        uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae # v2.8
        with:
          package: a2a-protocol-types, a2a-protocol-client, a2a-protocol-server
          # 0.x: report breaks in the PR without blocking merge until 1.0.
          feature-group: default-features

  # ── Package validation ──────────────────────────────────────────────────
  #
  # Uses `cargo package --workspace` so that inter-workspace path+version
  # dependencies resolve against sibling crates rather than crates.io.
  # Individual `cargo package -p <crate>` (and `cargo publish --dry-run`)
  # resolve deps from the registry, failing when versions aren't published yet.
  # Excludes examples since they are `publish = false` and omit dep versions.
  package:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Package all publishable crates
        run: cargo package --workspace --exclude echo-agent --exclude agent-team --exclude multi-lang-team --exclude rig-a2a-agent --exclude genai-a2a-agent --exclude incident-response --exclude a2a-tck --exclude a2a-tck-sut --exclude a2a-benchmarks
