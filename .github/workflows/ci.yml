# Copyright 2026 Tom F.
#
# Continuous integration — enforces all quality gates.
#
# Jobs: format, clippy, test (default + signing + tls-rustls + tracing + all-features),
#       documentation, cargo-deny (license/advisory), package validation, nightly.
#
# Matrix: stable + MSRV (1.93), multi-platform.

name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same branch/PR — saves CI minutes when
# multiple commits are pushed in quick succession.  Main-branch pushes
# are NOT cancelled so merge builds always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# CI only reads sources — never grant the default token more than that.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # No debuginfo in CI test builds: the 9-combination test matrix shares one
  # target dir per runner, and full debuginfo pushed linker memory/disk far
  # enough that `ld` died with SIGBUS on the 1.93 leg after rig-core joined
  # the workspace. Tests don't need debuginfo to pass or to report failures.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ── Format check ─────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Four crates plus the repo root each vendor the canonical a2a.proto,
      # because build.rs can only reach inside its own crate. Nothing checked
      # they still agreed, and drift between them yields a client and a server
      # that both build, both pass their tests, and disagree on the wire.
      - name: Vendored protos agree
        run: ./scripts/check_proto_copies.sh

      # CONTRIBUTING's 500-line rule was a PR-checklist item with nothing
      # enforcing it, and the count printed beside it had drifted from 46/139
      # to 77/310 unnoticed. This is a ratchet: existing long files stay
      # legal, the list may only shrink.
      - name: File lengths (500-line ratchet)
        run: ./scripts/check_file_lengths.sh

      # The per-PR mutation gate scopes its diff with a git pathspec, and on
      # 2026-08-12 that pathspec was reaching 100 of 141 library sources. A git
      # pathspec without `:(glob)` is matched by fnmatch without FNM_PATHNAME,
      # so `crates/*/src/**/*.rs` saw only files in a *subdirectory* of `src/`
      # and was blind to rate_limit.rs, serve.rs, method.rs, signing.rs and 37
      # others. Nine of the preceding 120 commits touched only invisible files;
      # each would have gone green reporting "nothing to mutate".
      #
      # Deliberately not a probe in prove_workflow_gates_fail.py. That harness
      # proves a step can fail on bad *input*, and this step's input was fine —
      # it asked for the wrong files and said so cheerfully. "Can it fail?" and
      # "is it pointed at everything it claims?" are different questions, and
      # only the second catches a pathspec. Fast: two `git ls-files` calls.
      - name: Mutation gate scope (PR diff pathspec reaches every source)
        run: ./scripts/check_mutation_scope.sh

      # book/src/reference/benchmarks.md is generated: its tables come from
      # criterion's estimates.json, but its prose was typed into a quoted
      # heredoc. So the tables regenerated on every bench run and the prose did
      # not. The page shipped "the ~1.4ms HTTP round-trip dominates" beside a
      # table reading 189.9 µs, and "reuse saves ~140µs (9%)" where the tables
      # give 123.5 µs and 39.5% — understating connection reuse by over 4x in
      # the one document meant to be quoted.
      #
      # The generator now interpolates both paragraphs from those same
      # estimates. This is the ratchet for what that cannot cover: the page is
      # committed, hand-editable, and regenerated only when someone runs the
      # benchmarks. It re-derives the quoted values from the committed tables.
      # Same rule the file-length ratchet opens with — a number nothing
      # recomputes is a number that decays.
      - name: Benchmark prose agrees with benchmark tables
        run: ./scripts/check_benchmark_prose.sh

      # Same rule, the other decaying number: the release-prep commit bumps
      # version numbers but not the sentences quoting them. At v0.10.0 all four
      # such sentences were updated by hand; at v0.11.0 none were, leaving the
      # binding's manifest saying "a tight `0.10`" beside a pin of `0.11`, and
      # RELEASING.md describing `0.2.0` against an SDK that had reached 0.11.0.
      #
      # The binding's comment is the costly one. `cargo package` writes the
      # original manifest into the `.crate` as `Cargo.toml.orig` with comments
      # intact, so a stale sentence there reaches crates.io permanently — a
      # published version cannot be amended, only yanked and superseded.
      #
      # `package_binding.py` already checks the pins against the tree. This
      # checks the prose against the same manifests, and treats an anchor that
      # matches nothing as a failure, so rewording cannot silently disarm it.
      - name: Version prose agrees with the manifests
        run: ./scripts/check_release_version_prose.py

      # The book carried 158 Rust blocks and nothing compiled any of them.
      # That is how the README Quick Start came to be broken for three minor
      # versions: `agent_executor!` was missing from the prelude and the macro
      # named a crate the snippet's own dependency list did not include, so a
      # reader copying it got two errors and CI got none.
      #
      # `a2a-book-tests` now compiles every non-ignored block as a doctest via
      # `cargo test --workspace`. This step is the ratchet that stops that
      # being defeated by marking new blocks `ignore`, and also catches
      # untagged fences — rustdoc compiles a bare ``` as Rust, which is how 24
      # ASCII diagrams were being fed to the compiler.
      - name: Book code blocks (ignore ratchet)
        run: ./scripts/check_book_code.sh

      # The documentation sitemap is generated from book/src/SUMMARY.md by
      # scripts/gen_sitemap.py. It used to be hand-maintained and drifted —
      # 16 pages missing, one dead URL. This step fails if it no longer
      # matches the table of contents, so adding a page without regenerating
      # the sitemap is caught here rather than as a silent SEO loss.
      - name: Sitemap matches the book table of contents
        run: python3 scripts/gen_sitemap.py --check

      # The API Quick Reference is 299 hand-written lines listing every public
      # type, trait and function — and nothing generated or checked it, so it
      # could only get less true with every rename. Same decay class as the
      # benchmark prose, in the page a reader consults precisely when they do
      # not know the API well enough to spot a stale name.
      #
      # Generated rustdoc now ships at /api/ and answers "what exists"
      # exhaustively; this keeps the curated overview honest alongside it.
      - name: API Quick Reference names still exist
        run: python3 scripts/check_api_reference.py

      # `Metrics` callbacks default to no-ops, so one the bundled OTLP exporter
      # forgets is discarded with no compile error and no failing test — the
      # exporter's own tests run against a noop meter, which a no-op override
      # satisfies perfectly. That is exactly how `on_persistence_error` and
      # `on_push_delivery` shipped wired to every call site and exported by
      # nothing.
      - name: OTel exporter covers every Metrics callback
        run: python3 scripts/check_otel_metrics_coverage.py

      # The packaging `--exclude` list is duplicated across this file,
      # release.yml and RELEASING.md, with nothing tying it to the workspace.
      # A new `publish = false` example therefore breaks `cargo package
      # --workspace` — which runs in the *release* workflow, so the failure
      # lands at the point where it costs the most. `hello-agent`,
      # `deploy-agent` and `a2a-book-tests` all joined the workspace without
      # joining the list.
      - name: Packaging excludes every unpublishable member
        run: python3 scripts/check_package_excludes.py

      # `scripts/prove_gates_fail.sh` proves the gates in *this* file can fail,
      # but it is a 20-minute source-injection sweep and cannot run on a PR.
      # This is its fast sibling: it proves the verdict-bearing steps in the
      # other ten workflows can fail, by running each step's real body against
      # synthetic healthy and defective inputs. ~7s, no cargo, no network.
      #
      # It earns its place on every PR because it already found a live one: the
      # official-TCK conformance gate ended `| tee`, and GitHub's default shell
      # is `bash -e` without pipefail, so the step's exit status was tee's. The
      # gate printed "REGRESSION" and went green.
      #
      # setup-python above it rather than relying on the runner's system
      # interpreter: PyYAML must be present, and a harness that skips the
      # workflows it cannot parse is the failure mode it exists to prevent.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Workflow verdict gates can fail
        run: python3 -m pip install --quiet pyyaml && ./scripts/prove_workflow_gates_fail.py

      # `scripts/lib/ci_gates.sh` parses this file into the gate list that
      # preflight.sh and prove_gates_fail.sh run, using its own block-scalar
      # reader written in awk — because both scripts must work with nothing
      # installed but coreutils. That is a second implementation of a fiddly
      # corner of YAML, and it drifted twice while being written: first
      # treating `>` exactly like `|` (so a folded block became one command per
      # line instead of one command), then getting folding right everywhere
      # except beside a more-indented line. Neither was visible by reading it.
      #
      # This compares it against PyYAML on the shapes that tell them apart. A
      # block those two read differently is a local gate running a different
      # command than CI runs, which is the one thing those scripts exist to
      # rule out.
      - name: Block scalars parse as YAML says
        run: python3 scripts/check_block_scalars.py

      # A guard flag claimed with `compare_exchange(false, true, ..)` and
      # released by a `store(false, ..)` at the end of the function is released
      # on exactly the paths somebody thought of. Dropping the future — a
      # `select!`, a client hanging up, a `JoinHandle::abort` — runs none of
      # them, and the flag stays claimed for the life of the process.
      #
      # That is not hypothetical here. `InMemoryTaskStore::maybe_evict` had
      # exactly this shape, and because both of that store's memory bounds ran
      # through the flag, one cancelled sweep left the default store with no
      # memory ceiling at all. Measured 2026-08-19; see Addendum 8 of
      # docs/v0.9.0-post-release-review.md.
      - name: Guard flags are released by Drop
        run: python3 scripts/check_cancellation_release.py

      # A doc comment assembled by a script that wrote `\\n` where it meant a
      # newline renders as one run-on paragraph with the escape printed in it.
      # Five of these shipped in `tenant_config.rs` on 2026-08-20 and no gate
      # noticed: `cargo fmt` does not reformat inside comments, clippy does not
      # read prose, and `cargo doc -D warnings` is satisfied because the text is
      # valid — it is just not the text anyone wrote.
      - name: Doc comments contain no literal escapes
        run: python3 scripts/check_doc_escapes.py

      # The question an adopter of a protocol library actually has is whether a
      # malformed peer can take their process down. Until this gate existed the
      # answer was unquotable — a grep for `.unwrap()` counts matches in doc
      # comments, string literals and `#[cfg(test)]` modules, and here the test
      # hits outnumber the real ones more than thirty to one. It is a ratchet,
      # not a ban: several surviving sites are correct, and freezing the exact
      # set makes adding one a reviewed act rather than an accident.
      - name: Panic surface of the published crates is unchanged
        run: python3 scripts/check_panic_paths.py

  # ── Clippy ───────────────────────────────────────────────────────────────
  clippy:
    name: Clippy (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # One platform's failure must not cancel the other five. A macOS-only flake
    # cancelled every other leg of this matrix once, and the cancelled logs —
    # each cut off mid-run — read exactly like a hang somewhere else entirely.
    # A red matrix should say which cells are red, not hide five to save a
    # runner-minute. Same reason fuzz, mutants and tck already set it.
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.93"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # protoc is bundled via the `protoc-bin-vendored` crate (see the
      # `grpc` build scripts in crates/a2a-protocol-client and crates/a2a-protocol-server),
      # so no system protoc install is needed. Contributors building
      # `--features grpc` on a clean machine get the same behaviour.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (signing)
        run: cargo clippy --workspace --all-targets --features signing -- -D warnings
      - name: Clippy (tracing)
        run: cargo clippy --workspace --all-targets --features tracing -- -D warnings
      - name: Clippy (tls-rustls)
        run: cargo clippy -p a2a-protocol-client --all-targets --features tls-rustls -- -D warnings
      - name: Clippy (sqlite)
        run: cargo clippy -p a2a-protocol-server --all-targets --features sqlite -- -D warnings
      - name: Clippy (postgres)
        run: cargo clippy -p a2a-protocol-server --all-targets --features postgres -- -D warnings
      - name: Clippy (axum)
        run: cargo clippy -p a2a-protocol-server --all-targets --features axum -- -D warnings
      - name: Clippy (websocket)
        run: cargo clippy --workspace --all-targets --features websocket -- -D warnings
      - name: Clippy (grpc)
        run: cargo clippy --workspace --all-targets --features grpc -- -D warnings
      # Lint auth-jwt in isolation (no TLS): exercises the plaintext JWKS
      # client path that --all-features (TLS on) never compiles.
      - name: Clippy (auth-jwt feature, no default features)
        run: cargo clippy -p a2a-protocol-server --all-targets --no-default-features --features auth-jwt -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Tests ────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # One platform's failure must not cancel the other five. A macOS-only flake
    # cancelled every other leg of this matrix once, and the cancelled logs —
    # each cut off mid-run — read exactly like a hang somewhere else entirely.
    # A red matrix should say which cells are red, not hide five to save a
    # runner-minute. Same reason fuzz, mutants and tck already set it.
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.93"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # protoc is bundled via the `protoc-bin-vendored` crate (see above).
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (signing feature)
        run: cargo test --workspace --features signing
      - name: Test (tracing feature)
        run: cargo test --workspace --features tracing
      - name: Test (tls-rustls feature)
        run: cargo test -p a2a-protocol-client --features tls-rustls
      - name: Test (tls-rustls feature, server — live-TLS push E2E)
        run: cargo test -p a2a-protocol-server --features tls-rustls
      - name: Test (sqlite feature)
        run: cargo test -p a2a-protocol-server --features sqlite
      - name: Test (postgres feature)
        run: cargo test -p a2a-protocol-server --features postgres
      - name: Test (axum feature)
        run: cargo test -p a2a-protocol-server --features axum
      # Dedicated websocket/grpc legs: --all-features also compiles these,
      # but a feature-specific regression (missing gate, dep drift) only
      # surfaces when the feature is built in isolation.
      - name: Test (websocket feature)
        run: cargo test --workspace --features websocket
      - name: Test (grpc feature)
        run: cargo test --workspace --features grpc
      - name: Test (auth-jwt feature)
        run: cargo test -p a2a-protocol-server --features auth-jwt
      - name: Test (auth-jwt + tls-rustls — live-TLS JWKS E2E)
        run: cargo test -p a2a-protocol-server --features auth-jwt,tls-rustls
      - name: Test (all features)
        run: cargo test --workspace --all-features
      - name: Test (no default features)
        run: cargo test --workspace --no-default-features

  # ── PostgreSQL-backed store integration tests ───────────────────────────
  #
  # The postgres store implementations only execute against a live server,
  # so the matrix above (which runs `cargo test --features postgres` without
  # a database) never exercises them. This job provides a real PostgreSQL 16
  # service and runs the #[ignore]-gated integration suite in
  # crates/a2a-protocol-server/tests/postgres_store_tests.rs.
  test-postgres:
    name: Test (postgres integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      A2A_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test (postgres integration, live database)
        run: cargo test -p a2a-protocol-server --features postgres --test postgres_store_tests -- --ignored

      # Two handlers over one database: which A2A operations cross replicas and
      # which do not. It runs here because it needs the same live PostgreSQL,
      # and it matters because "two replicas behind a load balancer" is the
      # first architecture anyone deploying this reaches for — and the answers
      # were previously inference from reading the code rather than a run.
      #
      # `--test-threads=1` because each test creates and drops a scratch
      # database, and the rate-limit tests count admissions against a shared
      # counter — sharing a database between two of them at once would make
      # each test's counts depend on the other's.
      - name: Test (multi-replica behaviour, live database)
        run: |
          cargo test -p a2a-protocol-server --features postgres \
            --test multi_replica -- --ignored --test-threads=1

  # ── Nightly CI ──────────────────────────────────────────────────────────
  nightly:
    name: Nightly (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Deliberately un-pinned: this informational canary exists to surface
      # upcoming toolchain breakage early, so it must float with nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # protoc is bundled via the `protoc-bin-vendored` crate (see above).
      - name: Test (all features, nightly)
        run: cargo test --workspace --all-features

      # The canary tested but never linted, and the breakage it exists to give
      # notice of was a lint breakage: Rust 1.98.0 turned three clippy lints red
      # on code identical to main (07e053d), and two of them —
      # `map_or_identity` and `unused_async_trait_impl` — are not lints that
      # 1.94.1 had ever heard of. Clippy lints reach nightly before they reach
      # stable, so linting here is what gives notice; testing here never could.
      #
      # Run even when the tests above fail: a nightly lint and a nightly test
      # regression are independent signals, and a step that is skipped reports
      # nothing rather than reporting green.
      - name: Clippy (all features, nightly)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Documentation ────────────────────────────────────────────────────────
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build docs (zero warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ── cargo-deny (license/advisory compliance) ─────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          command: check

  # ── Semver compatibility ─────────────────────────────────────────────────
  #
  # From 0.7.0 onward, catch accidental breaking changes to the public API of
  # the three published crates against the last release on crates.io.
  #
  # This job BLOCKS. Until 2026-08-18 the comment here said the opposite — that
  # it "reports rather than hard-fails until the first 1.0" — and a second note
  # repeated it beside `feature-group`, a key that selects features and has
  # nothing to do with blocking. Nothing implemented the claim: there is no
  # `continue-on-error` in this job, so every break has been a hard failure for
  # as long as the comment has denied it.
  #
  # The comment was corrected rather than made true, because its premise does
  # not survive being run. cargo-semver-checks already applies Cargo's 0.x rule
  # itself. Measured with cargo-semver-checks 0.50.0 against a2a-protocol-types
  # on 2026-08-18, `utc_now_iso8601` renamed as the injected break:
  #
  #   version unchanged, no break     exit 0    no semver update required
  #   version unchanged, break        exit 100  semver requires new major version
  #   0.9.0 -> 0.10.0, same break     exit 0    "(major change)", 254 checks skipped
  #
  # A 0.x release that breaks on purpose therefore passes the moment its minor
  # component is bumped — what the old comment wanted `continue-on-error` to buy
  # is already there, and buying it again would cost the rest. What remains is
  # the case where the API breaks and the version does not cover it, which is
  # the one worth blocking and the likely one here: crates/*/Cargo.toml reads
  # 0.9.0 and crates.io has 0.9.0, so between releases the baseline is the
  # version being developed against.
  #
  # Scope worth knowing rather than assuming: `feature-group: default-features`
  # checks the default surface only, so a break behind `signing`, `grpc`,
  # `postgres` or any other optional feature is outside what this can see.
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check semver (types, client, server)
        uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae # v2.8
        with:
          package: a2a-protocol-types, a2a-protocol-client, a2a-protocol-server
          feature-group: default-features

  # ── Package validation ──────────────────────────────────────────────────
  #
  # Uses `cargo package --workspace` so that inter-workspace path+version
  # dependencies resolve against sibling crates rather than crates.io.
  # Individual `cargo package -p <crate>` (and `cargo publish --dry-run`)
  # resolve deps from the registry, failing when versions aren't published yet.
  # Excludes examples since they are `publish = false` and omit dep versions.
  package:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Package all publishable crates
        run: cargo package --workspace --exclude a2a-example-harness --exclude hello-agent --exclude deploy-agent --exclude a2a-book-tests --exclude echo-agent --exclude agent-team --exclude multi-lang-team --exclude rig-a2a-agent --exclude genai-a2a-agent --exclude incident-response --exclude a2a-tck --exclude a2a-tck-sut --exclude a2a-benchmarks

  # ── SDK dogfood (examples/agent-team) ────────────────────────────────────
  #
  # Runs the 100-test end-to-end dogfood suite. It is a `main()`, not
  # `#[test]`s, so `cargo test --workspace` compiles it and executes none of
  # it — which is exactly how it went unrun.
  #
  # Added 2026-08-11 after measuring that no workflow had ever executed this
  # binary. Three things were true at once when that was found:
  #
  #   * 15 of its 86 tests were failing, and had been for long enough that the
  #     causes were ordinary rot (a raw-HTTP helper that never sent
  #     `A2A-Version`, three tests assuming the first stream event is a status
  #     update rather than a Task snapshot) plus one test — Test 68,
  #     `GetExtendedAgentCard` — whose agent had never been configured to
  #     support the operation, so it could not have passed on any commit;
  #   * the suite printed a hardcoded `[x] <feature>` checklist unconnected to
  #     the results, so a run with six failing batch tests still reported
  #     `[x] Batch JSON-RPC (...)`; and
  #   * the crate declared no `default` features, so the `cargo run -p
  #     agent-team` the README prescribes silently compiled out WebSocket,
  #     gRPC, Axum, SQLite, signing and OTel, then printed
  #     "SDK dogfood complete".
  #
  # `--all-features` is load-bearing, not thoroughness for its own sake: the
  # WebSocket leg is `#[cfg(feature = "websocket")]` and had never been
  # compiled by any automated run. When it was finally enabled it failed
  # immediately — its handshake omitted the `A2A-Version` header — and it
  # `.expect()`ed on connect, aborting the whole process rather than failing
  # one test. Both are fixed; this job is what stops them recurring.
  #
  # The binary's exit codes are the gate and are distinct on purpose:
  #   0 — every test passed AND every claimed feature area was exercised
  #   1 — a test failed, or the claim table drifted from the suite
  #   2 — all tests passed but a claimed feature area was not compiled in
  # A bare `run:` fails the step on any non-zero, so 2 is a hard failure here.
  # That is deliberate: "all green, but six feature areas were never built" is
  # the precise shape of false assurance this job exists to prevent.
  #
  # Proven able to fail before being trusted, per CONTRIBUTING's gate rule.
  # Measured 2026-08-11 by injection:
  #   * claim naming a nonexistent test        -> exit 1, names the claim
  #   * test present but claimed by nothing    -> exit 1, names the test
  #   * `A2A-Version` header removed           -> exit 1, 12 tests fail with a
  #     self-describing cause, 5 claim rows render [FAIL]
  #   * `--no-default-features`                -> exit 2, lists all 8 areas
  dogfood:
    name: SDK dogfood (agent-team, all features)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run the dogfood suite
        run: cargo run -p agent-team --release --all-features

  # ── Example surface coverage ─────────────────────────────────────────────
  #
  # Both examples drive every A2A method over every binding they serve and
  # assert the resulting matrix is complete. Added 2026-08-11, when measuring
  # them showed `echo-agent` drove 4 of the 11 methods over 2 of the 4
  # transports and `incident-response` 4 over 1, while `examples/README`
  # presented the first as "the complete request lifecycle".
  #
  # The matrix rows are not this project's list. They come from
  # `Method::ALL`, which `a2a-protocol-types` asserts equal to
  # `service A2AService` in the ratified `proto/a2a_v1/a2a.proto`, and which
  # the Official TCK workflow cross-checks against the upstream conformance
  # suite. A reviewer auditing the denominator reads the proto.
  #
  # Exit codes are the gate: 0 complete, 1 a call or counter-test failed,
  # 2 a matrix cell never ran. A bare `run:` fails on any non-zero, so a
  # silently shrunk matrix is a red job rather than a shorter report.
  #
  # Running these found a real client defect, which is the argument for the
  # job: the WebSocket transport forwarded its `stream_complete` control frame
  # to the consumer, where it failed to deserialize as a `StreamResponse`. It
  # only surfaces when a stream ends *without* a terminal task state — an agent
  # that asks a clarifying question — which is why `echo-agent` never hit it
  # and `incident-response` did.
  #
  # Proven able to fail, 2026-08-11: dropping the `ListTasks` recording from
  # the shared sweep, with every call still succeeding, exits 2 and names all
  # four cells.
  slimrpc-binding:
    name: SLIMRPC binding (out-of-workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `bindings/a2a-protocol-slimrpc` is deliberately not a workspace member —
    # `agntcy-slim-rpc` brings 379 transitive dependencies including
    # `aws-lc-sys`, a native C crypto build, and none of that belongs in the
    # lockfile or audit surface of the four published crates. The cost of that
    # isolation is that every other job in this file skips it, so it needs a job
    # of its own or it rots silently while the workspace stays green.
    #
    # It exercises the extension points from outside, which is the only thing
    # that can catch them regressing: `Transport`, `with_custom_transport`,
    # `RequestHandler`'s `on_*` methods, and `EventStream::from_event_channel`.
    # Its end-to-end tests run a real SLIM datapath in-process, so no fabric
    # node or network is needed here.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: bindings/a2a-protocol-slimrpc
      - name: Format
        working-directory: bindings/a2a-protocol-slimrpc
        run: cargo fmt --check
      - name: Clippy
        working-directory: bindings/a2a-protocol-slimrpc
        run: cargo clippy --all-targets -- -D warnings
      - name: Build the slim-node binary
        working-directory: bindings/a2a-protocol-slimrpc
        run: cargo build --bin slim-node

      # The root `deny.toml` is resolved against the workspace manifest, so
      # until this step existed the binding's 379 transitive dependencies —
      # `aws-lc-sys` and its C toolchain among them — were audited by nothing,
      # in the one crate here that ships a native build to users.
      #
      # `--version 0.19.0` is a floor, not a pin for reproducibility's sake:
      # 0.18.x aborts loading the advisory database on any CVSS 4.0 entry
      # rather than skipping it, so an older binary reports a clean run it did
      # not perform.
      - name: cargo-deny (the binding's own dependency tree)
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          command: check
          manifest-path: bindings/a2a-protocol-slimrpc/Cargo.toml
          command-arguments: "--config bindings/a2a-protocol-slimrpc/deny.toml"

      # `cargo package --workspace` in the `package` job cannot see this crate
      # either, so nothing checked that a `publish = true` crate actually
      # packages. It is excluded from the manifest list on purpose (`exclude`
      # in its Cargo.toml keeps the test fixtures out of the tarball), which is
      # exactly the kind of thing that breaks silently between releases.
      #
      # `--no-verify` is required rather than convenient. The binding depends on
      # the workspace crates as `version = "0.10", path = "../.."`, and packaging
      # strips the path — so the verification build resolves `a2a-protocol-server`
      # from crates.io, i.e. the *last released* version. Any API added in the
      # same change as the binding that uses it would fail verification until
      # that release ships. Building the binding against the local server is
      # what the Build and Test steps above already do.
      #
      # The wrapper exists because stripping the path also breaks the *pin*
      # during a release: the version being prepared is not on the index yet, so
      # one commit per cycle could not pass this step in either direction — and
      # reverting the pin breaks the binding's build instead (B23). It skips
      # registry resolution for exactly that state, proves the rest of packaging
      # with `cargo package --list`, and fails on everything else, a typo'd pin
      # included. Its decision table is self-tested on every run.
      - name: Package validation
        run: ./scripts/package_binding.py
      # Six topologies: in-process, multicast group, one node over TCP, that
      # node with verified TLS, two peered nodes, and a node in its own OS
      # process. The last four bind loopback ports and spawn a child process,
      # so they run single-threaded to keep port reservation and process
      # readiness deterministic on a shared runner.
      - name: Test (unit, end-to-end, and doc)
        working-directory: bindings/a2a-protocol-slimrpc
        run: cargo test -- --test-threads=1

      # The SPIFFE suite runs against a real spire-server and spire-agent, not
      # a stub — SPIFFE identity means nothing unless the credential comes from
      # a real attesting authority. Those tests are #[ignore]d so a contributor
      # without SPIRE is not blocked, which means CI has to ask for them by
      # name or they would never run anywhere.
      #
      # The testbed panics rather than skipping when the binaries are missing,
      # so this step cannot silently report coverage it does not have.
      - name: Install SPIRE
        run: |
          set -euo pipefail
          version=1.11.2
          curl -fsSL -o /tmp/spire.tar.gz \
            "https://github.com/spiffe/spire/releases/download/v${version}/spire-${version}-linux-amd64-musl.tar.gz"
          tar xzf /tmp/spire.tar.gz -C /tmp
          echo "SPIRE_BIN_DIR=/tmp/spire-${version}/bin" >> "$GITHUB_ENV"

      # Three suites, all against real SPIRE: identity, federation between two
      # trust domains, and credential rotation. The rotation one waits for
      # wall-clock expiry of 40-second SVIDs, so it is slow by construction —
      # that is the cost of testing the failure mode a long-lived deployment
      # actually hits.
      - name: Test (SPIFFE, against real SPIRE)
        working-directory: bindings/a2a-protocol-slimrpc
        run: |
          cargo test --test spiffe --test spiffe_federation --test spiffe_rotation \
            -- --ignored --test-threads=1

  example-surface:
    name: Example surface coverage (all methods x all bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Act 5's PostgreSQL check is the one capability the example cannot start a
    # server for. Without this service it reports `[NOT RUN]` and the job still
    # passes — honest, but a permanent gap. The service turns it into a check
    # that actually runs, which is the difference between "we ship a Postgres
    # store" and "we ran against Postgres".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: echo-agent — every method over every binding
        run: cargo run -p echo-agent --release
      # `INCIDENT_EXIT_WHEN_DONE` makes the demo return instead of parking on
      # Ctrl+C for a human to poke at; without it the job would hit its
      # timeout after a successful run, which is a red job for a green result.
      - name: incident-response — narrative demo, then every method over every binding
        run: cargo run -p incident-response --release
        env:
          INCIDENT_EXIT_WHEN_DONE: "1"
      # Act 5 again, on its own. The demo step above already runs it, so this
      # step costs a few seconds and buys attribution: a red demo step could be
      # any of five acts, and `scripts/prove_gates_fail.sh` can only prove a
      # gate by injecting one defect and naming the step that must go red.
      # Without a step whose *only* content is the hardening checks, the proof
      # that they can fail would rest on the demo step, whose proof is already
      # spoken for by the method x binding matrix.
      - name: incident-response — production hardening checks
        run: cargo run -p incident-response --release -- harden
        env:
          A2A_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Turns a `[NOT RUN]` into exit 4. Without it, a Postgres service that
          # stopped being provisioned would silently downgrade a real check to a
          # printed line and this job would stay green.
          INCIDENT_REQUIRE_ALL: "1"
      # The three examples whose point is an external dependency — an LLM
      # provider, or worker agents in four other languages. None is available
      # in CI, and none is needed: the A2A surface these examples serve is the
      # part this SDK owns, and it is measured either way.
      #
      # What each run does NOT do, it says. `genai`/`rig` print
      # "LLM leg: NOT EXERCISED" and label every fallback answer; `multi-lang`
      # prints each worker as "not reachable" and says delegation was not
      # exercised. A green job here therefore means "the protocol surface is
      # complete", never "the model works" or "four languages round-tripped" —
      # a distinction that only holds because the runs assert it out loud.
      - name: genai-agent — every method over every binding
        run: cargo run -p genai-a2a-agent --release
      - name: rig-agent — every method over every binding
        run: cargo run -p rig-a2a-agent --release
      - name: multi-lang-team — coordinator surface over every binding
        run: cargo run -p multi-lang-team --release
