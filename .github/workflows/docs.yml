name: Deploy Documentation

# A finished release deploys too: the site's root is the latest release's
# book, so a new tag must reach it without waiting for the next push to main.
# Through `workflow_run` rather than a tag trigger: a `workflow_run` run
# executes on the default branch, which the `github-pages` environment allows
# to deploy, and a tag ref may not be. Dispatching from release.yml instead
# would need `actions: write` there.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # A failed release published nothing new; the site stays as it is.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Always main, with every tag: /dev/ is main's book whichever event ran
      # this, and each release line's book is built from its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build book

      - name: Write per-page SEO metadata
        # The served HTML carries each page's own canonical URL, share URL,
        # titles and description, and noindex on print.html and 404.html;
        # the check fails the deploy if any page does not. See the script.
        run: |
          python3 scripts/seo_postprocess.py book/book
          python3 scripts/seo_postprocess.py book/book --check

      # Nightly, as docs.rs uses: `--cfg docsrs` turns on `feature(doc_cfg)`
      # (release audit F27), which stable refuses (E0554), and it is what puts
      # each item's feature badge on the page.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-15
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The site carried no API reference at all: `deployment/cicd.md` said to
      # consider "linking to docs.rs once published", which leaves the book's
      # hand-written API Quick Reference as the only signature listing on the
      # site — and nothing regenerates that. rustdoc is generated from the code
      # on every deploy, so it cannot drift.
      #
      # `--no-deps` keeps this to the four published crates rather than every
      # transitive dependency: dependency docs would multiply build time and
      # output size for pages nobody visits from here.
      - name: Build API documentation
        run: |
          cargo doc --no-deps --all-features \
            -p a2a-protocol-types \
            -p a2a-protocol-client \
            -p a2a-protocol-server \
            -p a2a-protocol-sdk
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

      - name: Place API documentation under /api/
        run: |
          set -euo pipefail
          mkdir -p book/book/api
          cp -r --no-preserve=mode target/doc/. book/book/api/
          # rustdoc emits no landing page with `--no-deps`, so /api/ alone
          # would 404. Redirect it at the umbrella crate.
          cat > book/book/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>a2a-protocol API documentation</title>
          <meta http-equiv="refresh" content="0; url=a2a_protocol_sdk/index.html">
          <link rel="canonical" href="a2a_protocol_sdk/index.html">
          <p>Redirecting to <a href="a2a_protocol_sdk/index.html">a2a-protocol-sdk</a>.</p>
          HTML
          # Fail loudly rather than deploying an empty /api/: a 404 that only
          # appears in production is exactly what this step exists to prevent.
          for crate in a2a_protocol_types a2a_protocol_client a2a_protocol_server a2a_protocol_sdk; do
            test -f "book/book/api/$crate/index.html" \
              || { echo "rustdoc output missing for $crate"; exit 1; }
          done
          echo "API docs staged for 4 crates"

      - name: Copy static assets into build output
        # Mirrors everything under `book/static/` into the built site so that
        # crawlable files (robots.txt, sitemap.xml) and vendored assets
        # (book/static/vendor/*) land at their expected URLs. Vendoring is
        # intentional: corp egress proxies block fonts.googleapis.com and
        # cdn.jsdelivr.net, and fetching them at runtime used to silently
        # break the benchmark dashboard for enterprise visitors.
        run: |
          set -euo pipefail
          # --no-preserve=mode because the runner's umask flips some bits that
          # `cp -a` otherwise preserves and trips GitHub Pages permission checks.
          cp -r --no-preserve=mode book/static/. book/book/
          # Sanity-check the critical files landed where they are expected.
          test -f book/book/robots.txt
          test -f book/book/sitemap.xml
          test -f book/book/vendor/chart.umd.min.js
          test -f book/book/reference/benchmark-dashboard.html

      # Everything above built main's book; it becomes /dev/. The root is the
      # latest release's book and /vX.Y/ each release line's, built from
      # their tags with the same mdBook; see the script's docstring for the
      # layout and why only the root is indexed.
      - name: Build every release line's book and assemble the versioned site
        run: python3 scripts/build_docs_site.py build --dev book/book --out site

      - name: Versioned site is complete
        run: python3 scripts/build_docs_site.py check site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
