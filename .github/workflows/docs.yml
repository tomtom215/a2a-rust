name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build book

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The site carried no API reference at all: `deployment/cicd.md` said to
      # consider "linking to docs.rs once published", which leaves the book's
      # hand-written API Quick Reference as the only signature listing on the
      # site — and nothing regenerates that. rustdoc is generated from the code
      # on every deploy, so it cannot drift.
      #
      # `--no-deps` keeps this to the four published crates rather than every
      # transitive dependency: dependency docs would multiply build time and
      # output size for pages nobody visits from here.
      - name: Build API documentation
        run: |
          cargo doc --no-deps --all-features \
            -p a2a-protocol-types \
            -p a2a-protocol-client \
            -p a2a-protocol-server \
            -p a2a-protocol-sdk
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

      - name: Place API documentation under /api/
        run: |
          set -euo pipefail
          mkdir -p book/book/api
          cp -r --no-preserve=mode target/doc/. book/book/api/
          # rustdoc emits no landing page with `--no-deps`, so /api/ alone
          # would 404. Redirect it at the umbrella crate.
          cat > book/book/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>a2a-protocol API documentation</title>
          <meta http-equiv="refresh" content="0; url=a2a_protocol_sdk/index.html">
          <link rel="canonical" href="a2a_protocol_sdk/index.html">
          <p>Redirecting to <a href="a2a_protocol_sdk/index.html">a2a-protocol-sdk</a>.</p>
          HTML
          # Fail loudly rather than deploying an empty /api/: a 404 that only
          # appears in production is exactly what this step exists to prevent.
          for crate in a2a_protocol_types a2a_protocol_client a2a_protocol_server a2a_protocol_sdk; do
            test -f "book/book/api/$crate/index.html" \
              || { echo "rustdoc output missing for $crate"; exit 1; }
          done
          echo "API docs staged for 4 crates"

      - name: Copy static assets into build output
        # Mirrors everything under `book/static/` into the built site so that
        # crawlable files (robots.txt, sitemap.xml) and vendored assets
        # (book/static/vendor/*) land at their expected URLs. Vendoring is
        # intentional: corp egress proxies block fonts.googleapis.com and
        # cdn.jsdelivr.net, and fetching them at runtime used to silently
        # break the benchmark dashboard for enterprise visitors.
        run: |
          set -euo pipefail
          # --no-preserve=mode because the runner's umask flips some bits that
          # `cp -a` otherwise preserves and trips GitHub Pages permission checks.
          cp -r --no-preserve=mode book/static/. book/book/
          # Sanity-check the critical files landed where they are expected.
          test -f book/book/robots.txt
          test -f book/book/sitemap.xml
          test -f book/book/vendor/chart.umd.min.js
          test -f book/book/reference/benchmark-dashboard.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
