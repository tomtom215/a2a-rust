#
# Benchmark suite — runs criterion benchmarks, generates book page, and
# commits results. Also provides a PR regression-gate job that compares
# PR benchmarks against the base branch and fails CI if any per-transport
# benchmark regresses beyond the configured threshold.
#
# Trigger:
#   - workflow_dispatch / push to main → full criterion run + book publish.
#   - pull_request → regression-gate job only (fast subset, fails on
#     regression beyond `benches/scripts/check_regression.py --threshold`).

name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "benches/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["main"]
    paths:
      - "benches/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/benchmarks.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  bench:
    name: Run Benchmarks
    # Full criterion sweep + book publish only runs on manual dispatch or
    # pushes to main. Pull requests are covered by the regression-gate job
    # below, which runs a focused subset against the base branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install python3 (for result extraction)
        run: python3 --version

      - name: Build benchmarks
        run: cargo bench -p a2a-benchmarks --no-run

      # ── Run each benchmark module ────────────────────────────────────

      - name: Run protocol_overhead
        run: cargo bench -p a2a-benchmarks --bench protocol_overhead

      - name: Run task_lifecycle
        run: cargo bench -p a2a-benchmarks --bench task_lifecycle

      - name: Run transport_throughput
        run: cargo bench -p a2a-benchmarks --bench transport_throughput

      - name: Run concurrent_agents
        run: cargo bench -p a2a-benchmarks --bench concurrent_agents

      - name: Run cross_language (Rust only)
        run: cargo bench -p a2a-benchmarks --bench cross_language

      - name: Run realistic_workloads
        run: cargo bench -p a2a-benchmarks --bench realistic_workloads

      - name: Run error_paths
        run: cargo bench -p a2a-benchmarks --bench error_paths

      - name: Run backpressure
        run: cargo bench -p a2a-benchmarks --bench backpressure

      - name: Run data_volume
        run: cargo bench -p a2a-benchmarks --bench data_volume

      - name: Run memory_overhead
        run: cargo bench -p a2a-benchmarks --bench memory_overhead

      - name: Run enterprise_scenarios
        run: cargo bench -p a2a-benchmarks --bench enterprise_scenarios

      - name: Run production_scenarios
        run: cargo bench -p a2a-benchmarks --bench production_scenarios

      - name: Run advanced_scenarios
        run: cargo bench -p a2a-benchmarks --bench advanced_scenarios

      # ── Generate and commit book page ────────────────────────────────

      - name: Generate benchmark results page
        run: ./benches/scripts/generate_book_page.sh

      - name: Generate benchmark dashboard
        run: ./benches/scripts/generate_dashboard.sh

      - name: Commit benchmark results to book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/src/reference/benchmarks.md book/src/reference/benchmark-dashboard.html
          if git diff --cached --quiet; then
            echo "No benchmark result changes to commit."
          else
            git commit -m "chore: update benchmark results

          Auto-generated by the Benchmarks workflow.
          Source: benches/scripts/generate_book_page.sh, generate_dashboard.sh"
            git push
          fi

      # ── Archive raw criterion reports ────────────────────────────────

      - name: Upload criterion reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: criterion-reports
          path: target/criterion/
          retention-days: 30

  # ── Regression gate (pull requests) ────────────────────────────────────
  #
  # Runs a focused subset of the criterion suite twice — once on the
  # base branch to establish a baseline, once on the PR to measure
  # change — then fails the job if any benchmark's median regression
  # passes the statistical test in `check_regression.py`.
  #
  # Statistical test: a benchmark is flagged as a regression only when
  # the *lower* bound of criterion's 95 % confidence interval on the
  # median change exceeds the threshold. Gating on the point estimate
  # alone produced false positives on GitHub-runner noise (15-25 %
  # variance is common on small benches); requiring the whole CI to
  # sit above the threshold gives a much higher-signal gate.
  #
  # Threshold: 50 % — not 25. Observation showed that even tight-CI
  # regressions of ~25-30 % appear on pristine code due to GitHub-runner
  # heterogeneity (CPU frequency, thermal throttling). The other big
  # false-positive source — whole-program-LTO inlining shifts caused by
  # unrelated code in a sibling crate — is removed here by building the
  # gate's benches without LTO (see the `bench-regression` job's `env`).
  # A 50 % threshold tolerates the residual runner effects while still
  # catching the regressions worth blocking: accidental O(n²) loops,
  # allocator thrash, lost inlining in hot paths, etc. See
  # `book/src/reference/regression-gate.md` for the full analysis.
  #
  # Scope: we deliberately restrict the PR gate to `transport_throughput`
  # and `protocol_overhead` — the two benchmarks that exercise the
  # per-transport critical path and serde hot loop. Running the full
  # suite twice inside a 60-minute PR job is not realistic, and those
  # two modules cover the surface area most likely to regress from
  # routine code changes. The full suite still runs on pushes to
  # `main` via the `bench` job above.
  bench-regression:
    name: Regression Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The gate builds its comparison benches WITHOUT whole-program LTO,
    # even though the shipping profile (and the `main` dashboard `bench`
    # job above) is `lto = true` + `codegen-units = 1`. Rationale:
    #
    # Under fat LTO the optimizer re-inlines across every workspace crate,
    # so adding unrelated code to a hot crate — e.g. a cold ISO-8601 helper
    # in `a2a-protocol-types` — shifts the inlining and code layout of
    # serde_json's string serializer and surfaces as a tight-CI "regression"
    # on serialize micro-benchmarks whose own source is byte-identical to
    # the base branch. Observed on this repo: `payload_scaling` serialize
    # benches +54..84 % with ~2 %-wide CIs, while every deserialize bench
    # stayed flat, the serialize path's source was proven unchanged, and the
    # delta did not reproduce under a different compiler (classic code-layout
    # luck, not an algorithmic change).
    #
    # Building the gate without whole-program LTO compiles serde_json (and
    # every other dependency) independently, so their hot loops are immune to
    # unrelated changes in *our* crates. The comparison then measures the
    # algorithmic delta of the diff — the gate's actual job — instead of
    # LTO layout roulette. `codegen-units = 16` is the stock `cargo bench`
    # default. Baseline and PR are built with the same settings, so the
    # comparison stays apples-to-apples. See
    # book/src/reference/regression-gate.md for the full analysis.
    env:
      CARGO_PROFILE_BENCH_LTO: "false"
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # full history — we check out the base branch

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Build the benches once up front so both baseline and PR runs
      # share the compiled benchmark binaries (incremental compilation
      # still works across the `git checkout` because the benches crate
      # depends on workspace crates by path, not Cargo.lock revision).
      - name: Pre-build benches
        run: cargo bench -p a2a-benchmarks --no-run

      - name: Save baseline from base branch
        run: |
          set -euxo pipefail
          BASE_REF="${{ github.base_ref }}"
          # `actions/checkout` above was called with fetch-depth: 0, so the
          # base branch is already in our local refs — no additional fetch
          # needed. A shallow `git fetch --depth=1` here would actively
          # conflict with that full clone.
          git checkout "origin/$BASE_REF" --
          echo "::group::Baseline benchmarks (base: $BASE_REF)"
          # --sample-size 30 keeps the full bench run well under 15 min per
          # branch on a shared runner (two full bench matrices fit inside
          # the 60-min job budget with headroom for compilation). Default
          # is 100 which would blow past the budget for these two modules.
          cargo bench -p a2a-benchmarks --bench transport_throughput -- \
            --save-baseline pr-base --warm-up-time 1 --measurement-time 3 --sample-size 30
          cargo bench -p a2a-benchmarks --bench protocol_overhead -- \
            --save-baseline pr-base --warm-up-time 1 --measurement-time 3 --sample-size 30
          echo "::endgroup::"

      - name: Compare PR against baseline
        id: compare
        run: |
          set -euxo pipefail
          git checkout "${{ github.event.pull_request.head.sha }}" --
          echo "::group::PR benchmarks vs pr-base"
          cargo bench -p a2a-benchmarks --bench transport_throughput -- \
            --baseline pr-base --warm-up-time 1 --measurement-time 3 --sample-size 30
          cargo bench -p a2a-benchmarks --bench protocol_overhead -- \
            --baseline pr-base --warm-up-time 1 --measurement-time 3 --sample-size 30
          echo "::endgroup::"

          echo "::group::Criterion change-file inventory"
          # Surface what criterion actually produced — helps diagnose
          # "no change files found" errors (bench rename, criterion
          # version bump, etc.) from the CI log alone.
          find target/criterion -name "estimates.json" -path "*/change/*" \
            | sort | head -50
          echo "::endgroup::"

          echo "::group::Regression analysis"
          # Threshold is set to 50% rather than the tighter 25% that the
          # documentation comment above discusses, because experience on
          # this repo has shown that GitHub-hosted runners occasionally
          # produce *tight-CI* regressions of ~25-30% on individual
          # benches even when the benchmarked code is provably unchanged
          # (runner-to-runner CPU frequency / thermal differences; the
          # LTO-inlining source of these is removed by the job's non-LTO
          # build env). See
          # `book/src/reference/regression-gate.md` for the full
          # analysis. 50% still catches the regressions we want to
          # block — accidental O(n²) loops, allocator thrash, lost
          # inlining in hot paths — while staying honest about CI
          # noise. Change when moving to self-hosted runners.
          # Per-benchmark exclusion, not just an override: `from_str/16384`
          # doesn't just need a wider tolerance than the default 50% gate —
          # its percentage swing isn't a reliable signal at all. Confirmed
          # 2026-07-29 on PR #99: two CI runs on the *same* commit measured
          # +169% and +175% (tight CIs, ~1pp wide). A local reproduction
          # using this job's exact build (LTO off, codegen-units=16,
          # sequential same-target-dir checkout, matching sample flags)
          # first matched CI at +175%, then measuring the *same* commit pair
          # again immediately after flipped to -15%. A bisection of every
          # commit on that PR against main showed every one an improvement
          # (-5% to -21%), never a regression. `from_slice/16384` — same
          # Message/Part Deserialize impl, same size, different reader —
          # never wobbles. This is per-process-launch layout/allocator
          # noise (ASLR-class), not an algorithmic effect: the *within-run*
          # confidence interval is tight because all 30 samples in one
          # process share that launch's layout, but the *between-launch*
          # variance is large enough to blow past any fixed percentage
          # tolerance we'd pick. A 75% override already tried and wasn't
          # enough. See book/src/reference/regression-gate.md's
          # "Per-benchmark exclusions" section for the full writeup.
          python3 benches/scripts/check_regression.py \
            --target-dir target/criterion \
            --threshold 0.50 \
            --exclude '*/from_str/16384' \
            | tee /tmp/regression.txt
          echo "::endgroup::"

      - name: Report outcome
        if: always()
        run: |
          {
            echo "# Benchmark Regression Gate"
            echo ""
            echo "Compared this PR against \`${{ github.base_ref }}\` on \`transport_throughput\` and \`protocol_overhead\`."
            echo "Threshold: **50 %** (95 % CI lower bound of the median); per-benchmark overrides are listed inline as \`[override N%]\`, exclusions as \`[EXCLUDED]\`."
            echo ""
            echo "See [book/src/reference/regression-gate.md](../book/src/reference/regression-gate.md) for why the threshold is this forgiving on GitHub-hosted runners."
            echo ""
            if [ -f /tmp/regression.txt ]; then
              echo '```'
              cat /tmp/regression.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criterion-reports-pr
          path: target/criterion/
          retention-days: 14
