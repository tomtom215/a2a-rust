#
# Test coverage — generates an LCOV report and uploads to Codecov.
#
# Runs on pushes to main and PRs. Uses cargo-llvm-cov for accurate
# source-based coverage instrumentation (no sampling, no heuristics).

name: Coverage

on:
  push:
    # `claude/**` as in ci.yml: a branch's coverage is uploaded under its
    # own name, so the number can be read back before a PR exists.
    branches: ["main", "claude/**"]
  pull_request:
    branches: [main]
  # On demand as well, so a change to the upload step can be proven without
  # waiting for a merge to main. This job's whole purpose is to publish a
  # signal; a signal that cannot be tested until it is already live is the
  # same problem the Codecov comment below describes.
  workflow_dispatch:
  # Weekly, for the `ignores-applied` job only: `codecov.yml`'s ignore list
  # was, from 2026-08-06 to 2026-09-09, a record of an exclusion that Codecov
  # never applied, and nothing ran the script that could have said so. The
  # report the API serves is the settled one for `main`, which is why this is
  # a schedule and not a step after the upload above: an upload is processed
  # asynchronously, and reading the tree straight after it reads the previous
  # commit's report.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    # The schedule exists for `ignores-applied` below; an upload from a
    # scheduled run would publish nothing new.
    if: github.event_name != 'schedule'
    # The seven PostgreSQL store files only execute against a live server.
    # Until 2026-09-09 they were meant to be excluded from the dashboard
    # instead, and the exclusion never worked (see codecov.yml): 957 of the
    # 35,287 counted lines sat at 0-8% and made up 42% of every uncovered
    # line in the repository. Running the same suite the `test-postgres`
    # CI job runs, under instrumentation, measures them instead.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # protoc is bundled via the `protoc-bin-vendored` crate (see the
      # grpc build scripts in crates/a2a-protocol-client and crates/a2a-protocol-server).

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      # Two instrumented runs, one report. `--no-report` accumulates profiles
      # across both; the second adds the `#[ignore]`d PostgreSQL suite, which
      # is gated on A2A_TEST_POSTGRES_URL exactly as in ci.yml's
      # `test-postgres` job.
      - name: Run the workspace tests under instrumentation
        run: cargo llvm-cov --workspace --all-features --no-report
      - name: Run the PostgreSQL integration suite under instrumentation
        run: cargo llvm-cov --no-report -p a2a-protocol-server --features postgres --test postgres_store_tests -- --ignored
        env:
          A2A_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      # `--test-threads=1` for the same reason as in ci.yml: each test creates
      # and drops a scratch database and the rate-limit tests count
      # admissions against a shared counter.
      - name: Run the multi-replica suite under instrumentation
        run: cargo llvm-cov --no-report -p a2a-protocol-server --features postgres --test multi_replica -- --ignored --test-threads=1
        env:
          A2A_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Generate coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload to Codecov
        # RESOLVED (2026-07-30): the 2026-06-10 outage that motivated the
        # `continue-on-error` this replaces was Codecov permanently losing
        # write access to the `codecovsecurity` keybase
        # account, not a transient blip — keybase.io/codecovsecurity still
        # 404s today and always will (upstream: codecov/codecov-action#1956).
        # They migrated to `codecovsecops` and shipped the fix in v5.5.5,
        # which changes only the hardcoded key-fetch URL in dist/codecov.sh
        # (diffed directly against v5.5.4: one line). Verified live before
        # this bump: keybase.io/codecovsecops/pgp_keys.asc returns a real
        # `BEGIN PGP PUBLIC KEY BLOCK`, the old codecovsecurity URL still
        # 404s, and no newer v5.5.x exists. `continue-on-error` is removed
        # so fail_ci_if_error below has teeth again — if this regresses, it
        # should be loud, not silently green.
        #
        # Proven end-to-end, not just reasoned about: this job was dispatched
        # on the branch carrying the bump, completed green with
        # `fail_ci_if_error: true` and no `continue-on-error` (so a failed
        # upload would have failed the job), and Codecov's own API then
        # reported the commit as `state: complete` with coverage attached.
        # An earlier revision of this comment carried a caveat that Codecov
        # showed no upload since 2026-05-25, predating the outage, and warned
        # of a possible second cause; that dispatch disproved it — there was
        # no second cause, and the caveat has been removed rather than left
        # standing as a stale warning.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          # A failed upload must be visible, not silently green — otherwise
          # the coverage signal can disappear without anyone noticing.
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Every `ignore:` entry in codecov.yml is checked against the files Codecov
  # is actually counting for `main`. An entry that still matches a counted
  # file is a failure: the file claims an exclusion that is not in effect,
  # which is exactly what it claimed for five PostgreSQL store paths for five
  # weeks (see codecov.yml). Measured 2026-09-10 before this job existed:
  # 3 patterns, 146 files in the report, no match. PyYAML is installed
  # explicitly for the same reason ci.yml installs it: a checker that cannot
  # parse its input must fail, not skip.
  ignores-applied:
    name: codecov.yml ignores are applied
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Ignore patterns match nothing Codecov counts
        run: python3 scripts/check_codecov_ignores.py
