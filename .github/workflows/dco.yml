#
# Developer Certificate of Origin (DCO) enforcement.
#
# Runs scripts/check_dco.sh — sign-off and human authorship over every
# non-merge commit in the range — on every pull request and, since
# 2026-09-10, on every push to `main`. Until then this workflow triggered on
# `pull_request` only, so a commit that reached `main` by a direct push, a
# merge made outside a pull request, or a workflow's own push was never
# graded; scripts/check_gate_reachability.py is the check that now says so.
# The check itself lives in the script so benchmarks.yml can run the same one
# over the commit it pushes (a GITHUB_TOKEN push creates no workflow run, so
# nothing else ever sees that commit). See PROVENANCE.md §3.2.

name: DCO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off and authorship
    runs-on: ubuntu-latest
    steps:
      # Full history: the base..head range needs both endpoints present.
      # On a pull request the range is base..head of the PR; on a push to
      # main it is the push's before..after, so exactly the commits that
      # landed are graded and nothing is graded twice.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch the base branch
        run: git fetch --no-tags origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Check sign-off and authorship
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: '"$GITHUB_WORKSPACE"/scripts/check_dco.sh "$BASE_SHA" "$HEAD_SHA"'
