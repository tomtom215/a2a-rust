#
# The observability stack's rules, configuration and generated manifests
# (deploy/observability, deploy/kubernetes/observability), checked by the
# tools that will load them. Until 0.16.0 nothing ran promtool: the rule
# tests were read, never run, by CI (audit C, PLAN group J).
#
# promtool and amtool come from the Prometheus and Alertmanager release
# tarballs at the versions the compose stack runs, each checked against the
# SHA-256 that release's sha256sums.txt lists (copied here on 2026-11-04;
# change version and digest together, and the image pins in
# docker-compose.yml with them).
#
# check_stack.py: the caller-class pattern in the rules matches the codes the
# crates define (NEW-c-1), prometheus-compose.yml keeps prometheus.yml's
# shared blocks, every compose image is pinned by digest, and the Kubernetes
# manifests are what their sources generate (C-22).

name: Observability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  promtool:
    name: Prometheus rules and stack configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS_VERSION: "3.15.1"
      PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
      ALERTMANAGER_VERSION: "0.34.2"
      ALERTMANAGER_SHA256: 17ee14acd0f6ba6e25a436ff223d9c17ddd5cf484f543ad12f0932eaa89ba186
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install promtool and amtool (pinned by SHA-256)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/obs-bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          p="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -fsSL -o prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${p}.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tar.gz" | sha256sum -c -
          tar xzf prometheus.tar.gz "${p}/promtool" && mv "${p}/promtool" "$bin/"
          a="alertmanager-${ALERTMANAGER_VERSION}.linux-amd64"
          curl -fsSL -o alertmanager.tar.gz "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/${a}.tar.gz"
          echo "${ALERTMANAGER_SHA256}  alertmanager.tar.gz" | sha256sum -c -
          tar xzf alertmanager.tar.gz "${a}/amtool" && mv "${a}/amtool" "$bin/"
          echo "$bin" >> "$GITHUB_PATH"

      - name: promtool check config
        working-directory: deploy/observability/prometheus
        run: |
          set -euo pipefail
          for f in prometheus.yml prometheus-compose.yml prometheus-collector.yml; do
            promtool check config "$f"
          done

      - name: promtool check rules
        run: promtool check rules deploy/observability/prometheus/rules/*.yml

      # Every test file, and at least one: a glob that matched nothing would
      # otherwise pass having tested no rule.
      - name: promtool test rules
        working-directory: deploy/observability/prometheus
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*.test.yml)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::no promtool test files under deploy/observability/prometheus/tests"; exit 1
          fi
          promtool test rules "${tests[@]}"

      - name: amtool check-config
        run: amtool check-config deploy/observability/alertmanager/alertmanager.yml

      - name: Stack consistency and generated Kubernetes manifests
        run: python3 -m pip install --quiet --require-hashes -r .github/requirements/pyyaml.txt && python3 deploy/observability/scripts/check_stack.py
