#
# Release pipeline for a2a-rust
#
# Triggered by pushing a semver tag (e.g. `git tag -a v0.2.0 -m "Release v0.2.0" && git push origin v0.2.0`).
# See RELEASING.md for the complete release runbook.
#
# Job dependency graph:
#
#   validate ──┬──► ci (matrix) ──┬──► package ─────────┬──► github-release ──► publish
#              └──► security ────┘                     │                       (crates-io env)
#                                └──► publish-dry-run ─┘

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # stable:      v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"      # pre-release: v1.2.3-alpha.1

# Prevent concurrent releases for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimal default — individual jobs escalate only what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── Job 1: Validate tag & extract metadata ────────────────────────────────────
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version:       ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      # `fetch-depth: 0` and `fetch-tags` so the tag *object* is present, not
      # just the ref: the check below asks what kind of object it is, which
      # a shallow checkout cannot answer.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      # RELEASING.md step 3 says `git tag -a`. All ten tags to date are
      # lightweight anyway — bare refs with no tagger, no date, no message —
      # because creating a release through the GitHub UI produces one. The
      # instruction was documented and not applied, and nothing noticed for
      # ten releases. This is the check that notices.
      #
      # Annotated, not signed. Signing needs a maintainer key and a published
      # way for adopters to obtain it, which is a decision this workflow
      # cannot make; see the "Known gap" note in RELEASING.md. Requiring an
      # annotated tag is the part that is achievable today, and it is what
      # makes the tag itself record who cut the release and when.
      - name: Tag is annotated
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          KIND=$(git cat-file -t "$TAG" 2>/dev/null || echo "missing")
          printf 'Tag %s is a %s object\n' "$TAG" "$KIND"
          if [ "$KIND" != "tag" ]; then
            echo "::error::Tag '$TAG' is lightweight (a $KIND object), not annotated."
            echo ""
            echo "A lightweight tag records no tagger and no date, so the tag alone"
            echo "does not attest who cut the release or when. RELEASING.md step 3"
            echo "specifies 'git tag -a'; the GitHub release UI does not do that."
            echo ""
            echo "Delete the tag and recreate it locally:"
            echo "    git tag -d $TAG && git push --delete origin $TAG"
            echo "    git tag -a $TAG -m \"Release $TAG\" && git push origin $TAG"
            exit 1
          fi
          printf 'Tagger: %s\n' "$(git for-each-ref "refs/tags/$TAG" --format='%(taggername) %(taggerdate:iso)')"

      - name: Extract version metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          echo "::group::Tag metadata"
          printf 'Tag:        %s\n' "$TAG"
          printf 'Version:    %s\n' "$VERSION"

          # Validate semver (X.Y.Z with optional pre-release and build metadata)
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?(\+[A-Za-z0-9.]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Tag '$TAG' is not a valid semantic version."
            echo "Expected format: vX.Y.Z  or  vX.Y.Z-pre.1"
            exit 1
          fi

          # Detect pre-release (contains a hyphen after X.Y.Z)
          if [[ "$VERSION" =~ - ]]; then
            IS_PRE=true
          else
            IS_PRE=false
          fi

          printf 'Pre-release:%s\n' "$IS_PRE"
          echo "::endgroup::"

          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE"  >> "$GITHUB_OUTPUT"

      - name: Verify all crate versions match tag
        shell: bash
        run: |
          TAG_VER="${{ steps.meta.outputs.version }}"
          FAILED=0

          echo "::group::Version consistency"
          for toml in crates/a2a-protocol-types/Cargo.toml crates/a2a-protocol-client/Cargo.toml crates/a2a-protocol-server/Cargo.toml crates/a2a-protocol-sdk/Cargo.toml; do
            CARGO_VER=$(grep '^version' "$toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [[ "$CARGO_VER" != "$TAG_VER" ]]; then
              echo "::error file=$toml::$toml version ($CARGO_VER) != tag ($TAG_VER)."
              echo "Update $toml to match the tag before releasing."
              FAILED=1
            else
              printf '✓ %s: %s\n' "$toml" "$CARGO_VER"
            fi
          done
          echo "::endgroup::"

          if [[ "$FAILED" -eq 1 ]]; then
            exit 1
          fi
          echo "::notice::All crate versions match tag: $TAG_VER"

      - name: Verify CHANGELOG entry exists
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          IS_PRE="${{ steps.meta.outputs.is_prerelease }}"
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')

          if ! grep -qE "^## \[$VERSION_RE\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' entry in CHANGELOG.md."
            echo "Add release notes before tagging."
            exit 1
          fi

          # Stable releases must carry a real date — an '— Unreleased' heading
          # left over from release prep would otherwise ship as the public
          # record of the release.
          if [[ "$IS_PRE" == "false" ]] && ! grep -qE "^## \[$VERSION_RE\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::'## [$VERSION]' heading is not dated."
            echo "Expected '## [$VERSION] - YYYY-MM-DD'. Date the heading before tagging."
            exit 1
          fi
          echo "::notice::CHANGELOG.md entry found for v$VERSION"

      - name: Verify CITATION.cff and SECURITY.md match the release
        if: steps.meta.outputs.is_prerelease == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          FAILED=0

          # CITATION.cff must cite the version being released (kept in lock-step
          # by the release-prep checklist in RELEASING.md).
          CFF_VER=$(grep -E '^version:' CITATION.cff | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$CFF_VER" != "$VERSION" ]]; then
            echo "::error file=CITATION.cff::CITATION.cff version ($CFF_VER) != tag ($VERSION)."
            FAILED=1
          fi
          if ! grep -qE '^date-released: "[0-9]{4}-[0-9]{2}-[0-9]{2}"' CITATION.cff; then
            echo "::error file=CITATION.cff::date-released missing or not YYYY-MM-DD."
            FAILED=1
          fi

          # SECURITY.md's supported-versions table must cover the line being
          # released, so the security policy can never lag the release again.
          MAJOR_MINOR=$(printf '%s' "$VERSION" | cut -d. -f1-2 | sed 's/\./\\./g')
          if ! grep -qE "\|\s*${MAJOR_MINOR}\.x\s*\|\s*:white_check_mark:" SECURITY.md; then
            echo "::error file=SECURITY.md::Supported Versions table does not mark ${VERSION%.*}.x as supported."
            FAILED=1
          fi

          if [[ "$FAILED" -eq 1 ]]; then
            exit 1
          fi
          echo "::notice::CITATION.cff and SECURITY.md are consistent with v$VERSION"

# ── Job 2: Full CI gate (parallel matrix) ────────────────────────────────────
  ci:
    name: CI / ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: "test · Linux"
            os: ubuntu-latest
            toolchain: stable
            command: cargo test --workspace --all-features
          - name: "test · macOS"
            os: macos-latest
            toolchain: stable
            command: cargo test --workspace --all-features
          - name: "test · Windows"
            os: windows-latest
            toolchain: stable
            command: cargo test --workspace --all-features
          - name: "clippy"
            os: ubuntu-latest
            toolchain: stable
            components: clippy
            command: cargo clippy --workspace --all-targets --all-features -- -D warnings
          - name: "fmt"
            os: ubuntu-latest
            toolchain: stable
            components: rustfmt
            command: cargo fmt --all -- --check
          - name: "doc"
            os: ubuntu-latest
            toolchain: stable
            command: cargo doc --workspace --no-deps
          - name: "MSRV 1.93"
            os: ubuntu-latest
            toolchain: "1.93"
            command: cargo check --workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.components || '' }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # protoc is bundled via the `protoc-bin-vendored` crate.
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

# ── Job 3: Security audit ─────────────────────────────────────────────────────
  security:
    name: Security audit (cargo-deny)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          command: check

# ── Job 4: Package crates and generate provenance ─────────────────────────────
  package:
    name: Package and attest
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC token for SLSA attestation
      attestations: write  # write attestation to the repository
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here: the attested .crate artifacts are built cold so the
      # release path never restores build state written by routine CI runs.
      # protoc is bundled via the `protoc-bin-vendored` crate.

      - name: Package all publishable crates
        shell: bash
        run: |
          echo "::group::Package contents"
          cargo package --workspace --exclude echo-agent --exclude agent-team --exclude multi-lang-team --exclude rig-a2a-agent --exclude genai-a2a-agent --exclude incident-response --exclude a2a-tck --exclude a2a-tck-sut --exclude a2a-benchmarks --list --no-verify
          echo "::endgroup::"

          echo "::group::Build .crate archives"
          cargo package --workspace --exclude echo-agent --exclude agent-team --exclude multi-lang-team --exclude rig-a2a-agent --exclude genai-a2a-agent --exclude incident-response --exclude a2a-tck --exclude a2a-tck-sut --exclude a2a-benchmarks --no-verify
          echo "::endgroup::"

          echo "::group::Archive sizes"
          ls -lh target/package/*.crate
          echo "::endgroup::"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd target/package
          sha256sum ./*.crate | tee SHA256SUMS
          echo "::notice::SHA-256 checksums written to SHA256SUMS"

      # CycloneDX SBOM — a full dependency inventory alongside the provenance
      # attestation. Provenance answers "who built this and from what commit";
      # the SBOM answers "what is inside it", which release reviewers ask for
      # separately. One SBOM per published crate.
      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version '^0.5' --locked
          cargo cyclonedx --format json --all --spec-version 1.5
          mkdir -p target/package/sbom
          # cargo-cyclonedx writes <crate>.cdx.json next to each Cargo.toml.
          for crate in a2a-protocol-types a2a-protocol-client a2a-protocol-server a2a-protocol-sdk; do
            src="crates/$crate/$crate.cdx.json"
            # Fail loudly rather than release with an incomplete SBOM set —
            # each crate is attested against its own SBOM below.
            if [ ! -f "$src" ]; then
              echo "::error::Expected CycloneDX SBOM not found: $src"
              exit 1
            fi
            cp "$src" "target/package/sbom/$crate.cdx.json"
          done
          ls -lh target/package/sbom/
          echo "::notice::CycloneDX SBOMs written to target/package/sbom/"

      # Attest each crate against its OWN CycloneDX SBOM (not one shared SBOM
      # for all four), so `gh attestation verify <crate>.crate` resolves the
      # exact dependency inventory for that specific crate. The per-subject
      # globs (`<crate>-*.crate`) each match exactly one archive, independent
      # of the version embedded in the filename.
      - name: Attest SBOM — a2a-protocol-types
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: target/package/a2a-protocol-types-*.crate
          sbom-path: target/package/sbom/a2a-protocol-types.cdx.json
      - name: Attest SBOM — a2a-protocol-client
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: target/package/a2a-protocol-client-*.crate
          sbom-path: target/package/sbom/a2a-protocol-client.cdx.json
      - name: Attest SBOM — a2a-protocol-server
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: target/package/a2a-protocol-server-*.crate
          sbom-path: target/package/sbom/a2a-protocol-server.cdx.json
      - name: Attest SBOM — a2a-protocol-sdk
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: target/package/a2a-protocol-sdk-*.crate
          sbom-path: target/package/sbom/a2a-protocol-sdk.cdx.json

      # SLSA Level 2 build provenance — creates signed attestations linking
      # the .crate artifacts to this workflow run, verifiable with `gh attestation verify`.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: target/package/*.crate

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            target/package/*.crate
            target/package/SHA256SUMS
            target/package/sbom/*.cdx.json
          retention-days: 90
          if-no-files-found: error

# ── Job 5: Package verification (validates packages are publishable) ──────────
  publish-dry-run:
    name: Package verification
    needs: [ci, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # protoc is bundled via the `protoc-bin-vendored` crate.
      - name: Verify packages are publishable
        shell: bash
        run: |
          # Use `cargo package` instead of `cargo publish --dry-run` because
          # publish --dry-run resolves dependencies from the crates.io index,
          # which fails for workspace crates whose new versions aren't published yet.
          # `cargo package` resolves workspace dependencies locally.
          echo "::group::cargo package (all publishable crates)"
          cargo package --workspace --exclude echo-agent --exclude agent-team --exclude multi-lang-team --exclude rig-a2a-agent --exclude genai-a2a-agent --exclude incident-response --exclude a2a-tck --exclude a2a-tck-sut --exclude a2a-benchmarks
          echo "::endgroup::"
          echo "::notice::Package verification succeeded — all crates pass validation"

# ── Job 6: Create GitHub release with artifacts & release notes ───────────────
  github-release:
    name: Create GitHub release
    needs: [validate, package, publish-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create release, upload assets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-artifacts
          path: release-artifacts/

      - name: Extract CHANGELOG section for this version
        id: notes
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          echo "::group::Extracting release notes for v$VERSION"

          # Extract everything between ## [VERSION] and the next ## [ heading
          awk "
            /^## \[$VERSION\]/ { found=1; next }
            found && /^## \[/  { exit }
            found              { print }
          " CHANGELOG.md > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "::error::Empty release notes extracted for $VERSION"
            echo "Ensure CHANGELOG.md has a non-empty ## [$VERSION] section."
            exit 1
          fi

          echo "Release notes preview:"
          cat release_notes.md
          echo "::endgroup::"

      - name: List release artifacts
        shell: bash
        run: |
          echo "::group::Artifacts to attach"
          ls -lh release-artifacts/
          echo "::endgroup::"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IS_PRE="${{ needs.validate.outputs.is_prerelease }}"
          TAG="v${VERSION}"

          PRE_FLAG=""
          [[ "$IS_PRE" == "true" ]] && PRE_FLAG="--prerelease"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          # Idempotent: if a release already exists (e.g. created by GitHub
          # Desktop or the web UI when pushing a tag), update it in place
          # instead of failing.
          if gh release view "$TAG" &>/dev/null; then
            echo "::warning::Release ${TAG} already exists — updating it."
            echo "::group::Updating GitHub release ${TAG}"
            gh release edit "$TAG" \
              $PRE_FLAG \
              --title "a2a-rust ${TAG}" \
              --notes-file release_notes.md

            # Upload assets (--clobber overwrites if they already exist)
            gh release upload "$TAG" \
              --clobber \
              release-artifacts/*.crate \
              release-artifacts/SHA256SUMS \
              release-artifacts/sbom/*.cdx.json
            echo "::endgroup::"
            echo "::notice::GitHub release updated: $RELEASE_URL"
          else
            echo "::group::Creating GitHub release ${TAG}"
            gh release create "$TAG" \
              $PRE_FLAG \
              --title "a2a-rust ${TAG}" \
              --notes-file release_notes.md \
              release-artifacts/*.crate \
              release-artifacts/SHA256SUMS \
              release-artifacts/sbom/*.cdx.json
            echo "::endgroup::"
            echo "::notice::GitHub release created: $RELEASE_URL"
          fi

          # ── Step summary ──────────────────────────────────────────────────
          {
            echo "## Release v${VERSION} created"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Pre-release | \`${IS_PRE}\` |"
            echo "| GitHub Release | [v${VERSION}](${RELEASE_URL}) |"
            echo ""
            echo "### Artifacts"
            echo "\`\`\`"
            ls -lh release-artifacts/
            echo "\`\`\`"
            echo ""
            echo "### Next step"
            echo "Approve the **crates-io** deployment environment to publish to crates.io."
          } >> "$GITHUB_STEP_SUMMARY"

# ── Job 7: Publish to crates.io (protected environment, requires approval) ────
  publish:
    name: Publish to crates.io
    needs: [validate, github-release]
    runs-on: ubuntu-latest
    # The 'crates-io' environment requires a manual approval step.
    # Configure it at: Settings → Environments → crates-io → Required reviewers
    environment:
      name: crates-io
      url: https://crates.io/crates/a2a-protocol-sdk/${{ needs.validate.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here: what `cargo publish` uploads and verifies is built
      # cold rather than on top of cache written by routine CI runs.
      # protoc is bundled via the `protoc-bin-vendored` crate.

      - name: Publish crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          # Helper: idempotent publish with retry and yank recovery.
          #
          # Handles three recovery scenarios:
          #   1. "already uploaded" — unyank (if yanked) and treat as success.
          #   2. "yanked" dep resolution failure — a dependency was just unyanked
          #      but the index hasn't propagated yet; wait and retry.
          #   3. Transient network errors — retry with backoff.
          publish_crate() {
            local crate="$1"
            local max_attempts=5
            local attempt=1

            echo "::group::cargo publish — $crate v$VERSION"
            while (( attempt <= max_attempts )); do
              echo "Attempt $attempt/$max_attempts: publishing $crate v$VERSION"

              if cargo publish -p "$crate" 2>&1 | tee /tmp/publish-${crate}.log; then
                echo "::endgroup::"
                return 0
              fi

              # Already uploaded — unyank if needed and treat as success
              if grep -q "already uploaded" /tmp/publish-${crate}.log; then
                echo "::warning::$crate v$VERSION is already published — unyanking (if yanked) and skipping."
                cargo yank --undo "$crate@$VERSION" 2>&1 || true
                # Wait for the index to reflect the unyank before continuing
                # to the next crate that may depend on this one.
                echo "Waiting 30s for crates.io index to propagate unyank..."
                sleep 30
                echo "::endgroup::"
                return 0
              fi

              # Yanked dependency — the index hasn't caught up after a prior
              # unyank. Wait and retry.
              if grep -q "is yanked" /tmp/publish-${crate}.log; then
                local wait=$(( 15 * attempt ))
                echo "::warning::Dependency appears yanked in index — waiting ${wait}s for propagation (attempt $attempt/$max_attempts)."
                sleep "$wait"
                attempt=$(( attempt + 1 ))
                continue
              fi

              # Unknown / transient failure — retry with exponential backoff
              local wait=$(( 2 ** attempt ))
              if (( attempt < max_attempts )); then
                echo "::warning::Publish failed — retrying in ${wait}s (attempt $attempt/$max_attempts)."
                sleep "$wait"
                attempt=$(( attempt + 1 ))
              else
                echo "::error::cargo publish -p $crate failed after $max_attempts attempts"
                cat /tmp/publish-${crate}.log
                echo "::endgroup::"
                exit 1
              fi
            done
          }

          # Publish in topological order of ALL dependencies (including dev-deps).
          # `cargo publish` automatically waits for each crate to appear in the
          # crates.io index before returning, so no manual sleep is needed
          # (except after unyank — see publish_crate).
          #
          # Dependency graph:
          #   types  ──►  server  ──►  client (dev-dep on server)  ──►  sdk
          #          └────────────────────┘ (runtime dep on types)  ────┘
          publish_crate a2a-protocol-types
          publish_crate a2a-protocol-server
          publish_crate a2a-protocol-client
          publish_crate a2a-protocol-sdk

          echo "::notice::All crates published successfully"

          # ── Step summary ──────────────────────────────────────────────────
          {
            echo "## Published to crates.io"
            echo ""
            echo "| Crate | Link |"
            echo "|-------|------|"
            echo "| a2a-protocol-types  | [crates.io](https://crates.io/crates/a2a-protocol-types/${VERSION}) |"
