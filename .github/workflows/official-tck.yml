# Copyright 2026 Tom F. <tomf@tomtomtech.net> (https://github.com/tomtom215)
#
# Official A2A conformance suite — a2aproject/a2a-tck.
#
# This is the A2A project's own Technology Compatibility Kit: language- and
# transport-agnostic, graded by RFC 2119 level (MUST / SHOULD / MAY). It
# discovers the agent card over HTTP and drives whichever bindings the card
# advertises.
#
# Why this job exists alongside the in-repo `tck.yml`: conformance graded by
# the project that owns the specification is worth more than conformance
# graded by the implementation being tested. The in-repo TCK still earns its
# keep — it runs this SDK's client against agents built on the official
# Python/JS/Go/Java SDKs, which the official TCK does not do — but where the
# two overlap, this one is authoritative.
#
# The SUT is `tck/sut`, which implements the messageId-keyed behaviour
# contract the TCK asserts (see that crate's module docs and
# `docs/official-tck-findings.md`).

name: Official TCK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:41 UTC — catches upstream TCK drift.
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pin the harness so an upstream change cannot turn a green PR red without a
  # deliberate bump here. The nightly run below floats to `main` instead, so
  # drift is still surfaced — just not on contributors' PRs.
  A2A_TCK_REVISION: main

jobs:
  official-tck:
    name: a2a-tck conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Build the SUT
        run: cargo build --release -p a2a-tck-sut

      - name: Clone the official TCK
        run: |
          git clone --depth 1 --branch "$A2A_TCK_REVISION" \
            https://github.com/a2aproject/a2a-tck /tmp/a2a-tck

      - name: Install the TCK
        working-directory: /tmp/a2a-tck
        run: |
          uv venv
          uv pip install -e .

      - name: Start the SUT
        run: |
          # The SUT serves JSON-RPC and HTTP+JSON on :9999 and gRPC on :9998,
          # and advertises all three in its agent card. The TCK builds one
          # client per advertised interface, so this is what makes it grade
          # the gRPC binding at all — without it, 30 checks report SKIPPED.
          SUT_HOST=127.0.0.1:9999 SUT_GRPC_HOST=127.0.0.1:9998 \
            ./target/release/a2a-tck-sut &
          ready_http=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9999/.well-known/agent-card.json > /dev/null 2>&1; then
              ready_http=1
              break
            fi
            sleep 1
          done
          if [ "$ready_http" -ne 1 ]; then
            echo "SUT HTTP listener failed to start"
            exit 1
          fi
          # Fail loudly if gRPC is not listening. A silent miss here shows up
          # as SKIPPED requirements, which read as a coverage gap in the TCK
          # rather than a broken harness — the gate would stay green.
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9998) 2>/dev/null; then
              echo "SUT ready (http :9999, grpc :9998)"
              exit 0
            fi
            sleep 1
          done
          echo "SUT gRPC listener failed to start on :9998"
          exit 1

      # One full-suite run covers every level and emits the machine-readable
      # reports/compatibility.json the gate reads. A separate `--level must`
      # run was verified to produce an identical set of gated failures, so it
      # would only cost time.
      #
      # This step is EXPECTED to exit non-zero while open findings remain, so
      # its status is deliberately not the job's verdict — the gate step below
      # is. `|| true` is written here explicitly rather than via
      # `continue-on-error` so it is obvious at a glance that the next step is
      # what decides.
      - name: Run the official suite
        working-directory: /tmp/a2a-tck
        run: |
          set -o pipefail
          ./.venv/bin/python run_tck.py --sut-host http://127.0.0.1:9999 \
            2>&1 | tee /tmp/tck-full.log || true

      # THE GATE. Fails the job on any MUST-level failure not in the baseline,
      # and equally on any baseline entry that now passes — a baseline that is
      # allowed to rot is just `continue-on-error` with extra steps.
      #
      # A missing or malformed report is also a failure: a green check that
      # means "the suite never ran" is the exact bug this replaces.
      - name: Gate against the conformance baseline
        run: |
          python3 tck/scripts/check_conformance.py \
            --report /tmp/a2a-tck/reports/compatibility.json \
            --baseline tck/conformance-baseline.json 2>&1 | tee /tmp/tck-gate.log

      - name: Summarize
        if: always()
        run: |
          {
            echo '## Official a2a-tck conformance'
            echo
            echo '### Gate'
            echo '```'
            cat /tmp/tck-gate.log 2>/dev/null || echo 'gate did not run'
            echo '```'
            echo '### Suite output'
            echo '```'
            tail -n 3 /tmp/tck-full.log 2>/dev/null || echo 'no output'
            echo '```'
            echo
            echo 'Known failures are baselined in `tck/conformance-baseline.json`'
            echo 'and tracked in `docs/official-tck-findings.md`. The job is green'
            echo 'only when the failures match that baseline exactly.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TCK reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-tck-reports
          path: |
            /tmp/a2a-tck/reports/
            /tmp/tck-full.log
            /tmp/tck-gate.log
          if-no-files-found: ignore
