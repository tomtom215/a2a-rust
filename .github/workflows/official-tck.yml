# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 Tom F. <tomf@tomtomtech.net> (https://github.com/tomtom215)
#
# Official A2A conformance suite — a2aproject/a2a-tck.
#
# This is the A2A project's own Technology Compatibility Kit: language- and
# transport-agnostic, graded by RFC 2119 level (MUST / SHOULD / MAY). It
# discovers the agent card over HTTP and drives whichever bindings the card
# advertises.
#
# Why this job exists alongside the in-repo `tck.yml`: conformance graded by
# the project that owns the specification is worth more than conformance
# graded by the implementation being tested. The in-repo TCK still earns its
# keep — it runs this SDK's client against agents built on the official
# Python/JS/Go/Java SDKs, which the official TCK does not do — but where the
# two overlap, this one is authoritative.
#
# The SUT is `tck/sut`, which implements the messageId-keyed behaviour
# contract the TCK asserts (see that crate's module docs and
# `docs/official-tck-findings.md`).

name: Official TCK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:41 UTC — catches upstream TCK drift.
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The harness revision every run clones. This is deliberately a *floating*
  # `main`, and the trade-off is real: upstream drift is surfaced the moment it
  # lands, but it can also turn a contributor's green PR red for a reason that
  # has nothing to do with their change.
  #
  # An earlier version of this comment claimed the opposite — that the value
  # was pinned and only the nightly run floated. It never was: there is one
  # value here and every trigger uses it. Corrected 2026-08-09 rather than
  # quietly making the config match the story, because which behaviour is
  # wanted is a maintainer's call, not a cleanup. To actually pin, set a commit
  # SHA here and give the `schedule` trigger an override — note `git clone
  # --branch` below does not accept a SHA, so that also needs a clone + checkout.
  A2A_TCK_REVISION: main

jobs:
  official-tck:
    name: a2a-tck conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Build the SUT
        run: cargo build --release -p a2a-tck-sut

      - name: Clone the official TCK
        run: |
          git clone --depth 1 --branch "$A2A_TCK_REVISION" \
            https://github.com/a2aproject/a2a-tck /tmp/a2a-tck

      - name: Install the TCK
        working-directory: /tmp/a2a-tck
        run: |
          uv venv
          uv pip install -e .

      # Triangulate the method denominator against sources this project does
      # not own, while a fresh upstream clone is on disk.
      #
      # Several claims here are of the form "every A2A method is exercised".
      # That is only meaningful if the denominator is not this project's own
      # invention — a list the measured party writes about itself can be
      # trimmed until the numerator looks complete, and no reviewer can tell
      # from outside. So the set is checked three ways: the ratified
      # `a2a.proto` (whose vendored copies `check_proto_copies.sh` holds
      # byte-identical), the freshly cloned official suite, and this repo's
      # `Method` enum. All three must name the same methods.
      #
      # Runs here rather than in ci.yml because only this job has the upstream
      # clone. `a2a-protocol-types` also asserts the enum against the proto as
      # an ordinary unit test, so the two-source half is enforced on every PR;
      # this step adds the third source and catches upstream drift.
      #
      # Proven able to fail, 2026-08-11, by injection into a copy of
      # `method.rs`: an invented method -> exit 1 naming it; a removed method
      # -> exit 1 naming it. An unreadable or unparseable source exits 2 rather
      # than being scored as agreement.
      - name: Cross-check the method denominator (proto vs upstream TCK vs this repo)
        run: |
          # `--slimrpc` holds the SLIMRPC binding's own method inventory to the
          # same denominator. It is deliberately NOT a conformance claim: the
          # official TCK cannot grade that binding, because the TCK has no
          # dependency on `a2a-protocol-*` by design (a kit that imports the
          # implementation it grades shares its misreadings) and no independent
          # SLIM client exists to write one against. This arm answers only the
          # narrower question that leaves open — whether the binding still
          # claims all eleven methods — so a method quietly vanishing from its
          # inventory fails here rather than going unnoticed. Behaviour on the
          # wire is the binding's own e2e suite's job.
          python3 scripts/check_method_denominator.py \
            --proto proto/a2a_v1/a2a.proto \
            --rust crates/a2a-protocol-types/src/method.rs \
            --slimrpc bindings/a2a-protocol-slimrpc/src/lib.rs \
            --slimrpc-spec spec/slimrpc_v1/slimrpc.md \
            --tck /tmp/a2a-tck

      # The binding claims to implement the SLIMRPC specification. That claim
      # referenced a URL until the spec was vendored, so nothing here could
      # check it and nothing would notice upstream moving. This job already has
      # network (it clones the upstream TCK), which is why the drift check lives
      # here rather than in the offline Format job.
      - name: Vendored SLIMRPC spec still matches upstream
        run: ./scripts/check_slimrpc_spec.sh

      - name: Start the SUT
        run: |
          # The SUT serves JSON-RPC and HTTP+JSON on :9999 and gRPC on :9998,
          # and advertises all three in its agent card. The TCK builds one
          # client per advertised interface, so this is what makes it grade
          # the gRPC binding at all — without it, 30 checks report SKIPPED.
          SUT_HOST=127.0.0.1:9999 SUT_GRPC_HOST=127.0.0.1:9998 \
            ./target/release/a2a-tck-sut &
          ready_http=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9999/.well-known/agent-card.json > /dev/null 2>&1; then
              ready_http=1
              break
            fi
            sleep 1
          done
          if [ "$ready_http" -ne 1 ]; then
            echo "SUT HTTP listener failed to start"
            exit 1
          fi
          # Fail loudly if gRPC is not listening. A silent miss here shows up
          # as SKIPPED requirements, which read as a coverage gap in the TCK
          # rather than a broken harness — the gate would stay green.
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9998) 2>/dev/null; then
              echo "SUT ready (http :9999, grpc :9998)"
              exit 0
            fi
            sleep 1
          done
          echo "SUT gRPC listener failed to start on :9998"
          exit 1

      # One full-suite run covers every level and emits the machine-readable
      # reports/compatibility.json the gate reads. A separate `--level must`
      # run was verified to produce an identical set of gated failures, so it
      # would only cost time.
      #
      # This step is EXPECTED to exit non-zero while open findings remain, so
      # its status is deliberately not the job's verdict — the gate step below
      # is. `|| true` is written here explicitly rather than via
      # `continue-on-error` so it is obvious at a glance that the next step is
      # what decides.
      #
      # The report is copied out immediately. Every run writes the same
      # `reports/compatibility.json`, so the later minimal and extension runs
      # overwrite it — without this copy, both the gate below and the uploaded
      # artifact would silently describe whichever profile ran last.
      - name: Run the official suite
        working-directory: /tmp/a2a-tck
        run: |
          set -o pipefail
          ./.venv/bin/python run_tck.py --sut-host http://127.0.0.1:9999 \
            2>&1 | tee /tmp/tck-full.log || true
          cp reports/compatibility.json /tmp/full-compatibility.json

      # THE GATE. Fails the job on any MUST-level failure not in the baseline,
      # and equally on any baseline entry that now passes — a baseline that is
      # allowed to rot is just `continue-on-error` with extra steps.
      #
      # A missing or malformed report is also a failure: a green check that
      # means "the suite never ran" is the exact bug this replaces.
      #
      # `--min-graded` closes the remaining hole in that argument. The
      # differential check above compares *failures*, and a run that graded
      # nothing has none — so an all-SKIPPED report scored exactly the same as
      # a perfectly conformant one, and this step printed "OK". Verified by
      # running the gate against a synthetic all-SKIPPED report and against an
      # empty one: both exited 0 before this flag existed.
      #
      # 88 is measured, not chosen: the full profile grades 88 of the suite's
      # 114 MUST requirements (the other 26 are 5 SKIPPED + 21 NOT TESTED —
      # see docs/official-tck-findings.md §1). It is a floor, not an equality,
      # so upstream adding MUST tests does not turn this red. A *drop* is the
      # signal — diagnose it, do not lower the floor to go green.
      #
      # `set -o pipefail` is the load-bearing line, not boilerplate. Without
      # it this entire gate was decorative, from the day the `| tee` was added
      # until 2026-08-10.
      #
      # GitHub's default shell for a `run:` step with no `shell:` key is
      # `bash -e {0}` — `-e` but NOT `-o pipefail`. (The `shell: bash` spelling
      # is what gets `-eo pipefail`; release.yml uses that form.) So the step's
      # exit status was `tee`'s, which is 0 whatever the checker decided. The
      # checker exited 1 correctly and the step reported success.
      #
      # Measured, not deduced. Against a synthetic all-SKIPPED report the
      # checker exits 1 and prints "UNDER-MEASURED — 0 MUST requirement(s)
      # graded"; against a report with an injected MUST failure it exits 1 and
      # prints "REGRESSION". Both step bodies exited 0 before this line.
      #
      # The irony is worth recording: `--min-graded` was added specifically to
      # stop a zero-measurement run passing this gate, and the pipe meant that
      # protection could never fire either. A guard behind a broken gate is not
      # a guard. scripts/prove_workflow_gates_fail.py now proves this step can
      # actually fail, so it cannot regress silently again.
      - name: Gate against the conformance baseline
        run: |
          set -o pipefail
          python3 tck/scripts/check_conformance.py \
            --report /tmp/full-compatibility.json \
            --baseline tck/conformance-baseline.json \
            --min-graded 88 2>&1 | tee /tmp/tck-gate.log

      - name: Summarize
        if: always()
        run: |
          {
            echo '## Official a2a-tck conformance'
            echo
            echo '### Gate'
            echo '```'
            cat /tmp/tck-gate.log 2>/dev/null || echo 'gate did not run'
            echo '```'
            echo '### Suite output'
            echo '```'
            tail -n 3 /tmp/tck-full.log 2>/dev/null || echo 'no output'
            echo '```'
            echo
            echo 'Known failures are baselined in `tck/conformance-baseline.json`'
            echo 'and tracked in `docs/official-tck-findings.md`. The job is green'
            echo 'only when the failures match that baseline exactly.'
          } >> "$GITHUB_STEP_SUMMARY"

      # A second run against a deliberately less-capable card. CORE-CAP-001,
      # CORE-CAP-002 and CORE-CAP-004 check that a server *rejects* push and
      # streaming operations it never advertised, and the suite skips them
      # against an agent that does advertise them — so one SUT cannot reach
      # both sides. This run is what makes those requirements observable.
      #
      # This step used to carry BOTH `continue-on-error: true` and `|| true`,
      # because one HTTP+JSON check errors under this profile from inside the
      # suite's own client. Both blanket waivers are now gone: the single
      # offending test is deselected by name, and everything else in the
      # minimal profile is a hard gate again.
      #
      # Why deselecting it is not a coverage loss, and not a papered-over
      # failure (full evidence in docs/official-tck-findings.md §17):
      #   * The requirement it belongs to, HTTP_JSON-SSE-001, is graded PASS
      #     by the full-profile run above — the one the gate runs against. It
      #     is measured; it is just measured there rather than here.
      #   * The error is a proven defect in the harness, not in this SDK.
      #     `_extract_error` in the suite's http_json client calls
      #     `response.json()` on a streamed response it closed without
      #     reading, and catches only (JSONDecodeError, ValueError) —
      #     `httpx.ResponseNotRead` is a RuntimeError, so it escapes, and the
      #     `response.text` fallback fails the same way. Reproduced against a
      #     bare `http.server` returning 400, with no A2A SDK on either side.
      #   * Any conformant server reaches it: returning non-2xx to
      #     `message:stream` with streaming unadvertised is exactly what
      #     CORE-CAP-002 requires, and CORE-CAP-002 passes here.
      # Reported upstream 2026-08-07 as a2aproject/a2a-tck#225:
      #   https://github.com/a2aproject/a2a-tck/issues/225
      # Remove the --deselect once that lands.
      - name: Run the suite against the minimal-capability profile
        run: |
          SUT_PROFILE=minimal SUT_HOST=127.0.0.1:9997 SUT_GRPC_HOST=127.0.0.1:9996 \
            ./target/release/a2a-tck-sut &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9997/.well-known/agent-card.json > /dev/null 2>&1 && break
            sleep 1
          done
          cd /tmp/a2a-tck
          # Without pipefail the `|| suite_status=$?` below can never fire —
          # the pipeline's status is `tee`'s. The `exit "$suite_status"` at the
          # end of this step was therefore always 0, which made the comment
          # above ("everything else in the minimal profile is a hard gate
          # again") untrue for suite-level failures. Requirement-level ones
          # were still caught by the un-piped gate step that follows.
          set -o pipefail
          suite_status=0
          ./.venv/bin/python run_tck.py --sut-host http://127.0.0.1:9997 -- \
            --deselect "tests/compatibility/core_operations/test_transport_behavior.py::TestRestStreaming::test_streaming_content_type" \
            2>&1 | tee /tmp/tck-minimal.log || suite_status=$?
          # Copy the report before propagating the suite's status, so the
          # requirement-level gate below can still say precisely what broke.
          cp reports/compatibility.json /tmp/minimal-compatibility.json
          exit "$suite_status"

      # `always()` so a suite-level failure above still gets a
      # requirement-level diagnosis rather than just a red X.
      # Floor of 66 measured the same way as the full profile's 88: the
      # less-capable card means the suite legitimately skips more, so this
      # profile grades 66 of 114 MUSTs.
      - name: Gate the minimal-profile run
        if: always()
        run: |
          python3 tck/scripts/check_conformance.py \
            --report /tmp/minimal-compatibility.json \
            --baseline tck/conformance-baseline.json \
            --min-graded 66

      # A third profile, for exactly one requirement. CORE-CAP-004 asserts that
      # a server advertising an extension with `required: true` rejects a
      # request that does not declare support for it. Neither the full nor the
      # minimal card declares such an extension, so under both of those the
      # requirement records SKIPPED and is never graded.
      #
      # Why this run is scoped with `-k` rather than run whole:
      # required-extension enforcement is per-request (spec §3.3.4), and this
      # SDK implements it that way. The suite does not send `A2A-Extensions`
      # activation on its ordinary positive requests — upstream
      # a2aproject/a2a-tck#193, still open as of the pin in A2A_TCK_REVISION —
      # so an unscoped run against this card answers every other CORE-* check
      # with ExtensionSupportRequiredError. Measured, not guessed: the
      # unscoped run produces 72 failures.
      #
      # This is scoping, not a waiver. Every requirement excluded here is
      # graded by the full-profile run above, which is the one the baseline
      # gate reads. Upstream notes other SDKs pass this requirement with a
      # `sitecustomize.py` shim that patches the harness into sending the
      # header; that changes the suite rather than the SUT, and is not used.
      - name: Run the suite against the required-extension profile
        run: |
          SUT_PROFILE=extension SUT_HOST=127.0.0.1:9995 SUT_GRPC_HOST=127.0.0.1:9994 \
            ./target/release/a2a-tck-sut &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9995/.well-known/agent-card.json > /dev/null 2>&1 && break
            sleep 1
          done
          cd /tmp/a2a-tck
          # Same masking as the minimal step above; same fix.
          set -o pipefail
          suite_status=0
          ./.venv/bin/python run_tck.py --sut-host http://127.0.0.1:9995 -- \
            -k "TestCapabilityExtensionRequired" \
            2>&1 | tee /tmp/tck-extension.log || suite_status=$?
          cp reports/compatibility.json /tmp/extension-compatibility.json
          exit "$suite_status"

      # `--require-pass` is load-bearing here, not decoration. A scoped run
      # that selects zero tests reports zero failures, which the differential
      # gate alone would accept as success — the exact shape of green check
      # this repo refuses to ship. Requiring CORE-CAP-004 to be graded PASS
      # means an upstream rename of the test class turns the job red instead.
      - name: Gate the required-extension run
        if: always()
        run: |
          python3 tck/scripts/check_conformance.py \
            --report /tmp/extension-compatibility.json \
            --baseline tck/conformance-baseline.json \
            --require-pass CORE-CAP-004

      - name: Upload TCK reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-tck-reports
          path: |
            /tmp/a2a-tck/reports/
            /tmp/tck-full.log
            /tmp/tck-gate.log
            /tmp/tck-minimal.log
            /tmp/tck-extension.log
            /tmp/full-compatibility.json
            /tmp/minimal-compatibility.json
            /tmp/extension-compatibility.json
          if-no-files-found: ignore
