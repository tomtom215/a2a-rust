#
# Upstream Integration Testing Kit (a2aproject/a2a-itk) — current-mount runs.
#
# The upstream ITK verifies cross-SDK compatibility through multi-hop
# traversal scenarios (JSON-RPC, gRPC, HTTP+JSON; plain, streaming, push
# notification, resubscribe). This workflow clones the ITK, mounts this
# repository as the `current` agent (the ITK detects `<repo>/itk/Cargo.toml`
# and runs the itk-current-agent binary), and executes every scenario that
# involves `current` against the official Python v1.0 baseline agent.
#
# This is the Python/Go SDKs' "current mount" CI pattern applied to Rust —
# the strongest interop signal available: our agent traversing with agents
# built on the official reference SDKs, under the LF's own test harness.

name: ITK (upstream current-mount)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 04:17 UTC — catches upstream ITK/baseline drift.
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  A2A_ITK_REVISION: main

jobs:
  itk-traversal-selftest:
    name: ITK traversal self-test (in-repo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: itk

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install self-test deps
        run: pip install httpx grpcio-tools

      - name: Build the ITK current agent
        run: cargo build --release
        working-directory: itk

      # Deterministic in-repo counterpart to the upstream current-mount run:
      # drives the agent with the exact ITK protobuf instruction contract
      # over every transport (send, streaming, multi-hop, series, hold,
      # resubscribe) without needing the full ITK cluster.
      - name: Run traversal self-test
        run: |
          ./itk/target/release/itk-current-agent --httpPort 10110 --grpcPort 11010 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:10110/.well-known/agent-card.json > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          python itk/interop/itk_traversal_selftest.py http://127.0.0.1:10110

  itk-current-mount:
    name: ITK current vs python_v10 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Informational cross-check, not a merge gate. This job drives our agent
    # through the *real* upstream ITK against the official python_v10
    # baseline, but its success depends on the upstream a2a-itk project's own
    # environment (its pinned baseline SDK, its `uv`-managed venv, its mock
    # notification server). The deterministic in-repo `itk-traversal-selftest`
    # job above is the authoritative gate; this one surfaces upstream interop
    # signal without letting upstream flakiness block a release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            itk

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Clone upstream ITK
        run: |
          git clone --depth 1 --branch "$A2A_ITK_REVISION" \
            https://github.com/a2aproject/a2a-itk /tmp/a2a-itk

      # The ITK spawns its baseline agents and mock notification server via
      # `uv run` (see test_suite/*.py), so `uv` must be installed and the
      # ITK's own environment synced from its pinned lockfile.
      - name: Install uv and sync the ITK environment
        run: |
          python -m pip install --upgrade pip uv
          uv sync
        working-directory: /tmp/a2a-itk

      - name: Mount this repository as the current agent
        run: ln -sfn "$GITHUB_WORKSPACE" /tmp/a2a-itk/agents/repo

      - name: Pre-build the current agent
        run: cargo build --release
        working-directory: itk

      # Runs every upstream scenario involving the `current` SDK (multi-hop
      # send/streaming/push/resubscribe against the python_v10 baseline over
      # JSONRPC, gRPC, and HTTP+JSON).
      # The filter keeps a scenario only when ALL of its SDKs are listed, so
      # both `current` and the baseline must be named.
      - name: Run ITK current-mount scenarios
        run: uv run python run_tests.py --sdks current,python_v10
        working-directory: /tmp/a2a-itk

      - name: Upload ITK logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: itk-logs
          path: /tmp/a2a-itk/logs/
          if-no-files-found: ignore
