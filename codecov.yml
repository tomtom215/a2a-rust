# SPDX-License-Identifier: Apache-2.0
# Codecov configuration — https://docs.codecov.io/docs/codecov-yaml
#
# Policy: coverage is a guarded dashboard, not a hard merge gate. The two
# status checks below are reported on every PR; whether they block merge is
# decided by the branch-protection required-checks list (see
# .github/workflows/README.md). Test *effectiveness* is gated separately by
# mutation testing (.github/workflows/mutants.yml), which is stricter than
# any line-coverage threshold.

coverage:
  status:
    project:
      default:
        # Fail the status if overall coverage drops more than 1% below the
        # base commit. 1% absorbs run-to-run noise from async/timing-dependent
        # paths while making sustained erosion visible immediately.
        target: auto
        threshold: 1%
    patch:
      default:
        # New / changed lines in a PR must be at least 75% covered (±5% for
        # uninstrumentable lines). Raised from 50%, which let half-tested
        # patches pass without comment.
        target: 75%
        threshold: 5%

ignore:
  # TCK is test infrastructure, not library code.
  - "tck/**"
  # The seven PostgreSQL store files are NOT excluded, and the history of
  # trying to exclude them is worth keeping.
  #
  # They only execute against a live PostgreSQL server. From 2026-08-06 to
  # 2026-09-09 this list tried to exclude them from the dashboard instead —
  # first as bare paths, then with a `**/` prefix — and neither shape ever
  # took: measured against Codecov's own API on 2026-08-19, all five listed
  # files were still in the report at 0.00%-8.06%, two newer files had never
  # been listed, and one pattern named a path that no longer existed. Those
  # seven files were 957 of 35,287 counted lines and 881 of 2,096 missed
  # lines — 42% of every uncovered line in the repository — which put the
  # badge at 94.06% while the honest figure was 96.46%.
  #
  # Resolved 2026-09-09 by measuring them rather than hiding them:
  # coverage.yml now runs the same live-database suites the `test-postgres`
  # CI job runs (`postgres_store_tests` and `multi_replica`) under
  # instrumentation against a postgres:16 service, and the profiles merge
  # into one report. Measured locally the same way before upload: the seven
  # files at 84.87% line coverage in aggregate (up from 0-8%), with the
  # tenant-aware stores' list, delete and count paths covered by tests added
  # the same day. `scripts/check_codecov_ignores.py` remains the instrument
  # for any pattern that is listed here: it fails on an entry Codecov is
  # still counting, so a future exclusion cannot be recorded as applied
  # without being applied. Since 2026-09-10 coverage.yml runs it weekly
  # (`ignores-applied`); before that, nothing ran it.
  # Examples are not library code.
  - "examples/**"
  # ITK (interop test kit) agents are not library code.
  - "itk/**"
