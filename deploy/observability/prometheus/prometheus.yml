#
# Prometheus for a2a-rust agents that push OTLP straight to Prometheus.
# Start Prometheus with `--web.enable-otlp-receiver` and point each agent at
# it:
#
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://prometheus:9090/api/v1/otlp
#   OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
#   OTEL_TRACES_EXPORTER=none OTEL_LOGS_EXPORTER=none
#
# (or send all three signals to an OpenTelemetry Collector and use
# prometheus-collector.yml beside this file). README.md in the directory
# above says how this file and the rules were tested.
#
# Flags worth passing with it (the compose stack does):
#   --enable-feature=otlp-deltatocumulative  an agent exporting delta
#     temporality is otherwise refused (HTTP 500, "invalid temporality and
#     type combination") and its series never appear (audit C-21);
#   --enable-feature=created-timestamp-zero-ingestion  a zero at each
#     point's start time, so a process that exported once has a rate (L11);
#   --enable-feature=exemplar-storage  keeps exemplars (C-05).
# prometheus-compose.yml is this file plus the compose stack's Alertmanager
# and scrape jobs; scripts/check_stack.py fails if the shared parts differ.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # Each agent's OTEL_SERVICE_NAME becomes `job` and its
  # service.instance.id `instance` without promotion; these are promoted
  # too so dashboards can group by them.
  promote_resource_attributes:
    - service.version
    - deployment.environment.name
  translation_strategy: UnderscoreEscapingWithSuffixes

storage:
  tsdb:
    # OTLP pushes arrive out of order under retries; accept 30 minutes.
    out_of_order_time_window: 30m
    # Whichever comes first: seven days, or 5 GB of blocks (audit C-19). The
    # size bound keeps a burst of new series from filling the disk.
    retention:
      time: 7d
      size: 5GB

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
