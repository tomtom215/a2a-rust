#
# OpenTelemetry Collector (otelcol-contrib) in front of Prometheus: agents
# send all three signals here over OTLP, and Prometheus scrapes the metrics
# from the Prometheus exporter (../prometheus/prometheus-collector.yml).
# Point the agents at it:
#
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
#
# 4318 is OTLP over HTTP/protobuf, the specification's default protocol and
# Telemetry's; for 4317 also set OTEL_EXPORTER_OTLP_PROTOCOL=grpc.
#
# Traces and logs go to the `debug` exporter here; replace it with your
# tracing and log backends. The Collector's `otlp` exporter speaks gRPC;
# Langfuse takes OTLP over HTTP only, so forward to it with `otlphttp` and its
# two headers (book: Deployment > Langfuse).

# Hardening, as the Collector's own guidance has it: `memory_limiter` first in
# every pipeline, so a burst is refused (the agent retries) rather than the
# Collector killed for memory; its limits are a share of the container's
# memory limit, so give the container one. `health_check` answers on 13133
# for a liveness or readiness probe (`GET /` is 200 once the pipelines run).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Names as Prometheus's own OTLP receiver writes them, so one set of
    # rules and dashboards serves both paths.
    translation_strategy: UnderscoreEscapingWithSuffixes
    resource_to_telemetry_conversion:
      enabled: false
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
