#
# The Collector of docker-compose.yml: all three signals in on OTLP (4317
# gRPC, 4318 HTTP), each sent on to the backend that stores it. Metrics go to
# Prometheus's OTLP receiver, so `service.name` and `service.instance.id`
# become `job` and `instance` exactly as when an agent pushes to Prometheus
# directly, and the dashboards and rules need no change. Exemplars ride along
# with the metric points they belong to, and Prometheus (exemplar-storage)
# keeps them. Traces go to Tempo, logs to Loki. `config.yaml` beside this file
# is the Collector on its own (metrics scraped on 8889, traces and logs to the
# debug exporter).
#
# Hardening, as the Collector's own guidance has it: `memory_limiter` first in
# every pipeline, so a burst is refused (the agent retries) rather than the
# Collector killed for memory; its limits are a share of the container's
# memory limit, which docker-compose.yml sets (1 GiB). `health_check` answers
# on 13133 for a liveness or readiness probe (`GET /` is 200 once the
# pipelines run). Each exporter's queue is kept on disk (`file_storage`), so a
# restart sends what was queued instead of dropping it.
#
# The Collector watches itself (audit C-15): its own metrics are served on
# 8888 in the Prometheus format, Prometheus scrapes them (job
# `otelcol`, prometheus-compose.yml), and rules/stack-alerts.yml pages
# on sends that fail, data refused, a queue filling up, or the Collector gone.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
    sending_queue:
      storage: file_storage/queue
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      storage: file_storage/queue
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    sending_queue:
      storage: file_storage/queue

service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
