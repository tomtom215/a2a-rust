#
# Grafana Tempo, single binary, local storage: the trace backend of
# docker-compose.yml. The Collector forwards spans to it over OTLP/gRPC; Grafana
# reads them on 3200. Not a production configuration: traces live in the
# container's volume and are kept for 24 hours.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
compactor:
  compaction:
    block_retention: 24h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
