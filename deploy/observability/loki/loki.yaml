#
# Grafana Loki, single binary, local storage: the log backend of
# docker-compose.yml. The Collector sends log records to its OTLP endpoint
# (/otlp/v1/logs); the trace and span ids each record carries are kept as
# structured metadata, which is what lets Grafana jump from a log line to its
# trace. Not a production configuration.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
analytics:
  reporting_enabled: false
