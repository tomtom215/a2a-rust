apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-a2a-genai
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: a2a-rust
  annotations:
    grafana_folder: A2A
data:
  a2a-genai.json: |
    {
      "uid": "a2a-genai",
      "title": "A2A agents: GenAI",
      "description": "The SDK tool loop's model calls, tokens, tool calls and agent runs, from the OpenTelemetry GenAI metrics it emits (server::tool_loop; the book's observability page lists them). Queries the raw series; a deployment that keeps them long can add recording rules beside prometheus/rules/a2a-recording.yml.",
      "tags": [
        "a2a",
        "a2a-rust",
        "genai"
      ],
      "editable": true,
      "schemaVersion": 41,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "version": 1,
      "templating": {
        "list": [
          {
            "name": "job",
            "label": "Agent (service.name)",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "a2a-prometheus"
            },
            "query": {
              "query": "label_values(target_info, job)",
              "refId": "job-q"
            },
            "definition": "label_values(target_info, job)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          },
          {
            "name": "instance",
            "label": "Instance",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "a2a-prometheus"
            },
            "query": {
              "query": "label_values(target_info{job=~\"$job\"}, instance)",
              "refId": "instance-q"
            },
            "definition": "label_values(target_info{job=~\"$job\"}, instance)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Model calls",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Model calls per second, by model and outcome",
          "description": "One per model turn the tool loop made (gen_ai.client.inference.duration's count). error_type is ok for a turn that succeeded, else the provider error: the HTTP status, timeout, transport, invalid_response, response_too_large, configuration, cancelled.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "label_replace(sum by (gen_ai_request_model, error_type) (rate(gen_ai_client_inference_duration_seconds_count{job=~\"$job\"}[5m])), \"error_type\", \"ok\", \"error_type\", \"\")",
              "legendFormat": "{{gen_ai_request_model}} {{error_type}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Failed model calls (ratio)",
          "description": "Model turns that failed, as a share of all turns.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "sum(rate(gen_ai_client_inference_duration_seconds_count{job=~\"$job\", error_type!=\"\"}[5m])) / sum(rate(gen_ai_client_inference_duration_seconds_count{job=~\"$job\"}[5m]))",
              "legendFormat": "failed"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "axisSoftMax": 0.1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Model call duration, successful calls",
          "description": "gen_ai.client.inference.duration of the turns that succeeded, per requested model: the provider's time to answer, tool calls excluded.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le, gen_ai_request_model) (rate(gen_ai_client_inference_duration_seconds_bucket{job=~\"$job\", error_type=\"\"}[5m])))",
              "legendFormat": "p50 {{gen_ai_request_model}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(gen_ai_client_inference_duration_seconds_bucket{job=~\"$job\", error_type=\"\"}[5m])))",
              "legendFormat": "p95 {{gen_ai_request_model}}"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le, gen_ai_request_model) (rate(gen_ai_client_inference_duration_seconds_bucket{job=~\"$job\", error_type=\"\"}[5m])))",
              "legendFormat": "p99 {{gen_ai_request_model}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "type": "row",
          "title": "Tokens",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": []
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Tokens per second, input and output",
          "description": "gen_ai.client.inference.usage.{input,output}_tokens, as the provider reported them; a turn whose response carried no usage adds nothing.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "sum by (gen_ai_request_model) (rate(gen_ai_client_inference_usage_input_tokens_total{job=~\"$job\"}[5m]))",
              "legendFormat": "input {{gen_ai_request_model}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "sum by (gen_ai_request_model) (rate(gen_ai_client_inference_usage_output_tokens_total{job=~\"$job\"}[5m]))",
              "legendFormat": "output {{gen_ai_request_model}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Tokens per model call",
          "description": "gen_ai.client.inference.operation.{input,output}_tokens: the prompt a turn sent (it grows with each tool round) and the completion it got back.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(gen_ai_client_inference_operation_input_tokens_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p50 input"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gen_ai_client_inference_operation_input_tokens_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p95 input"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(gen_ai_client_inference_operation_output_tokens_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p50 output"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gen_ai_client_inference_operation_output_tokens_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p95 output"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Tool calls",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Tool calls per second, by tool and outcome",
          "description": "One per tool call that ran (gen_ai.execute_tool.duration's count). error_type: unknown_tool, invalid_arguments, tool_error (returned to the model, which may recover), tool_fatal (ends the run), cancelled; ok when the tool answered.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "label_replace(sum by (gen_ai_tool_name, error_type) (rate(gen_ai_execute_tool_duration_seconds_count{job=~\"$job\"}[5m])), \"error_type\", \"ok\", \"error_type\", \"\")",
              "legendFormat": "{{gen_ai_tool_name}} {{error_type}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Tool call duration",
          "description": "gen_ai.execute_tool.duration per tool, every outcome.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le, gen_ai_tool_name) (rate(gen_ai_execute_tool_duration_seconds_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p50 {{gen_ai_tool_name}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, gen_ai_tool_name) (rate(gen_ai_execute_tool_duration_seconds_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p95 {{gen_ai_tool_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "Agent runs",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "panels": []
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Agent runs per second, by outcome",
          "description": "One per run of the tool loop (gen_ai.invoke_agent.duration's count). error_type: the model's error when a turn failed, tool_fatal, turn_limit, budget_exhausted, cancelled; ok for a run that answered.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 36
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "label_replace(sum by (error_type) (rate(gen_ai_invoke_agent_duration_seconds_count{job=~\"$job\"}[5m])), \"error_type\", \"ok\", \"error_type\", \"\")",
              "legendFormat": "{{error_type}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Agent run duration",
          "description": "gen_ai.invoke_agent.duration of every run: model turns and tool calls together.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 36
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(gen_ai_invoke_agent_duration_seconds_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gen_ai_invoke_agent_duration_seconds_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Model calls and tool calls per run",
          "description": "gen_ai.invoke_agent.inference_calls and .tool_calls: how many rounds a run took. A rising p95 is a model looping on its tools.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 44
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(gen_ai_invoke_agent_inference_calls_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p50 model calls"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gen_ai_invoke_agent_inference_calls_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p95 model calls"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(gen_ai_invoke_agent_tool_calls_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p50 tool calls"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gen_ai_invoke_agent_tool_calls_bucket{job=~\"$job\"}[5m])))",
              "legendFormat": "p95 tool calls"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-a2a-server
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: a2a-rust
  annotations:
    grafana_folder: A2A
data:
  a2a-server.json: |
    {
      "uid": "a2a-server",
      "title": "A2A server",
      "description": "Rate, errors and duration of A2A calls served by a2a-rust agents, per binding and method, with the event-queue, push-delivery, persistence, task-store and connection-pool signals. Built on deploy/observability/prometheus/rules/a2a-recording.yml.",
      "tags": [
        "a2a",
        "a2a-rust"
      ],
      "editable": true,
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "job",
            "label": "Agent (service.name)",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "a2a-prometheus"
            },
            "query": {
              "query": "label_values(target_info, job)",
              "refId": "job-q"
            },
            "definition": "label_values(target_info, job)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          },
          {
            "name": "instance",
            "label": "Instance",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "a2a-prometheus"
            },
            "query": {
              "query": "label_values(target_info{job=~\"$job\"}, instance)",
              "refId": "instance-q"
            },
            "definition": "label_values(target_info{job=~\"$job\"}, instance)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Calls",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Calls per second, by binding",
          "description": "rpc.server.call.duration count rate, every A2A method, by rpc.system.name.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "sum by (rpc_system_name) (a2a:rpc_server_calls:rate5m{job=~\"$job\"})",
              "legendFormat": "{{rpc_system_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Failed calls (ratio)",
          "description": "The server's failed calls over all calls: error.type set, other than a call the client abandoned or one refused as the caller's mistake (a status A2A maps to a 4xx, such as a JSON-RPC TaskNotFound). The ratio A2AServerErrorRatioHigh pages on.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "a2a:rpc_server_error_ratio:rate5m{job=~\"$job\"}",
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "axisSoftMax": 0.1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Calls per second, by method",
          "description": "By rpc.method (lf.a2a.v1.A2AService/<Method>).",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "label_replace(sum by (rpc_method) (a2a:rpc_server_calls:rate5m{job=~\"$job\"}), \"rpc_method\", \"(unrouted)\", \"rpc_method\", \"\")",
              "legendFormat": "{{rpc_method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Failed calls per second, by method and binding",
          "description": "The server's failed calls, as in the ratio beside it: caller mistakes and abandoned calls are not counted.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "label_replace(sum by (rpc_method, rpc_system_name) (a2a:rpc_server_errors:rate5m{job=~\"$job\"}), \"rpc_method\", \"(unrouted)\", \"rpc_method\", \"\")",
              "legendFormat": "{{rpc_method}} {{rpc_system_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Caller errors per second, by method and binding",
          "description": "Calls refused as the caller's mistake, on every binding: a JSON-RPC code A2A maps to a 4xx (TaskNotFound -32001, invalid params -32602, ...), an HTTP 4xx, a gRPC NOT_FOUND or INVALID_ARGUMENT. Not failures of the server; a client polling for tasks retention removed shows here.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "label_replace(sum by (rpc_method, rpc_system_name) (a2a:rpc_server_caller_errors:rate5m{job=~\"$job\"}), \"rpc_method\", \"(unrouted)\", \"rpc_method\", \"\")",
              "legendFormat": "{{rpc_method}} {{rpc_system_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Server span duration (p95), from traces",
          "description": "From Tempo's span metrics (tempo.yaml, metrics_generator), by span name. The diamonds are exemplars: each is one span, and its trace_id opens the trace in Tempo. Needs traces sent to Tempo; the SDK's own metrics carry no exemplars (OpenTelemetry Rust 0.33).",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, span_name) (rate(traces_spanmetrics_latency_bucket{service=~\"$job\", span_kind=\"SPAN_KIND_SERVER\"}[5m])))",
              "legendFormat": "{{span_name}}",
              "exemplar": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "row",
          "title": "Duration (non-streaming calls)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 25
          },
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "p50 / p95 / p99",
          "description": "Quantiles of non-streaming calls; a streaming call lasts as long as its stream. Interpolated inside a bucket: the default buckets jump from 1 s to 5 s, so a value between them is a straight-line estimate. A2AUnaryLatencyHigh reads the 5 s bucket bound instead.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "label_replace(max by (rpc_method) (a2a:rpc_server_unary_latency:p50_5m{job=~\"$job\"}), \"rpc_method\", \"(unrouted)\", \"rpc_method\", \"\")",
              "legendFormat": "p50 {{rpc_method}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "label_replace(max by (rpc_method) (a2a:rpc_server_unary_latency:p95_5m{job=~\"$job\"}), \"rpc_method\", \"(unrouted)\", \"rpc_method\", \"\")",
              "legendFormat": "p95 {{rpc_method}}"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "label_replace(max by (rpc_method) (a2a:rpc_server_unary_latency:p99_5m{job=~\"$job\"}), \"rpc_method\", \"(unrouted)\", \"rpc_method\", \"\")",
              "legendFormat": "p99 {{rpc_method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "A2A server signals",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Errors by method and kind",
          "description": "a2a.server.errors by A2A method and error kind.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "sum by (method, error) (a2a:server_errors_by_kind:rate5m{job=~\"$job\"})",
              "legendFormat": "{{method}} {{error}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Requests without a response",
          "description": "a2a.server.requests minus a2a.server.responses: panics, dropped connections, exits mid-request. A request counts when it arrives and its response when it finishes, so while long calls run the value swings either side of zero; a value that stays above zero is the signal.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 35
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "a2a:server_unanswered:rate5m{job=~\"$job\", instance=~\"$instance\"}",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Active event queues",
          "description": "a2a.server.queue_depth: one per open stream. A depth that never comes down is subscribers that stopped reading.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 43
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "a2a_server_queue_depth{job=~\"$job\", instance=~\"$instance\"}",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Persistence errors",
          "description": "Task writes the background processor could not persist. Any non-zero rate means stored state and what clients saw diverged.",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 43
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "sum by (operation, error) (rate(a2a_server_persistence_errors_total{job=~\"$job\"}[5m]))",
              "legendFormat": "{{operation}} {{error}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Push deliveries, by outcome",
          "description": "delivered / failed / timeout / timeout_truncated / dropped (a task's push lane full behind a slow webhook).",
          "datasource": {
            "type": "prometheus",
            "uid": "a2a-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 51
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "a2a-prometheus"
              },
              "expr": "sum by (outcome) (a2a:push_deliveries:rate5m{job=~\"$job\"})",
              "legendFormat": "{{outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
