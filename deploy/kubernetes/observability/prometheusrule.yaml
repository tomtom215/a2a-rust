# GENERATED by deploy/observability/scripts/check_stack.py --write-kubernetes.
# Do not edit: change the sources and regenerate (CI fails when this file
# and its sources disagree). Sources:
#   deploy/observability/prometheus/rules/a2a-alerts.yml
#   deploy/observability/prometheus/rules/a2a-recording.yml
#   deploy/observability/prometheus/rules/stack-alerts.yml
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: a2a-rust
  labels:
    app.kubernetes.io/part-of: a2a-rust
spec:
  groups:
  - name: a2a-alerts
    rules:
    - alert: A2AServerErrorRatioHigh
      expr: |
        a2a:rpc_server_error_ratio:rate5m > 0.05
          and on (job)
        sum by (job) (a2a:rpc_server_calls:rate5m) > 0.1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}: {{ $value | humanizePercentage }} of A2A calls failed over 5m'
        description: 'More than 5% of calls to {{ $labels.job }} failed for 10 minutes while the job took more than 0.1 calls a second. Failed means the server''s failure: error_type set, other than a call the client abandoned or one refused as the caller''s mistake (a status A2A maps to a 4xx, such as TaskNotFound -32001). Split by rpc_method and rpc_system_name with a2a:rpc_server_errors:rate5m; caller mistakes are a2a:rpc_server_caller_errors:rate5m.'
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2aservererrorratiohigh
    - alert: A2APersistenceErrors
      expr: |
        sum by (job, operation) (increase(a2a_server_persistence_errors_total[1h])) > 0
          or
        sum by (job, operation) (a2a_server_persistence_errors_total unless a2a_server_persistence_errors_total offset 1h) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}: task writes failed in the last hour ({{ $labels.operation }})'
        description: The background processor could not persist a task write in the last hour. A streaming client already received those events, so the stored task and what clients saw have diverged; a later GetTask returns the wrong answer. It stays firing for an hour after the last failure. Sustained failures page as A2APersistenceFailing.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2apersistenceerrors
    - alert: A2APersistenceFailing
      expr: sum by (job, operation) (rate(a2a_server_persistence_errors_total[5m])) > 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.job }}: task writes keep failing ({{ $labels.operation }})'
        description: 'Task writes have failed in every five-minute window for 10 minutes: the store is refusing writes, not one write that failed. Every task updated meanwhile may read back wrong.'
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2apersistencefailing
    - alert: A2ARequestsUnanswered
      expr: a2a:server_unanswered:rate5m > 0.01
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}/{{ $labels.instance }}: requests without a response'
        description: 'Requests arrived that produced no response for 15 minutes: a panicking executor, dropped connections, or a process exiting mid-request.'
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2arequestsunanswered
    - alert: A2AQueueDepthGrowing
      expr: deriv(a2a_server_queue_depth[30m]) > 0 and a2a_server_queue_depth > 100
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}/{{ $labels.instance }}: {{ $value }} event queues and rising'
        description: Active event queues have grown for 30 minutes. Each open stream holds one; a depth that never comes down is subscribers that stopped reading without disconnecting.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2aqueuedepthgrowing
    - alert: A2APushDeliveryTruncated
      expr: sum by (job) (rate(a2a_server_push_deliveries_total{outcome="timeout_truncated"}[15m])) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}: push deliveries abandoned with retries left'
        description: 'push_delivery_timeout is shorter than the sender''s retry schedule, so deliveries are given up with attempts remaining. A configuration problem: it will not resolve on its own and no webhook reports it.'
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2apushdeliverytruncated
    - alert: A2APushDeliveryFailing
      expr: a2a:push_delivery_failure_ratio:rate5m > 0.2
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}: {{ $value | humanizePercentage }} of push deliveries not delivered'
        description: Over 20% of push-notification attempts failed, timed out or were cut short by push_delivery_timeout for 15 minutes. Split by outcome with a2a:push_deliveries:rate5m.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2apushdeliveryfailing
    - alert: A2AUnaryLatencyHigh
      expr: |
        a2a:rpc_server_unary_over_5s:ratio_rate5m > 0.01
          and on (job, rpc_method)
        a2a:rpc_server_unary_calls:rate5m > 0.1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }} {{ $labels.rpc_method }}: {{ $value | humanizePercentage }} of calls over 5 s'
        description: More than 1% of non-streaming calls took longer than 5 s for 15 minutes, while the method took more than 0.1 calls a second. Read from the 5 s bucket bound itself, so no interpolation. A blocking SendMessage includes the executor's work; set the threshold per method if your agents run long turns.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2aunarylatencyhigh
    - alert: A2AAgentSilent
      expr: |
        group by (job) (present_over_time(target_info[1d]))
          unless
        group by (job) (present_over_time(target_info[10m]))
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.job }}: no instance has pushed telemetry for 10 minutes'
        description: 'Over OTLP there is no scrape and so no `up` series; target_info comes with every export, so a job seen in the last day none of whose instances has sent any for 10 minutes has stopped, or its exporters have. Keyed on the job: a rollout or restart, which replaces instances, does not fire it, and it stays firing for a day.'
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2aagentsilent
    - alert: A2AAgentInstancesLost
      expr: |
        count by (job) (group by (job, instance) (present_over_time(target_info[10m])))
          <
        count by (job) (group by (job, instance) (present_over_time(target_info[10m] offset 1h)))
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}: {{ $value }} instance(s) pushing telemetry, fewer than an hour ago'
        description: 'Fewer instances of the job sent telemetry in the last 10 minutes than in the same 10 minutes an hour before: an instance stopped and was not replaced, or the job was scaled in. A rollout replaces instances and does not fire it. It resolves within the hour, once the smaller count is what the hour before saw too.'
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2aagentinstanceslost
    - alert: A2AStoreRetriesHigh
      expr: sum by (job, cause) (a2a:store_retries:rate5m) > 0.1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}: {{ printf "%.2f" $value }} store retries a second ({{ $labels.cause }})'
        description: Store operations have been run again after a failure more than 0.1 times a second for 15 minutes. Each retry passed, so nothing was lost yet; a rate that stays up is the store degrading before A2APersistenceErrors counts what it lost. A failover shows as a burst shorter than this.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2astoreretrieshigh
    - alert: A2AExecutorFailureRatioHigh
      expr: |
        a2a:executor_failure_ratio:rate5m > 0.1
          and on (job)
        sum by (job) (a2a:executor_runs:rate5m) > 0.05
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}: {{ $value | humanizePercentage }} of executor runs failed'
        description: More than 10% of the agent's executor runs returned an error or never returned (a panic, a dropped run) for 15 minutes, while it ran more than 0.05 a second. Timeouts and cancellations are not counted; split by outcome with a2a:executor_runs:rate5m.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2aexecutorfailureratiohigh
    - alert: A2AModelCallsFailing
      expr: |
        a2a:gen_ai_inference_error_ratio:rate5m > 0.1
          and on (job)
        a2a:gen_ai_inference_calls:rate5m > 0.05
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}: {{ $value | humanizePercentage }} of model calls failed'
        description: 'More than 10% of the tool loop''s model calls failed for 15 minutes, while it made more than 0.05 a second: the model provider is down, rate-limiting, or timing out. The GenAI dashboard splits them by model and error_type.'
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2amodelcallsfailing
    - alert: A2AClientErrorRatioHigh
      expr: |
        a2a:rpc_client_error_ratio:rate5m > 0.05
          and on (job, server_address)
        sum by (job, server_address) (a2a:rpc_client_calls:rate5m) > 0.1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.job }}: {{ $value | humanizePercentage }} of calls to {{ $labels.server_address }} failed over 5m'
        description: More than 5% of the calls {{ $labels.job }} made to the agent at {{ $labels.server_address }} failed for 10 minutes while it made more than 0.1 calls a second to it. Failed means the agent's failure or no answer at all (a timeout, a transport error, a response that did not decode); a call the caller abandoned or one refused as its own mistake (a 404, TaskNotFound) is not counted. Split by kind on the client dashboard's Failures by kind panel.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#a2aclienterrorratiohigh
  - name: a2a-rpc-server
    interval: 30s
    rules:
    - record: a2a:rpc_server_calls:rate5m
      expr: sum by (job, rpc_system_name, rpc_method) (rate(rpc_server_call_duration_seconds_count[5m]))
    - record: a2a:rpc_server_errors:rate5m
      expr: sum by (job, rpc_system_name, rpc_method) (rate(rpc_server_call_duration_seconds_count{error_type!="",error_type!~"cancelled|-32700|-32600|-32601|-32602|-32001|-32002|-32003|-32004|-32005|-32007|-32008|-32009|4[0-9][0-9]|CANCELLED|INVALID_ARGUMENT|NOT_FOUND|ALREADY_EXISTS|PERMISSION_DENIED|RESOURCE_EXHAUSTED|FAILED_PRECONDITION|ABORTED|OUT_OF_RANGE|UNAUTHENTICATED"}[5m]))
    - record: a2a:rpc_server_caller_errors:rate5m
      expr: sum by (job, rpc_system_name, rpc_method) (rate(rpc_server_call_duration_seconds_count{rpc_status_code=~"-32700|-32600|-32601|-32602|-32001|-32002|-32003|-32004|-32005|-32007|-32008|-32009|4[0-9][0-9]|CANCELLED|INVALID_ARGUMENT|NOT_FOUND|ALREADY_EXISTS|PERMISSION_DENIED|RESOURCE_EXHAUSTED|FAILED_PRECONDITION|ABORTED|OUT_OF_RANGE|UNAUTHENTICATED"}[5m]))
    - record: a2a:rpc_server_cancelled:rate5m
      expr: sum by (job, rpc_system_name, rpc_method) (rate(rpc_server_call_duration_seconds_count{error_type="cancelled"}[5m]))
    - record: a2a:rpc_server_error_ratio:rate5m
      expr: |
        sum by (job) (a2a:rpc_server_errors:rate5m)
          /
        sum by (job) (a2a:rpc_server_calls:rate5m)
    - record: a2a:rpc_server_unary_calls:rate5m
      expr: sum by (job, rpc_method) (rate(rpc_server_call_duration_seconds_count{rpc_method!~".*/(SendStreamingMessage|SubscribeToTask)"}[5m]))
    - record: a2a:rpc_server_unary_over_5s:ratio_rate5m
      expr: |
        1 - (
          sum by (job, rpc_method) (rate(rpc_server_call_duration_seconds_bucket{le=~"5|5\\.0"}[5m]))
            /
          a2a:rpc_server_unary_calls:rate5m
        )
    - record: a2a:rpc_server_unary_latency:p50_5m
      expr: histogram_quantile(0.50, sum by (job, rpc_method, le) (rate(rpc_server_call_duration_seconds_bucket{rpc_method!~".*/(SendStreamingMessage|SubscribeToTask)"}[5m])))
    - record: a2a:rpc_server_unary_latency:p95_5m
      expr: histogram_quantile(0.95, sum by (job, rpc_method, le) (rate(rpc_server_call_duration_seconds_bucket{rpc_method!~".*/(SendStreamingMessage|SubscribeToTask)"}[5m])))
    - record: a2a:rpc_server_unary_latency:p99_5m
      expr: histogram_quantile(0.99, sum by (job, rpc_method, le) (rate(rpc_server_call_duration_seconds_bucket{rpc_method!~".*/(SendStreamingMessage|SubscribeToTask)"}[5m])))
  - name: a2a-server
    interval: 30s
    rules:
    - record: a2a:server_unanswered:rate5m
      expr: |
        sum by (job, instance) (rate(a2a_server_requests_total[5m]))
          - sum by (job, instance) (rate(a2a_server_responses_total[5m]))
          - (sum by (job, instance) (rate(a2a_server_errors_total[5m])) or sum by (job, instance) (rate(a2a_server_requests_total[5m])) * 0)
    - record: a2a:server_errors_by_kind:rate5m
      expr: sum by (job, method, error) (rate(a2a_server_errors_total[5m]))
    - record: a2a:push_deliveries:rate5m
      expr: sum by (job, outcome) (rate(a2a_server_push_deliveries_total[5m]))
    - record: a2a:push_delivery_failure_ratio:rate5m
      expr: |
        sum by (job) (rate(a2a_server_push_deliveries_total{outcome!="delivered"}[5m]))
          /
        sum by (job) (rate(a2a_server_push_deliveries_total[5m]))
    - record: a2a:store_retries:rate5m
      expr: sum by (job, operation, cause) (rate(a2a_server_store_retries_total[5m]))
    - record: a2a:executor_runs:rate5m
      expr: sum by (job, outcome) (rate(a2a_server_executor_duration_seconds_count[5m]))
    - record: a2a:executor_failure_ratio:rate5m
      expr: |
        sum by (job) (a2a:executor_runs:rate5m{outcome=~"error|aborted"})
          /
        sum by (job) (a2a:executor_runs:rate5m)
  - name: a2a-rpc-client
    interval: 30s
    rules:
    - record: a2a:rpc_client_calls:rate5m
      expr: sum by (job, rpc_system_name, rpc_method, server_address) (rate(rpc_client_call_duration_seconds_count[5m]))
    - record: a2a:rpc_client_error_ratio:rate5m
      expr: |
        sum by (job, server_address) (rate(rpc_client_call_duration_seconds_count{error_type!="",error_type!~"cancelled|-32700|-32600|-32601|-32602|-32001|-32002|-32003|-32004|-32005|-32007|-32008|-32009|4[0-9][0-9]|CANCELLED|INVALID_ARGUMENT|NOT_FOUND|ALREADY_EXISTS|PERMISSION_DENIED|RESOURCE_EXHAUSTED|FAILED_PRECONDITION|ABORTED|OUT_OF_RANGE|UNAUTHENTICATED"}[5m]))
          /
        sum by (job, server_address) (rate(rpc_client_call_duration_seconds_count[5m]))
    - record: a2a:rpc_client_unary_latency:p95_5m
      expr: histogram_quantile(0.95, sum by (job, server_address, rpc_method, le) (rate(rpc_client_call_duration_seconds_bucket{rpc_method!~".*/(SendStreamingMessage|SubscribeToTask)"}[5m])))
  - name: a2a-genai
    interval: 30s
    rules:
    - record: a2a:gen_ai_inference_calls:rate5m
      expr: sum by (job) (rate(gen_ai_client_inference_duration_seconds_count[5m]))
    - record: a2a:gen_ai_inference_error_ratio:rate5m
      expr: |
        sum by (job) (rate(gen_ai_client_inference_duration_seconds_count{error_type!=""}[5m]))
          /
        a2a:gen_ai_inference_calls:rate5m
  - name: observability-stack
    rules:
    - alert: OTelCollectorDown
      expr: up{job="otelcol"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: The OpenTelemetry Collector at {{ $labels.instance }} cannot be scraped
        description: Prometheus has not reached the Collector's telemetry endpoint for 2 minutes. Every agent exporting through it is losing traces, metrics and logs (each SDK retries, then drops), so A2AAgentSilent follows for every job; Alertmanager holds those back while this fires.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#otelcollectordown
    - alert: OTelCollectorExportFailing
      expr: |
        sum by (job, instance, exporter) (rate({__name__=~"otelcol_exporter_send_failed_spans(_total)?", job="otelcol"}[5m])) > 0
          or
        sum by (job, instance, exporter) (rate({__name__=~"otelcol_exporter_send_failed_metric_points(_total)?", job="otelcol"}[5m])) > 0
          or
        sum by (job, instance, exporter) (rate({__name__=~"otelcol_exporter_send_failed_log_records(_total)?", job="otelcol"}[5m])) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Collector exporter {{ $labels.exporter }} is dropping data
        description: 'The Collector''s {{ $labels.exporter }} exporter has given up on items (retries exhausted) in every five-minute window for 10 minutes: its backend is down, refusing, or unreachable. What it gave up on is lost.'
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#otelcollectorexportfailing
    - alert: OTelCollectorRefusing
      expr: |
        sum by (job, instance, receiver) (rate({__name__=~"otelcol_receiver_refused_spans(_total)?", job="otelcol"}[5m])) > 0
          or
        sum by (job, instance, receiver) (rate({__name__=~"otelcol_receiver_refused_metric_points(_total)?", job="otelcol"}[5m])) > 0
          or
        sum by (job, instance, receiver) (rate({__name__=~"otelcol_receiver_refused_log_records(_total)?", job="otelcol"}[5m])) > 0
          or
        sum by (job, instance, receiver) (rate({__name__=~"otelcol_receiver_failed_spans(_total)?", job="otelcol"}[5m])) > 0
          or
        sum by (job, instance, receiver) (rate({__name__=~"otelcol_receiver_failed_metric_points(_total)?", job="otelcol"}[5m])) > 0
          or
        sum by (job, instance, receiver) (rate({__name__=~"otelcol_receiver_failed_log_records(_total)?", job="otelcol"}[5m])) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Collector receiver {{ $labels.receiver }} is refusing data
        description: The Collector has refused or failed incoming items for 10 minutes. Refused is usually memory_limiter pushing back (the container is near its memory limit); the agents retry and then drop.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#otelcollectorrefusing
    - alert: OTelCollectorQueueFilling
      expr: |
        max by (job, instance, exporter) (otelcol_exporter_queue_size{job="otelcol"})
          /
        max by (job, instance, exporter) (otelcol_exporter_queue_capacity{job="otelcol"})
          > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Collector exporter {{ $labels.exporter }} queue is {{ $value | humanizePercentage }} full
        description: 'The exporter''s sending queue has stayed over 80% full for 5 minutes: its backend is slower than the traffic or not answering. A full queue refuses new items, and they are lost.'
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#otelcollectorqueuefilling
    - alert: PrometheusRuleEvaluationFailing
      expr: sum by (job, instance, rule_group) (rate(prometheus_rule_evaluation_failures_total[5m])) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Prometheus cannot evaluate rule group {{ $labels.rule_group }}
        description: Rules in {{ $labels.rule_group }} have failed to evaluate for 10 minutes. An alert whose rule cannot evaluate never fires, so the alerts in that group are blind until this is fixed. The rule's lastError is on Prometheus's Rules page.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#prometheusruleevaluationfailing
    - alert: PrometheusNotificationsFailing
      expr: sum by (job, instance, alertmanager) (rate(prometheus_notifications_errors_total[5m])) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Prometheus cannot send alerts to {{ $labels.alertmanager }}
        description: Sending alerts to the Alertmanager has failed for 10 minutes, so firing alerts notify nobody. Shown on Prometheus's Alerts page and here, which is all there is while Alertmanager is unreachable.
        runbook_url: https://a2a-rust.com/deployment/observability/alerts.html#prometheusnotificationsfailing
