scope = "This SDK's client and server complete A2A calls over gRPC with TLS (and mutual TLS), and a TLS listener refuses a plaintext client. gRPC runs over HTTP/2 by construction (tonic). As with AUTH-TLS-001, plaintext gRPC is still served when a deployment configures no TLS."
tests = [
