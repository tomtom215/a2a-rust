  "crates/a2a-protocol-types/src/signing.rs::sign_and_verify_card_in_wire_shape",
]

[[requirement]]
id = "CARD-SIGN-003"
title = "Signature protected header includes required parameters"
section = "8.4.2"
level = "MUST"
upstream = "Tagged NOT_AUTOMATABLE in tck/requirements/agent_card.py; also backlog task-29 (To Do)."
scope = "Every signer writes `alg`, `typ` and `kid` in the protected header, ES256 and EdDSA, with and without `jku`. The two kid-optional signers (`sign_agent_card`, `sign_agent_card_ed25519`), deprecated for omitting `kid`, were removed in 0.15.0."
tests = [
  "crates/a2a-protocol-types/tests/tck_card_signing.rs::card_sign_003_every_signer_writes_alg_and_kid",
  "crates/a2a-protocol-types/tests/signing_tests.rs::protected_header_carries_alg_typ_and_kid",
  "crates/a2a-protocol-types/tests/signing_tests.rs::eddsa_protected_header_carries_alg_typ_and_kid",
]

[[requirement]]
id = "CARD-SIGN-004"
title = "Expired or revoked keys must not be used for verification"
section = "8.4.3"
level = "MUST"
upstream = "Tagged NOT_AUTOMATABLE in tck/requirements/agent_card.py; also backlog task-29 (To Do)."
scope = "A JWKS key past its `exp` is no verification candidate, and a key removed from the set no longer verifies (docs/official-tck-findings.md §19: key lifecycle is the caller's, expressed through the key set). A key carrying `x5c` is used only while its leaf certificate is valid and holds the JWK's own key. Not covered: validating the chain to a trust anchor and CRL/OCSP revocation."
tests = [
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::an_expired_key_is_not_used",
  "crates/a2a-protocol-types/src/signing/keys/tests.rs::removing_a_key_from_the_set_revokes_it",
  "crates/a2a-protocol-types/src/signing/keys/x5c/tests.rs::x5c_expired_leaf_is_not_used",
  "crates/a2a-protocol-types/src/signing/keys/x5c/tests.rs::x5c_not_yet_valid_leaf_is_not_used",
  "crates/a2a-protocol-types/src/signing/keys/x5c/tests.rs::x5c_leaf_holding_another_key_is_not_used",
]

[[requirement]]
id = "AUTH-TLS-001"
title = "Production deployments must use encrypted communication"
section = "7.1"
level = "MUST"
upstream = "Tagged NOT_AUTOMATABLE in tck/requirements/auth.py; also backlog task-27 (To Do)."
scope = "A deployment requirement, so the evidence is capability, not enforcement: the SDK serves HTTPS (HTTP/1.1 and HTTP/2), wss:// and gRPC over TLS, answers nothing to plaintext on a TLS listener, its client connects over TLS, and a client built with `require_https_credentials` refuses to send a credential over plaintext to a non-loopback host. The SDK cannot know whether a deployment is production: it serves plaintext when configured to, and by default the client warns rather than refuses."
tests = [
  "crates/a2a-protocol-server/tests/serve_tls.rs::the_agent_card_is_served_over_https_on_http1_and_http2",
  "crates/a2a-protocol-server/tests/serve_tls.rs::a_plaintext_request_gets_no_http_answer",
  "crates/a2a-protocol-server/tests/websocket_tls_origin.rs::a_request_is_served_over_wss",
  "crates/a2a-protocol-sdk/tests/grpc_server_tls_e2e.rs::tls_client_round_trips_through_the_tls_dispatcher",
  "crates/a2a-protocol-client/tests/tls_integration_tests.rs::tls_client_connects_to_tls_server_with_custom_ca",
  "crates/a2a-protocol-client/tests/credentials_plaintext.rs::a_credential_to_a_plaintext_remote_agent_is_refused_before_sending",
]

