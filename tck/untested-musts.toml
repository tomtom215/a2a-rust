upstream = "Has a test (tests/compatibility/core_operations/test_error_handling.py, TestExtendedCardNotConfigured) whose precondition is unreachable on this SDK's SUT: tck/sut configures the extended card its card declares, which CARD-EXT-001 needs, so the probe finds a card and the test is SKIPPED. One SUT cannot hold both preconditions."
