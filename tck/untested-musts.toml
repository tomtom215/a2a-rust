#
# The official A2A TCK's MUST requirements that its suite does not grade
# against this SDK, and this repository's own tests for each.
#
# Measured against a2aproject/a2a-tck at 263b9cf: 21 of them have no test
# function in its `tests/` tree at all (docs/official-tck-findings.md §16 and
# §24), and one, CARD-EXT-002, has a test whose precondition this SDK's SUT
# cannot meet, so it is always SKIPPED. They are therefore *not graded by the
# official suite*, and nothing here changes that. What this file adds is
# in-repo evidence: for each requirement, the tests in this repository that
# assert it, so the claim "this SDK meets it" names something a reader can
# run.
#
# `scripts/check_tck_untested_map.py` (CI, `ci.yml`) fails when an entry has
# no tests, cites a test that does not exist or is ignored, or an id appears
# twice. `id`, `title`, `section` and `level` are copied from the suite's
# `tck/requirements/*.py`.
#
# `upstream` says why the suite does not grade it; `scope` says exactly what
# the cited tests show and, where it applies, what they do not.

[[requirement]]
id = "CARD-SIGN-001"
title = "Agent Card canonicalized with JCS before signing"
section = "8.4.1"
level = "MUST"
upstream = "Tagged NOT_AUTOMATABLE in tck/requirements/agent_card.py; also backlog task-29 (To Do)."
scope = "The signature verifies, under ring, over a JWS signing input the test builds from the RFC 8785 canonical card, and not over the plain serialization; the canonicalizer passes RFC 8785's own vectors and §8.4.1's worked example."
tests = [
  "crates/a2a-protocol-types/tests/tck_card_signing.rs::card_sign_001_the_signed_payload_is_the_jcs_canonical_card",
  "crates/a2a-protocol-types/tests/rfc8785_vectors.rs::rfc8785_appendix_b_from_json_text",
  "crates/a2a-protocol-types/src/signing/presence/tests.rs::the_specification_example_canonicalizes_as_published",
]

[[requirement]]
id = "CARD-SIGN-002"
title = "Signatures field excluded from signed content"
section = "8.4.1"
level = "MUST"
upstream = "Tagged NOT_AUTOMATABLE in tck/requirements/agent_card.py; also backlog task-29 (To Do)."
scope = "The canonical payload of a card with `signatures` populated equals the unsigned card's and has no `signatures` key; a served card, and one carrying a second signature, still verifies."
