section = "7.6.1"
level = "MUST"
upstream = "Backlog task-27 (To Do)."
scope = "The credential reaches the executor outside A2A (a test signal stands in for the out-of-band channel) and the task resumes to COMPLETED with no further client message: on the open stream, after a blocking send, and over the wire by subscription and by polling. The task's state grants no in-band authorization. The out-of-band channel itself is the agent author's; the SDK's part is keeping the task resumable."
