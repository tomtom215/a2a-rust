[package]
name        = "a2a-tck"
version     = "0.2.0"
description = "A2A protocol v1.0 Technology Compatibility Kit (TCK) — tests any A2A server for conformance"
publish     = false

edition.workspace    = true
rust-version.workspace = true
license.workspace    = true

[[bin]]
name = "a2a-tck"
path = "src/main.rs"

[dependencies]
a2a-protocol-types  = { path = "../crates/a2a-protocol-types" }
a2a-protocol-client = { path = "../crates/a2a-protocol-client" }

serde_json     = { workspace = true }
serde          = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
hyper          = { workspace = true }
hyper-util     = { workspace = true, features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = { workspace = true }
uuid           = { workspace = true }

# WebSocket binding. Version-matched to a2a-protocol-client's optional deps so
# the workspace resolves one copy. The TCK speaks the wire directly rather than
# going through our own client: a conformance kit that drives the
# implementation's client would let a symmetric client/server bug cancel out.
tokio-tungstenite = { version = ">=0.29, <0.30" }
futures-util      = { version = ">=0.3.30, <0.4", default-features = false, features = ["sink"] }
