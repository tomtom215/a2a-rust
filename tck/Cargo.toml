[package]
name        = "a2a-tck"
version     = "0.2.0"
description = "A2A protocol v1.0 Technology Compatibility Kit (TCK) — tests any A2A server for conformance"
publish     = false

edition.workspace    = true
rust-version.workspace = true
license.workspace    = true

[[bin]]
name = "a2a-tck"
path = "src/main.rs"

[dependencies]
# Deliberately no dependency on a2a-protocol-{types,client}. A conformance kit
# that imports the implementation it grades shares the implementation's
# understanding of the spec, and a symmetric misreading passes. The TCK builds
# every request from the wire format up — including its own protobuf codegen,
# see build.rs.

serde_json     = { workspace = true }
serde          = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
hyper          = { workspace = true }
hyper-util     = { workspace = true, features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = { workspace = true }
uuid           = { workspace = true }

# WebSocket binding (§12). Version-matched to a2a-protocol-client's optional
# deps so the workspace resolves one copy.
tokio-tungstenite = { version = ">=0.29, <0.30" }
futures-util      = { version = ">=0.3.30, <0.4", default-features = false, features = ["sink"] }

# gRPC binding (§10). The generated client and message types are the TCK's own
# (build.rs), compiled from tck/proto — not re-exported from the workspace.
tonic       = { workspace = true }
tonic-prost = { workspace = true }
prost       = { workspace = true }
prost-types = { workspace = true }
tokio-stream = { workspace = true }

[build-dependencies]
tonic-prost-build   = { workspace = true }
protoc-bin-vendored = { workspace = true }
