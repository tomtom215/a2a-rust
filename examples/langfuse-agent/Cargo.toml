[package]
name        = "langfuse-agent"
version     = "0.0.0"
description = "Two A2A agents, one delegating to the other, traced into one Langfuse trace with the SDK's own telemetry"
publish     = false

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[dependencies]
a2a-protocol-sdk   = { path = "../../crates/a2a-protocol-sdk", features = ["otel"] }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry", "env-filter"] }

[dev-dependencies]
# The test records into an in-memory exporter instead of Langfuse, so it runs
# with no network and no keys.
opentelemetry         = { version = "0.32" }
opentelemetry_sdk     = { version = "0.33", features = ["trace", "testing"] }
tracing-opentelemetry = { version = ">=0.33, <0.34", default-features = false }
