[package]
name        = "a2a-example-harness"
version     = "0.0.0"
description = "Coverage matrix shared by the examples: which A2A methods ran over which bindings"
publish     = false

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[dependencies]
a2a-protocol-types  = { path = "../../crates/a2a-protocol-types" }
a2a-protocol-client = { path = "../../crates/a2a-protocol-client", features = ["websocket", "grpc"] }
# For `go_sdk_interop` only: the SDK's `Telemetry` (`otlp`), which exports when
# `OTEL_EXPORTER_OTLP_ENDPOINT` names a collector.
a2a-protocol-server = { path = "../../crates/a2a-protocol-server", features = ["otlp"] }
tracing-subscriber  = { workspace = true }
uuid                = { workspace = true }
tokio               = { workspace = true, features = ["time"] }

[dev-dependencies]
# One test builds a `ClientError::Serialization` to prove it is not counted as
# a protocol refusal. A dev-dependency, so the example's own dependency
# surface is unchanged.
serde_json = { workspace = true }
