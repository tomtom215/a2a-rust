[package]
name        = "multi-lang-team"
version     = "0.0.0"
description = "Multi-language agent team: Rust coordinator + Python/JS/Go/Java/Rust worker agents"
publish     = false
# Two binaries: the coordinator (`src/main.rs`) and the Rust worker
# (`src/bin/rust-worker.rs`). `cargo run -p multi-lang-team` keeps meaning
# the coordinator, as every workflow and README that names it assumes.
default-run = "multi-lang-team"

edition.workspace    = true
rust-version.workspace = true
license.workspace    = true

[dependencies]
a2a-protocol-types  = { path = "../../crates/a2a-protocol-types" }
a2a-protocol-client = { path = "../../crates/a2a-protocol-client", features = ["websocket", "grpc"] }
a2a-example-harness = { path = "../harness" }
a2a-protocol-server = { path = "../../crates/a2a-protocol-server", features = ["websocket", "grpc"] }

serde_json     = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
hyper          = { workspace = true }
hyper-util     = { workspace = true, features = ["server", "server-auto"] }
http-body-util = { workspace = true }
bytes          = "1"
uuid           = { workspace = true }

[dev-dependencies]
# `start_paused` for the slow-marker test, so it asserts on a virtual clock
# instead of sleeping 400ms on every CI run.
tokio = { workspace = true, features = ["test-util"] }
