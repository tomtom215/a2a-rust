[package]
name        = "mcp-a2a-agent"
version     = "0.0.0"
description = "An A2A agent whose tools come from an MCP server it discovers at startup — A2A between agents, MCP to tools, with neither protocol knowing about the other"
publish     = false

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[dependencies]
# Message ids. This example hand-rolled a nanosecond timestamp to avoid
# this dependency; the workspace already carries it and seven other
# examples use it, and a timestamp is not unique under concurrency.
uuid = { workspace = true }
a2a-protocol-types  = { path = "../../crates/a2a-protocol-types" }
a2a-protocol-client = { path = "../../crates/a2a-protocol-client" }
a2a-protocol-server = { path = "../../crates/a2a-protocol-server" }

serde_json     = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-std", "process"] }
hyper          = { workspace = true }
hyper-util     = { workspace = true, features = ["server", "server-auto"] }

# rig — the model side. The tool loop is the same shape as `examples/rig-agent`'s
# on purpose; the diff between the two is where the tools come from, and nothing
# else. See README.md.
rig-core = "0.42"

# rmcp — the official Rust MCP SDK (github.com/modelcontextprotocol/rust-sdk).
#
# `client` for the agent, `server` (a default) for the bundled tool server,
# `transport-child-process` for the stdio spawn a real MCP client does, and
# `transport-io` so the server can speak over its own stdin/stdout.
rmcp = { version = "3.4", features = [
    "client",
    "transport-child-process",
    "transport-io",
] }
schemars = "1"
serde    = { workspace = true }

[[bin]]
name = "mcp-a2a-agent"
path = "src/main.rs"

[[bin]]
name = "mcp-tool-server"
path = "src/bin/tool_server.rs"
