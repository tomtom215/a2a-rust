#
# A Kubernetes Deployment and Service for deploy-agent.
#
# Every field below is here because omitting it breaks something specific; the
# comments say which. Apply with:
#   kubectl apply -f examples/deploy-agent/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-agent
  labels:
    app: deploy-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploy-agent
  template:
    metadata:
      labels:
        app: deploy-agent
    spec:
      # Must exceed the shutdown budget in main.rs (up to 5 s + 10 s for
      # in-flight tasks, the HTTP drain, then one 5 s budget for the queue
      # drain and the cleanup hook) plus, with telemetry on, the flush that
      # runs as main returns: up to 15 s when the collector accepts
      # connections and never answers, 1.8 s when it refuses them (measured on
      # hello-agent, 2026-10-26). Otherwise SIGKILL arrives before the drain or
      # the flush finishes and the shutdown is cut short.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: agent
          image: deploy-agent:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            # The externally reachable URL. This is what goes on the agent
            # card, and it is not derivable from inside the pod — get it wrong
            # and clients read the card, call the address on it, and fail.
            - name: AGENT_URL
              value: "http://deploy-agent.default.svc.cluster.local"
            # Telemetry: nothing is exported until a collector is named.
            # Uncomment to send traces, metrics and logs to one in the
            # cluster (OTLP/HTTP is port 4318; 4317 is gRPC and also needs
            # OTEL_EXPORTER_OTLP_PROTOCOL=grpc). A `$(NAME)` in a value is
            # Kubernetes's, and NAME must be defined earlier in this list.
            # `service.instance.id` is what tells the replicas apart; without
            # it each process invents a random one.
            # - name: POD_NAME
            #   valueFrom: {fieldRef: {fieldPath: metadata.name}}
            # - name: POD_NAMESPACE
            #   valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "http://otel-collector.observability.svc.cluster.local:4318"
            # - name: OTEL_RESOURCE_ATTRIBUTES
            #   value: "service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)"
          # Liveness restarts a wedged process. It points at /healthz, which
          # checks nothing on purpose: a liveness probe with a dependency turns
          # that dependency's outage into a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          # Readiness gates traffic. Separate endpoint so that when this agent
          # gains a dependency worth waiting for, only /readyz changes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: deploy-agent
spec:
  selector:
    app: deploy-agent
  ports:
    - port: 80
      targetPort: http
      name: http
