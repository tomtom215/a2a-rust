#
# A Kubernetes Deployment, Service and PodDisruptionBudget for deploy-agent.
#
# Every field below is here because omitting it breaks something specific; the
# comments say which. Before applying, create the database Secret and set the
# image (README, "Kubernetes"). Then:
#   kubectl apply -f examples/deploy-agent/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-agent
  labels:
    app: deploy-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploy-agent
  # One new pod up and ready before an old one is taken down, so a rollout
  # never leaves fewer pods serving than it started with.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: deploy-agent
    spec:
      # Must exceed the shutdown budget in main.rs: DRAIN_DELAY_SECONDS (5),
      # up to 5 s for tasks to end on their own, then cancellation and up to
      # 10 s for the executors to act on it, up to 10 s of connection drain,
      # up to 5 s for the cleanup hook and the release of the turn claims,
      # then, with telemetry on, the flush as main returns: up to 15 s when
      # the collector accepts connections and never answers, 1.8 s when it
      # refuses them (measured on hello-agent, 2026-10-26). 35 s without
      # telemetry; 50 s with it. Otherwise SIGKILL arrives before the drain
      # or the flush finishes, the turn claims are left to expire (15 s, then
      # another replica takes the tasks over), and the shutdown is cut short.
      terminationGracePeriodSeconds: 60
      # The agent calls no Kubernetes API: no token to steal.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # Pod Security Standards "restricted" refuses a pod without it.
        seccompProfile:
          type: RuntimeDefault
      # Two replicas on one node are one failure. Spread across nodes (and
      # zones, where the cluster has them), but still schedule on a one-node
      # cluster (ScheduleAnyway).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: deploy-agent
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: deploy-agent
      containers:
        - name: agent
          # The image the release workflow publishes, signed and with build
          # provenance (README, "Verify the image"); it exists from 0.16.0 on.
          # For a build of your own, push it to a registry the cluster can
          # reach and set this to it, or on kind run
          # `kind load docker-image deploy-agent:dev` and use that name here:
          # IfNotPresent is what lets a loaded image be used, where the
          # `:latest` default would pull from Docker Hub, which has none.
          image: ghcr.io/tomtom215/a2a-rust/deploy-agent:0.16.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            # The externally reachable URL. This is what goes on the agent
            # card, and it is not derivable from inside the pod — get it wrong
            # and clients read the card, call the address on it, and fail.
            # The in-cluster name below suits callers in this namespace; set
            # the URL your ingress serves for callers outside it.
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: AGENT_URL
              value: "http://deploy-agent.$(POD_NAMESPACE).svc.cluster.local"
            # On SIGTERM the pod answers /ready with 503 at once and goes on
            # serving for this long, while the Service's endpoints and every
            # proxy in front learn it is leaving. Without it, requests still
            # routed to the pod are refused on every rollout.
            - name: DRAIN_DELAY_SECONDS
              value: "5"
            # Two replicas behind one Service need one task store: without
            # it, a task created on one pod is not found on the other, and
            # half of all GetTask calls answer TaskNotFound (measured with two
            # processes behind a round-robin balancer, 2026-10-28). PostgreSQL
            # holds the tasks and push configs, and its turn claims let one
            # pod at a time run a task, so the Service needs no session
            # affinity. Create the Secret first:
            #   kubectl create secret generic deploy-agent-db \
            #     --from-literal=url='postgres://USER:PASSWORD@HOST:5432/DB?sslmode=verify-full&sslrootcert=/path/ca.pem'
            # Not optional on purpose: a pod with no database would start, run
            # in memory, and lose tasks behind the balancer. For one replica
            # with no database, delete this entry and set `replicas: 1`.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deploy-agent-db
                  key: url
            # How long a finished task is kept in PostgreSQL. The agent sweeps
            # its own database hourly: without PostgreSQL the in-memory store
            # keeps an hour, and the SDK's PostgreSQL stores keep everything for
            # ever unless something deletes. 168 (a week) is the default; 0 keeps
            # everything, and then a purge of your own is yours to schedule.
            # - name: TASK_RETENTION_HOURS
            #   value: "168"
            # Telemetry: nothing is exported until a collector is named.
            # Uncomment to send traces, metrics and logs to one in the
            # cluster (OTLP/HTTP is port 4318; 4317 is gRPC and also needs
            # OTEL_EXPORTER_OTLP_PROTOCOL=grpc). A `$(NAME)` in a value is
            # Kubernetes's, and NAME must be defined earlier in this list.
            # `service.instance.id` is what tells the replicas apart; without
            # it each process invents a random one.
            # - name: POD_NAME
            #   valueFrom: {fieldRef: {fieldPath: metadata.name}}
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "http://otel-collector.observability.svc.cluster.local:4318"
            # - name: OTEL_RESOURCE_ATTRIBUTES
            #   value: "service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)"
          # Startup: the port opens only once the database has answered and
          # its schema is in place, which a cold or busy database can take
          # tens of seconds to do. Liveness and readiness wait for this probe,
          # so a slow start is not killed as a hung one (2 s × 45 = 90 s).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 45
          # Liveness restarts a wedged process. It points at /health, which
          # checks nothing on purpose: a liveness probe with a dependency turns
          # that dependency's outage into a restart loop.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          # Readiness gates traffic: 503 while the task store fails its
          # health check (one statement, whatever the table's size) and while
          # the pod is draining.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            # Above the 2 s the readiness check gives the database before it
            # answers 503 timeout.
            timeoutSeconds: 3
          # A CA for PostgreSQL that is not a public one (an internal CA, or
          # the provider's own) is a file the pod must be able to read: the
          # database connection trusts Mozilla's roots plus the file
          # `sslrootcert` names (the server crate's `postgres` feature), and a
          # database's own CA is usually not among those roots. Create the
          # ConfigMap from the CA (`kubectl create configmap db-ca
          # --from-file=ca.pem`), uncomment this and the `volumes:` entry
          # below, and put `sslrootcert=/etc/db-ca/ca.pem` in the Secret's URL.
          # A mounted volume is not part of the read-only root filesystem.
          # volumeMounts:
          #   - {name: db-ca, mountPath: /etc/db-ca, readOnly: true}
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      # volumes:
      #   - name: db-ca
      #     configMap: {name: db-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: deploy-agent
spec:
  selector:
    app: deploy-agent
  ports:
    - port: 80
      targetPort: http
      name: http
---
# A node drain (an upgrade, an autoscaler) takes at most one replica at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: deploy-agent
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: deploy-agent
