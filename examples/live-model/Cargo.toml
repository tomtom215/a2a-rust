[package]
name        = "live-model"
version     = "0.0.0"
description = "The SDK end to end with a real model: the tool loop on every binding, provenance, idempotency, budgets, delegation, halt and a two-approver quorum"
publish     = false

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[dependencies]
a2a-protocol-sdk = { path = "../../crates/a2a-protocol-sdk", features = ["tool-loop", "grpc", "websocket", "signing"] }
# An Ed25519 key for the content signer; ring is already in the SDK's graph.
ring             = "0.17"
serde_json       = { workspace = true }
tokio            = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
uuid             = { workspace = true }
