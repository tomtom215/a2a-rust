#
# osv-scanner reads this file for the Cargo.lock in this directory (`osv.yml`).
# Each entry carries its evidence and a date on which it stops applying and
# must be re-examined. The same entry is in the repository root's
# osv-scanner.toml, which says more.
#
# History: GHSA-qwgh-2vcv-g2f7 (block-buffer 0.10.4) was waived on 2026-10-29
# and removed on 2026-11-11. OSV narrowed that advisory on 2026-10-30 to
# block_buffer 0.11.0 up to, not including, 0.12.1, so 0.10.4 is outside it;
# the lockfiles here hold 0.10.4 and 0.12.1, and osv-scanner 2.7.0 reported
# the waiver as unused in all four files that carried it. The Miri check that
# found the mechanism absent from 0.10.4 stands in the git history of this file.

# RUSTSEC-2026-0459 (libsqlite3-sys < 0.39.0, bundled SQLite before 3.54.0).
# The lockfile records 0.37.0 through sqlx-sqlite 0.9.0, the latest sqlx, but
# the harness builds it only with its opt-in `sqlite` feature (default off:
# `cargo tree -i libsqlite3-sys` matches no package without it), and then opens
# only the file named by the operator's SQLITE_URL (src/main.rs).
[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-02-11
reason = "libsqlite3-sys 0.37 via sqlx-sqlite 0.9.0, the latest sqlx (checked 2026-11-14); built only with the harness's opt-in `sqlite` feature, which opens the operator's own SQLITE_URL. Remove when sqlx allows libsqlite3-sys >= 0.39."
